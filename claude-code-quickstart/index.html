<script>window.COURSE_DATA={title:"Claude Code 快速上手指南",storageKey:"claude-code-quickstart",subtitle:"從零開始掌握 Claude Code CLI，用 AI 打造你的第一個產品",stance:[{title:"立場一：AI 寫程式是技能放大器，不是取代品",body:"本課程認為 Claude Code 等 AI coding 工具是將你的想法快速落地的加速器。它不會取代理解程式碼的能力，反而會讓你更需要理解「該做什麼」和「為什麼這樣做」。我們鼓勵你在使用 AI 的同時，培養判斷力和架構思維。"},{title:"立場二：動手做比看影片更重要",body:"每個單元的影片是學習的起點，不是終點。我們設計了自我檢核和實作練習，鼓勵你在看完影片後立刻打開終端機動手操作。犯錯是學習的一部分，Claude Code 的 checkpoint 機制讓你隨時可以回退，放膽嘗試。"},{title:"立場三：本站為教學資源策展（免責聲明）",body:"本站為 YouTube 教學資源的策展與學習路徑整理，僅供教育用途。所有影片內容的版權歸屬原頻道與創作者，本站不擁有任何影片內容。課程中提及的工具、服務名稱均為各公司的商標。AI 工具快速演進中，部分功能或操作方式可能已有更新，建議搭配官方文件使用。"}],parts:[{id:"start",name:"啟程篇",chapters:[{id:"ch1",name:"AI 寫程式的時代",icon:"🚀",units:[{id:"u-ai-coding-revolution",name:"2026 年的 AI Coding 革命",tags:["注意時效"],mainVideo:{youtubeId:"iLCDSY2XX7E",title:"Vibe Coding Fundamentals In 33 minutes",channel:"Tina Huang",duration:2002,views:978847,uploadDate:"20250519",note:"Tina Huang 用 33 分鐘完整介紹 vibe coding 的核心概念與實際操作。選這支是因為她從資料科學背景出發，用非工程師也能理解的方式解釋 AI coding 的威力，適合完全新手建立第一印象。重點看她如何用自然語言描述需求並讓 AI 產出可運行的程式碼。"},selfCheck:"你能用自己的話解釋什麼是 vibe coding 嗎？AI coding 工具和傳統 IDE 的自動補全有什麼根本差異？為什麼說 2025-2026 是 AI 寫程式的轉折點？你能舉出至少三種 AI coding 工具可以幫你完成的任務類型嗎？",mistakes:"最常見的錯誤是以為 AI coding 工具可以完全取代學習程式概念。另一個陷阱是花太多時間比較工具，卻遲遲不動手實際操作。先選一個工具開始用，邊做邊學效率最高。",skills:["用自然語言向 AI 描述一個你想解決的簡單問題，觀察它的回應","列出 3 個你目前手動完成但可能用 AI 加速的工作任務","在 YouTube 搜尋一支 AI coding demo 影片，觀察操作者如何與 AI 互動"],extVideos:[{youtubeId:"zqiYTXiQq-0",title:"AI Coding Tools Ranked from Worst to Best (2026)",channel:"Mikey No Code",duration:2027,views:103466,uploadDate:"20260204",note:"2026 年主流 AI coding 工具的橫向比較與排名"},{youtubeId:"pvMGRSZJ4Jw",title:"Best AI Coding Tools for Developers in 2026",channel:"Codevolution",duration:515,views:88936,uploadDate:"20260105",note:"從開發者視角介紹 2026 年最佳 AI coding 工具"},{youtubeId:"libNzUdL9eM",title:"Dave Farley - Vibe Coding - Is this really the best we can do? - AI Native DevCon June 2026",channel:"AI Native Dev",duration:1925,views:1442,uploadDate:"20260725",note:"資深工程師的反思：vibe coding 的侷限與批判視角"}]},{id:"u-what-is-claude-code",name:"Claude Code 是什麼？它能做到什麼？",tags:[],mainVideo:{youtubeId:"fl1DSmwQKKY",title:"What is Claude Code?",channel:"Claude",duration:175,views:7396594,uploadDate:"20260505",note:"Anthropic 官方頻道的 Claude Code 介紹影片，不到 3 分鐘快速展示核心能力。選這支因為它來自官方、資訊最準確，且用實際操作示範了讀取程式碼、編輯檔案、執行指令等關鍵功能。看完你就能理解 Claude Code 和一般 AI 聊天機器人的根本差異。"},selfCheck:"你能說出 Claude Code 和一般 ChatGPT 對話的三個主要差異嗎？Claude Code 可以直接操作你電腦上的哪些東西？它使用的是哪個 AI 模型？Claude Code 目前有哪些使用介面（CLI、IDE、桌面版等）？",mistakes:"新手常以為 Claude Code 只是另一個聊天視窗。事實上它是一個 agentic 工具——它會主動探索你的程式碼庫、規劃方案、執行修改、跑測試。把它當「會寫程式的助手」而非「聊天機器人」才能發揮真正威力。",skills:["觀看官方影片後，用自己的話寫下 Claude Code 的三個核心能力","列出 Claude Code 可用的介面（CLI、VS Code、桌面版等），標記你打算先使用哪一個","搜尋 Claude Code 的訂閱方案，了解不同方案的差異"],extVideos:[{youtubeId:"6bs5b4FltCU",title:"How Claude Code Works",channel:"Claude",duration:170,views:551820,uploadDate:"20260514",note:"官方頻道深入解說 Claude Code 的運作原理"},{youtubeId:"AJpK3YTTKZ4",title:"Introducing Claude Code",channel:"Anthropic",duration:234,views:967904,uploadDate:"20250224",note:"Anthropic 官方發布影片，了解產品的起源與定位"},{youtubeId:"ntDIxaeo3Wg",title:"Claude Code - Full Tutorial for Beginners",channel:"Tech With Tim",duration:2148,views:1479305,uploadDate:"20260227",note:"Tech With Tim 的完整新手教學，適合想深入了解的人"}]}]},{id:"ch2",name:"準備出發",icon:"⚙️",units:[{id:"u-install-setup",name:"安裝與設定（全平台指南）",tags:["注意時效"],mainVideo:{youtubeId:"CaHTlfHWd8U",title:"How to Install Claude Code on Windows 11 | How to Set Up Claude Code (2026)",channel:"ProgrammingKnowledge",duration:598,views:207366,uploadDate:"20260211",note:"詳細的 Windows 安裝步驟示範，從下載 Node.js 到登入帳號全程錄製。選這支因為大多數新手使用 Windows，ProgrammingKnowledge 的步驟講解非常仔細。重點注意安裝指令和登入認證的步驟，跟著做就能完成設定。"},selfCheck:"你知道安裝 Claude Code 需要先安裝什麼嗎？你能說出至少兩種安裝 Claude Code 的方法嗎（npm、原生安裝器等）？安裝完成後，你要怎麼登入你的 Anthropic 帳號？你知道哪些訂閱方案可以使用 Claude Code 嗎？",mistakes:"安裝時最常見的問題是 Node.js 版本太舊或沒有加入 PATH。另外很多人忘記安裝完要先執行 claude 登入認證。不要跳過登入步驟直接開始用，否則會一直收到認證錯誤。",skills:["在你的電腦上安裝 Claude Code CLI 並確認版本號","完成登入認證，確認 claude 指令可以正常啟動
