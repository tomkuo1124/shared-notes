<script>window.COURSE_DATA={title:"AI 開發入門指南",storageKey:"ai-dev-beginner",subtitle:"從零開始，用專案驅動學習，讓 AI 成為你的開發夥伴",stance:[{title:"這門課的理念：做中學",body:"學 AI 最有效的方式不是背理論，而是用 AI 做出你想要的東西。這門課的每個單元都指向一個行動——看完影片後你應該能動手做些什麼。從專案中學，比任何課本都快。"},{title:"為什麼是 Claude Code",body:"Claude Code 是目前最強大的 AI 開發工具之一，但這門課教的方法適用於所有 AI 工具。工具會迭代、會被取代，但「如何跟 AI 協作」的思維框架不會過時。學會用一個工具，遷移到其他工具只需要幾小時。"},{title:"免責聲明",body:"本課程為 YouTube 教學資源的策展與學習路徑整理，僅供教育用途。所有影片版權屬原頻道所有。AI 工具與介面可能隨時更新，請以各工具官方文件為準。"}],parts:[{id:"newbie-village",name:"AI 時代新手村",chapters:[{id:"ch1",name:"重新認識 AI",icon:"🤖",units:[{id:"u-what-is-ai",name:"AI 到底是什麼？一般人需要知道的事",tags:["觀念主題"],mainVideo:{youtubeId:"Yq0QkCxoTHM",title:"Google's AI Course for Beginners (in 10 minutes)!",channel:"Jeff Su",duration:557,views:3660478,uploadDate:"20231114",note:"十分鐘濃縮 Google 官方 AI 入門課程的精華，用日常比喻解釋機器學習、深度學習、生成式 AI 的差別。作為第一支影片最合適——先建立大局觀，後面的工具選擇才有意義。"},selfCheck:"看完後你應該能回答：AI、機器學習、深度學習這三者是什麼關係？生成式 AI 和傳統 AI 有什麼不同？你能舉出三個日常生活中已經在用 AI 的例子嗎？",mistakes:"把 AI 當成「萬能」或「全知」。很多人以為 AI 能理解一切，結果盲目信任 AI 的輸出而不驗證。AI 是工具，不是神諛——它會犯錯，你要能判斷。",skills:["能用一句話向朋友解釋 AI、機器學習、生成式 AI 的差別","能列出至少三個日常生活中已經在用的 AI 應用","能分辨「生成式 AI」與「傳統規則式 AI」的適用場景"],extVideos:[{youtubeId:"qYNweeDHiyU",title:"AI, Machine Learning, Deep Learning and Generative AI Explained",channel:"IBM Technology",duration:600,views:3399463,uploadDate:"20240805",note:"IBM 的官方解説，用動畫圖示讓技術層次更清晰。",tip:"留意 AI 技術演進的「巢套」關係圖，有助於理解整體架構"},{youtubeId:"JKLdpfdhRnc",title:"1-1. AI 是什麼？｜你的第一堂 AI 課",channel:"Ministry of Digital Affairs - moda",duration:403,views:152213,uploadDate:"20240326",note:"台灣數位發展部製作的中文 AI 入門，說法貼近本地生活。",tip:"適合不習慣看英文影片的學習者先看這支建立基礎認知"},{youtubeId:"wEjdQtaTlW0",title:"【保姆級】零基礎小白必看，2026年普通人必備的6 個AI使用技能",channel:"七七行銷筆記",duration:989,views:60430,uploadDate:"20260304",note:"針對非工程師的 2026 年 AI 技能清單，很實用的入門指南。",tip:"注意影片中提到的各種工具，後面單元會逐一教你用"}]},{id:"u-ai-landscape",name:"AI 工具全景：ChatGPT、Claude、Gemini 怎麼選",tags:["工具比較","注意時效"],mainVideo:{youtubeId:"SFG0uWGlcRs",title:"一個月 600 塊訂閱哪家 AI 最香？四大 AI 品牌殘酷大解析！ChatGPT、Gemini、Claud
