<script>window.COURSE_DATA={title:"身體修復運動指南",storageKey:"body-recovery-exercise",subtitle:"從肩頸痠痛到全身體態，物理治療師帶你用正確的運動修復久坐帶來的身體問題",stance:[{title:"立場一：先緩解再強化，循序漸進",body:"這門課不追求高強度健身，而是從「減少疼痛」到「建立基礎肌力」的漸進路徑。每個單元都從最簡單的動作開始，讓身體不適的你也能安全開始。"},{title:"立場二：理解原理比盲目模仿更重要",body:"我們選擇的影片都來自物理治療師和復健科醫師，不只教動作，更解釋「為什麼痛」和「為什麼這樣練有效」。理解原理，你才能判斷哪些動作適合自己。"},{title:"立場三：本站非醫療建議（免責聲明）",body:"本站為 YouTube 教學資源的策展與學習路徑整理，僅供教育與參考用途。所有內容不構成醫療診斷或治療建議。如有嚴重疼痛、麻木、無力或症狀持續惡化，請立即就醫，由專業醫療人員評估。"}],parts:[{id:"awareness",name:"認識你的身體警訊",chapters:[{id:"ch-self-assessment",name:"自我評估",icon:"🔍",units:[{id:"u-why-sitting-hurts",name:"為什麼久坐讓你全身痠痛？身體代償機制解析",tags:["觀念"],mainVideo:{youtubeId:"T8cjpnqwj4A",title:"緩解腰痠的10分鐘小運動！久坐族必看！｜詹珞瑤 物理治療師 Veronica Rehab",channel:"詹珞瑤",duration:758,views:315519,uploadDate:"20210705",note:"物理治療師詹珞瑤從久坐族最常見的腰痠問題切入，不只示範緩解動作，更解釋久坐如何讓特定肌群過度負擔、其他肌群逐漸無力，形成惡性循環。做為入門第一支影片，讓你先理解「痛的地方不一定是問題所在」這個最重要的觀念。"},selfCheck:"看完後你應該能回答：久坐時哪些肌群會縮短緊繃、哪些會被拉長無力？為什麼腰痠不一定要按摩腰部？「代償」是什麼意思——你的身體正在用哪些部位替代該工作的肌肉？你現在的坐姿，哪些肌肉正在偷懶？",mistakes:"痠痛就按摩痛點、貼藥布了事。這只處理症狀不處理原因——緊繃的肌肉暫時放鬆了，但造成緊繃的姿勢和肌力失衡沒改變，隔天又痛回來。更危險的是忽視持續性疼痛，拖到椎間盤突出才就醫。",skills:["能指出自己久坐時最容易痠痛的部位，並說出可能的代償原因","每坐 50 分鐘站起來做 2 分鐘伸展，打斷代償循環","區分「肌肉痠痛」和「關節疼痛」，判斷是否需要就醫"],extVideos:[{youtubeId:"WJ3UJAHcUTc",title:"久坐屁股痛別拖！這4招練起來「2週見效」｜復健｜李思翰物理治療師｜一起來復健",channel:"Health ETtoday",duration:561,views:165994,uploadDate:"20220126",note:"聚焦久坐造成的臀部疼痛，物理治療師示範四個針對性動作，強調兩週內就能感受改善。",tip:"注意「梨狀肌」和「臀中肌」的差異，治療方向完全不同"},{youtubeId:"H31ED3v-udo",title:"屁股深處痠脹痛！2招鬆開緊繃梨狀肌，防坐骨神經痛｜黃鼎鈞 骨科Ｘ疼痛科醫師【早安健康】",channel:"早安健康",duration:307,views:554302,uploadDate:"20210511",note:"從醫師角度說明久坐造成梨狀肌緊繃壓迫坐骨神經的機制，兩招簡單自救。"},{youtubeId:"drFG9mCjhWk",title:"坐骨神經痛的起點 - 梨狀肌症候群，7個動作消除深臀痛｜啾c物理治療師",channel:"啾c物理治療師",duration:753,views:804544,uploadDate:"20240206",note:"啾c物理治療師完整拆解梨狀肌症候群，七個動作從放鬆到強化循序漸進。",tip:"如果做完伸展反而更痛，可能不是梨狀肌問題——影片中有教如何判斷"}]},{id:"u-self-test",name:"自我檢測：找出你的弱點部位",tags:["實作"],mainVideo:{youtubeId:"6NcdyoYtkQs",title:"五十肩3大症狀自我檢測，分期復健運動完整教學｜啾c物理治療師",channel:"啾c物理治療師",duration:588,views:631879,uploadDate:"20210116",note:"雖然以五十肩為主題，但啾c物理治療師示範的「自我檢測方法論」適用於所有部位：觀察活動範圍、測試肌力、比較左右差異。這支影片教你的不只是檢測肩膀，而是一套判斷自己身體狀況的思考框架。"},selfCheck:"你能不能用影片中的方法檢測自己的肩膀活動度？你的左右兩側是否有明顯差異？你能區分「活動度受限」和「肌力不足」嗎？如果你發現某個動作做不到，你知道接下來該加強哪方面嗎？",mistakes:"跳過自我檢測直接開始練。不知道自己哪裡弱，就無法選擇適合的運動強度和重點。更常見的是只檢測一次就不管了——身體狀態會變化，每兩週重新測一次才能追蹤進步。",skills:["用「舉手過頭」「手背後摸」等動作測試肩關節活動度","記錄自己各部位的基準值，做為未來比較的參照點","根據檢測結果決定優先練哪個部位"],extVideos:[{youtubeId:"7tW0vIeTggs",title:"腳踝卡住是全身痠痛根源？99%人忽略的腳踝動力鏈，提高運動表現必看｜啾c物理治療師",channel:"啾c物理治療師",duration:593,views:343084,uploadDate:"20220114",note:"補充腳踝檢測的視角——腳踝活動度不足會造成膝蓋、髖關節、腰部的連鎖代償。",tip:"試試影片中的「膝蓋過腳尖測試」，很多人以為膝蓋不能過腳尖其實是迷思"},{youtubeId:"Q0PU_mDNf1w",title:"3招簡單測出柔軟度！物理治療師:摸到唇才合格！",channel:"東森超視",duration:197,views:1307,uploadDate:"20200131",note:"三分鐘就能完成的全身柔軟度快速測試，適合做為每週追蹤的簡易指標。"},{youtubeId:"-yo5P_pMMQU",title:"活動度不足靠放鬆肌肉真的就是萬解嗎?實測多久放鬆後多久會失效 feat.鄭宇劭物理治療師",channel:"練健康 LKK Wellness",duration:209,views:1837,uploadDate:"20220107",note:"批判性視角：只靠放鬆不訓練，活動度改善撐不了多久。提醒你檢測後要「練」不只「鬆」。"}]},{id:"u-when-to-see-doctor",name:"什麼時候該看醫生 vs 可以自己練",tags:["觀念","安全"],mainVideo:{youtubeId:"zRTQI0MFRns",title:"腰椎滑脫會讓腰麻痛又無力？這族群容易腰椎滑脫？腰椎滑脫一定要開刀嗎？｜黃瑽寧（feat. 劉偉修、陳曉謙）",channel:"黃瑽寧愛+好醫生",duration:1425,views:190787,uploadDate:"20230730",note:"黃瑽寧醫師搭配復健科醫師和物理治療師，討論一個常見但容易被忽略的腰痛原因。重點不在腰椎滑脫本身，而是影片中清楚區分了「可以自己運動改善」和「需要就醫處理」的界線，包括紅旗症狀的辨識方法。"},selfCheck:"你能列出至少三個「紅旗症狀」嗎？（例如：夜間痛到醒來、合併大小便異常、肢體無力持續惡化）如果腰痛超過多久沒改善就該看醫生？「神經痛」和「肌肉痠痛」的感覺有什麼不同？",mistakes:"兩個極端都危險：一是什麼痛都忍著不看醫生，拖到神經損傷才就醫；二是一痛就焦慮，過度檢查反而增加心理負擔。學會辨識真正的警訊，才能在這兩個極端之間找到平衡。",skills:["辨識五大紅旗症狀：夜間劇痛、大小便異常、持續無力、發燒合併疼痛、外傷後劇痛","區分肌肉痠痛（鈍痛、按壓有感）和神經痛（麻、電、放射痛）","判斷何時該先嘗試自我運動（2-4 週），何時該直接就醫"],extVideos:[{youtubeId:"1m2BhOB_FbM",title:"頸5,6,7,節椎間盤突出症、手麻痹⋯⋯怎樣辦？教大家4 招頸神經根病變運動！",channel:"Dr. Joe Wong",duration:899,views:1050825,uploadDate:"20220302",note:"從頸椎的角度補充：手麻是警訊還是一般痠痛？Dr. Joe Wong 教你如何判斷和自救。",tip:"如果你有手麻症狀，先看這支再決定要不要就醫"},{youtubeId:"jDQfSD7AYhI",title:"腳踝扭傷別輕忽！小心韌帶斷裂或骨裂！【正琪博士の一琪來運動】",channel:"生生優動 - 疼痛與物理治療",duration:256,views:2248,uploadDate:"20221103",note:"用腳踝扭傷為例，說明看 n tuck 時會不自覺聳肩或憋氣，這表示你用錯肌肉了。",skills:["正確執行 chin tuck（頸部後縮），感受深層頸屈肌啟動","分辨「深層肌群訓練」和「表層肌肉放鬆」的不同目標","每天做 3 組、每組 10 次的頸部深層肌群訓練"],extVideos:[{youtubeId:"XzezDAuIFXU",title:"告別脖子痛！頸椎椎間盤突出、壓迫？你最需要的四個動作！",channel:"光合物理治療所",duration:442,views:2601891,uploadDate:"20210716",note:"260萬觀看，光合物理治療所針對頸椎問題的四個核心動作，從減壓到穩定完整涵蓋。"},{youtubeId:"HWPUn_F66HI",title:"你有頭前傾 /頸椎直的問題嗎？ 你不能不知道的「頸部深層屈肌訓練」",channel:"佳緯 物理治療師",duration:89,views:7688,uploadDate:"20201118",note:"90秒短影片，專注講解深層頸屈肌訓練的正確方式，適合做為動作複習。"},{youtubeId:"p0PcmXJai2A",title:"Neck Pain Exercises for aspecific Neck Pain | Deep Cervical Flexors & Extensors",channel:"Physiotutors",duration:282,views:181146,uploadDate:"20190807",note:"（英文）Physiotutors 頻道以解剖學圖解搭配動作示範，深入淺出解釋頸部深層肌群訓練的科學依據。"}]},{id:"u-scapular-stability",name:"上背與肩胛穩定訓練",tags:["訓練"],mainVideo:{youtubeId:"H4caC468WTU",title:"想放鬆肩膀？來試試這幾個超有感的背部鍛鍊吧｜啾c物理治療師",channel:"啾c物理治療師",duration:654,views:206522,uploadDate:"20250703",note:"啾c物理治療師用「想放鬆肩膀就要練背」的觀點，顛覆大多數人「痠就按」的直覺。這支影片的核心觀念是：肩頸痠痛的根源往往是上背無力，讓肩胛骨失去穩定，肩頸肌肉被迫過度工作。訓練背部才是長期解方。"},selfCheck:"為什麼「練背」可以「放鬆肩膀」？你能做出肩胛骨的內收（夾背）動作嗎？做的時候是肩胛骨在動，還是手臂在動？IYT 訓練中，I、Y、T 三個角度各訓練到哪條肌肉？",mistakes:"做上背訓練時聳肩——這表示你用上斜方肌代償，反而加重肩頸負擔。另一個常見問題是只做伸展不做訓練，上背肌肉越來越弱，肩胛骨越來越不穩定，形成惡性循環。",skills:["正確執行肩胛骨內收（夾背），且不聳肩","完成 IYT 背肌訓練，每個角度 10 次","在日常生活中保持肩胛骨微微內收的姿勢"],extVideos:[{youtubeId:"-0gEidxu_fw",title:"肩胛骨穩定訓練——肩關節恢復健康最重要的關鍵",channel:"全人物理治療所",duration:206,views:13671,uploadDate:"20221117",note:"三分鐘精簡版肩胛骨穩定訓練，適合五十肩、肩夾擠患者的溫和入門。"},{youtubeId:"mkqVeMQdGyk",title:"膏肓痛、上背痛總是消不掉？「反向動作」原理讓你大幅改善上背痠痛｜啾c物理治療師",channel:"啾c物理治療師",duration:738,views:996467,uploadDate:"20230330",note:"「反向動作」概念：用和造成痠痛相反方向的動作來修復，邏輯清楚且實用。",tip:"如果你長期膏肓痛（肩胛骨內側），這支是最對症的"},{youtubeId:"CBbc3TQHUMU",title:"棒球選手都在練的「IYT背肌訓練」，透過正確控制肩胛骨跟背肌，空手就能強化背部",channel:"全人物理治療所",duration:195,views:11818,uploadDate:"20230831",note:"空手就能做的 IYT 訓練完整示範，不需要器材，重點在肩胛骨控制而非手臂力量。"}]},{id:"u-massage-myths",name:"避坑：越按摩越嚴重的陷阱",tags:["觀念","避坑"],mainVideo:{youtubeId:"n983Q8YAjPk",title:"【健康】肩頸痠痛別再按摩？台大名醫教你1分鐘自救：甩開痠痛麻！！ft.王薏茜醫師",channel:"風傳媒 The Storm Media",duration:1323,views:2329735,uploadDate:"20220128",note:"230萬觀看的爆款影片，台大復健科王薏茜醫師直接點出「按摩成癮」的問題：很多人越按越頻繁、越按越重手，但痠痛從未真正改善。一分鐘自救法比花錢按摩更有效。這是整門課最重要的「避坑」單元。"},selfCheck:"你目前有定期按摩的習慣嗎？如果有，頻率是否越來越高？按完通常能維持多久不痛？你能說出為什麼重複按摩可能讓肌肉纖維化、反而更緊嗎？王醫師教的一分鐘自救法是什麼動作？",mistakes:"把按摩當作唯一解方，每週花錢去按卻從不做任何訓練。更危險的是在頸部做大力整脊或快速旋轉——頸動脈剝離的案例時有所聞。筋膜槍對著骨頭突起處猛打也是常見的傷害來源。",skills:["判斷自己的按摩習慣是否已形成依賴（越按越頻繁、越需要更大力）","用主動運動（訓練、伸展）取代被動放鬆（按摩、推拿）做為主要緩解方式","辨識哪些「民俗療法」有風險（頸部快速旋轉、大力整脊）"],extVideos:[{youtubeId:"95Ma3LC5cw4",title:"拯救脖子痠痛！10min頸椎減壓 物理治療師授4招輕鬆舒緩壓力",channel:"風傳媒 The Storm Media",duration:670,views:259981,uploadDate:"20210726",note:"物理治療師示範的正確緩解方式，強調「減壓」而非「施壓」的觀念差異。"},{youtubeId:"3Pp2pFl40Rc",title:"肩頸痠痛自己救！跟物理治療師JJ老師學3分鐘保健肩頸放鬆運動！",channel:"米蔚 Life & Health｜健康生活全方位",duration:236,views:4226,uploadDate:"20200403",note:"三分鐘的自救方案，重點在「自己動」而不是「讓人按」。"},{youtubeId:"RlVkJX0k63E",title:"5招放鬆筋膜舒緩頸部痠痛｜高翊倫物理治療師",channel:"Good way to health",duration:259,views:626128,uploadDate:"20210626",note:"筋膜放鬆不等於按摩——物理治療師教你用正確的手法和方向自我放鬆頸部筋膜。"}]}]}]},{id:"lower-back",name:"下背痛 / 腰痛對策",chapters:[{id:"ch-lumbar-core",name:"腰椎保護與核心",icon:"🦴",units:[{id:"u-acute-back-pain",name:"急性腰痛怎麼辦？安全的緩解動作",tags:["急救","實作"],mainVideo:{youtubeId:"J8USTnYYJPk",title:"【康健陪你練】拿個重物、打噴嚏就「閃到腰」？3招伸展運動緩解腰疼背痛！",channel:"康健雜誌",duration:198,views:360818,uploadDate:"20190517",note:"閃到腰的當下該怎麼辦？康健雜誌邀請專家示範三招安全的緩解動作。重點是「急性期可以做什麼」和「絕對不要做什麼」——很多人閃到腰後完全不敢動，反而讓肌肉更僵硬，延長恢復時間。"},selfCheck:"閃到腰的前48小時該冰敷還是熱敷？急性期可以做哪些動作、應該避免哪些動作？什麼姿勢可以減輕腰椎壓力讓你先舒服一點？如果痛到完全無法起身，應該怎麼處理？",mistakes:"閃到腰後完全躺床不動超過兩天。研究已經證實「適度活動」比「完全臥床」恢復更快。另一個極端是忍痛硬撐繼續搬東西——急性期繼續給腰椎負重可能造成更嚴重的損傷。",skills:["閃到腰當下用「側躺屈膝」姿勢減輕疼痛","急性期 48 小時內做溫和的骨盆傾斜運動促進恢復","判斷何時從「休息為主」過渡到「開始活動」"],extVideos:[{youtubeId:"X127V0LWqWc",title:"閃到腰自己救　腰部疼痛緩解2招全搞定",channel:"Health ETtoday",duration:163,views:512049,uploadDate:"20190104",note:"醫師示範兩招腰痛急救法，簡潔有力，適合急性發作時快速查看。"},{youtubeId:"JdayxAf30VU",title:"「閃到腰」好痛！下背痛怎麼辦？3招筋膜放鬆術，快速舒緩不再卡卡！",channel:"HEALTH 2.0",duration:392,views:59508,uploadDate:"20250214",note:"從筋膜角度切入腰痛緩解，物理治療師和醫師對談，觀點更完整。"},{youtubeId:"dC99WzIHkoQ",title:"How To FIX Low Back Pain In 90 Seconds - (So Simple)",channel:"Bob & Brad",duration:300,views:1474254,uploadDate:"20230325",note:"（英文）Bob & Brad 的 90 秒腰痛急救法，1400萬觀看，動作極簡單。",tip:"重點是 McKenzie press-up（麥乞式伸展），適合椎間盤突出型的腰痛"}]},{id:"u-core-training",name:"核心肌群啟動（不是仰臥起坐！）",tags:["訓練","觀念"],mainVideo:{youtubeId:"KlywCH-AqtA",title:"EP2 全世界最好的抗腰痛運動｜全世界最好的伸展｜核心肌群訓練",channel:"Jc復健日常",duration:410,views:1942727,uploadDate:"20200625",note:"190萬觀看的經典影片，Jc復健日常從「為什麼仰臥起坐不是好的核心訓練」切入，教你真正對腰椎友善的核心訓練方式。影片名稱的「全世界最好」不是噱頭——McGill Big 3（麥乞三大）確實是脊椎生物力學權威 Stuart McGill 教授推薦的核心訓練黃金標準。"},selfCheck:"你能說出 McGill Big 3 是哪三個動作嗎？為什麼仰臥起坐對腰椎有風險？「核心」不只是腹肌——你能列出核心肌群包含哪些肌肉嗎？做棒式時你的腰是塌下去還是維持中立？",mistakes:"把核心訓練等於練腹肌、狂做仰臥起坐。仰臥起坐對腰椎的壓力很大，尤其是已經有腰痛的人更不該做。另一個錯誤是做棒式時腰部塌陷或聳肩——姿勢不正確的棒式比不做還糟。",skills:["正確執行 McGill Big 3：鳥狗式、側棒式、捲腹（不是仰臥起坐）","在所有核心訓練中保持腰椎中立位，不過度彎曲或伸展","先學會在訓練中正確呼吸（不憋氣），再追求動作難度"],extVideos:[{youtubeId:"KZ4mzxjgfmY",title:"訓練核心肌群 錯誤動作超傷腰！ 復健科醫師正確示範 橋式 死蟲式 狗鳥式 棒式",channel:"HEALTH 2.0",duration:611,views:755690,uploadDate:"20220729",note:"復健科侯鐘堡醫師親自示範四大核心動作的「正確版」和「錯誤版」對比，一目了然。",tip:"特別注意「錯誤示範」的部分——你可能一直都做錯了"},{youtubeId:"bYWsYFzkxIw",title:"駝背改善第三步：核心肌群訓練，讓脊椎不再依賴腰部代償｜啾c物理治療師",channel:"啾c物理治療師",duration:571,views:123018,uploadDate:"20220726",note:"從駝背改善的角度切入核心訓練，串連上背與核心的關係，視角獨特。"},{youtubeId:"pJp08smdcFk",title:"Strengthen Your Core - Just 6 Minutes A Day!",channel:"Tone and Tighten",duration:455,views:2295686,uploadDate:"20230112",note:"（英文）每天只要 6 分鐘的核心訓練跟練影片，適合養成每日習慣。"}]},{id:"u-hip-mobility",name:"髖關節活動度：腰痛的隱藏兇手",tags:["觀念","訓練"],mainVideo:{youtubeId:"GoRYSNv19y8",title:"腰和膝蓋總是在痛嗎？試試這 3 招，讓骨盆既靈活又穩定｜啾c物理治療師",channel:"啾c物理治療師",duration:633,views:629544,uploadDate:"20250424",note:"啾c物理治療師直接點出「髖不動，腰就要多動」的代償邏輯。很多人以為腰痛的問題在腰，其實是髖關節太緊，腰椎被迫承擔過多活動度。三個動作同時改善骨盆的靈活性和穩定性，一石二鳥。"},selfCheck:"你蹲下去的時候腰會不會圓起來（butt wink）？如果會，這代表什麼？髖關節活動度不足會如何影響膝蓋和腰椎？你能做到髖關節 90 度屈曲且腰椎保持中立嗎？",mistakes:"腰痛就只治療腰部，忽略髖關節。髖關節僵硬是久坐族最普遍的問題，但因為「不痛」所以不會注意到。直到腰椎因為過度代償而受傷，才發現問題的根源不在腰。",skills:["用深蹲測試檢查自己的髖關節活動度是否足夠","做 90/90 髖關節活動度訓練，改善髖關節內外旋","區分「髖關節動作」和「腰椎動作」，彎腰時從髖關節轉而非腰椎彎"],extVideos:[{youtubeId:"pQ23sPnD5dY",title:"髖關節卡卡、彈響髖怎麼辦？四個簡單方法讓髖關節歸位｜啾c物理治療師",channel:"啾c物理治療師",duration:732,views:788627,uploadDate:"20230206",note:"針對髖關節「卡卡」和彈響聲的四個解決方案，常見問題的對症處理。"},{youtubeId:"0uLn4i1y9BE",title:"你以為是膝蓋退化，其實可能是髖關節在代償｜啾c物理治療師",channel:"啾c物理治療師",duration:848,views:122464,uploadDate:"20260514",note:"串連髖關節與膝蓋的關係——膝蓋痛不一定是膝蓋的問題。"},{youtubeId:"qnKiKPZjFi8",title:"髖關節痛, 腳又扯…做什麼運動好呢？4 Simple Exercises for Hip Pain",channel:"Dr. Joe Wong",duration:911,views:794218,uploadDate:"20220130",note:"Dr. Joe Wong 從臨床角度講解髖關節痛的運動處方，中英雙語字幕。"}]},{id:"u-lifting-posture",name:"正確搬重物與日常護腰姿勢",tags:["實用技巧"],mainVideo:{youtubeId:"vozdCo-NnS4",title:"撿東西不要彎腰？搬重物的正確姿勢 保護脊椎必學【堡你平安 侯鐘堡】",channel:"HEALTH 2.0",duration:64,views:45838,uploadDate:"20210711",note:"一分鐘就能學會的搬重物正確姿勢，復健科侯鐘堡醫師示範。短小精悍，適合隨時複習。核心觀念：不是「不能彎腰」，而是要「用髖關節彎」而非「用腰椎彎」。"},selfCheck:"搬重物時你的第一個動作是彎腰還是蹲下？你知道為什麼要把重物靠近身體再搬起來嗎？從地上撿東西時，你的腰椎是彎曲的還是保持中立的？",mistakes:"直接彎腰搬重物，腰椎承受的壓力是正確姿勢的好幾倍。另一個迷思是「完全不能彎腰」——其實腰椎有一定的彎曲能力，問題是在負重狀態下過度彎曲。打噴嚏時腰部沒有準備好也是常見的閃腰原因。",skills:["搬重物時先蹲、靠近、夾緊核心再站起","撿地上東西改用弓步蹲或高爾夫式撿取，避免彎腰","打噴嚏或咳嗽前先微微收緊核心保護腰椎"],extVideos:[{youtubeId:"hf_xlAIIMX8",title:"腰痛？搬重物小心「這個動作」可避免傷到腰、椎間盤突出｜大安國際物理治療中心",channel:"大安國際物理治療中心Amazing International Clinic",duration:149,views:1614,uploadDate:"20210811",note:"物理治療中心實地教學，特別強調搬東西時的常見錯誤動作。"},{youtubeId:"F30h43Nw9vE",title:"【脊萃百科】正確的搬重物姿勢",channel:"脊萃百科 Chiropedia",duration:141,views:15644,uploadDate:"20210511",note:"脊骨神經醫學角度的搬重物教學，動畫示意清楚易懂。"},{youtubeId:"5houLkyIMeo",title:"你彎腰有彎對嗎？當心彎錯腰老來躺在床！鄭雲龍教你如何正確彎腰！",channel:"每日健康",duration:197,views:3383,uploadDate:"20180227",note:"脊椎保健專家鄭雲龍用日常場景示範正確彎腰方式，生活化且實用。"}]}]}]},{id:"knee-leg",name:"膝蓋保養與腿部強化",chapters:[{id:"ch-knee-lower",name:"膝蓋與下肢",icon:"🦵",units:[{id:"u-knee-pain-causes",name:"膝蓋痛的常見原因與自我檢測",tags:["觀念","檢測"],mainVideo:{youtubeId:"ZuQ4FyM-LpY",title:"膝蓋痛的真正原因? 膝蓋痛反而應該優先處理...| 最完整的膝蓋評估放鬆與矯正",channel:"阿舟 物理治療小教室",duration:540,views:1633250,uploadDate:"20201119",note:"163萬觀看，阿舟物理治療師的膝蓋痛完整攻略。最有價值的部分是「膝蓋痛反而應該優先處理其他部位」的觀點——膝蓋通常是受害者，不是加害者。影片涵蓋評估、放鬆、矯正的完整流程。"},selfCheck:"膝蓋痛一定是膝蓋的問題嗎？你能根據疼痛位置（前側、內側、外側、後側）判斷可能的原因嗎？你的膝蓋痛是上下樓梯時痛、蹲下時痛、還是走路時痛？不同情境的痛指向不同的問題。",mistakes:"膝蓋痛就完全不動、不走路、不爬樓梯。過度保護反而讓膝蓋周圍肌肉萎縮，關節更不穩定。另一個錯誤是膝蓋痛就去買護膝長期戴——護膝是輔助，不是治療，長期依賴會讓肌肉更弱。",skills:["根據膝蓋疼痛的位置和發生情境初步判斷可能原因","做膝蓋活動度測試：完全伸直和完全彎曲是否受限","判斷自己的膝蓋痛是需要就醫還是可以先運動改善"],extVideos:[{youtubeId:"xYLzOvsJp7c",title:"膝蓋痛 注意！了解膝關節8種疼痛的位置 才能對症下藥！",channel:"HEALTH 2.0",duration:77,views:166428,uploadDate:"20230217",note:"用圖解快速區分 8 種不同位置的膝蓋痛，適合做為參考手冊。"},{youtubeId:"LyUkwoo49c8",title:"【膝蓋痛】一蹲就痛 | 下樓梯痛的關鍵在哪裡？三個步驟帶你解決！",channel:"光合物理治療所",duration:279,views:550670,uploadDate:"20230627",note:"針對「蹲下和下樓梯」這個最常見的膝蓋痛情境，三步驟系統解決。"},{youtubeId:"BGWtEk5c4-8",title:"膝蓋痛先別深蹲！1動作強化膝關節，對膝蓋最沒負擔",channel:"健康1+1 · 直播",duration:90,views:637855,uploadDate:"20201002",note:"批判性視角：膝蓋痛的人不該直接做深蹲，先從對膝蓋零負擔的動作開始。"}]},{id:"u-quad-glute-strength",name:"股四頭肌與臀肌強化",tags:["訓練"],mainVideo:{youtubeId:"O2dwRwJ82JQ",title:"一秒檢測你的股四頭肌夠不夠力！如有2現象快學這三招自我鍛鍊強化",channel:"好心肝·好健康",duration:217,views:274479,uploadDate:"20171225",note:"簡單的一秒檢測法判斷你的股四頭肌是否足夠，加上三招強化訓練。股四頭肌是保護膝蓋最重要的肌群——肌力夠，膝蓋承受的衝擊就少。這支影片讓你先知道自己的程度，再對症訓練。"},selfCheck:"你能單腳從椅子上站起來嗎（不用手撐）？如果不行，代表你的股四頭肌可能不夠力。臀肌無力和膝蓋痛有什麼關係？你做深蹲時膝蓋會內夾嗎？如果會，是哪條肌肉無力造成的？",mistakes:"只練股四頭肌忽略臀肌。膝蓋的穩定需要前後（股四頭肌＋腿後肌群）和外側（臀中肌）的平衡。另一個錯誤是膝蓋痛就做大重量深蹲——先從不負重的牆壁深蹲或橋式開始，確認膝蓋不痛再慢慢加量。",skills:["用單腳站椅測試檢測股四頭肌肌力是否足夠","正確執行橋式（啟動臀大肌）和蚌殼式（啟動臀中肌）","從牆壁深蹲開始漸進式強化腿部肌力"],extVideos:[{youtubeId:"1jJF-JcFnCg",title:"膝蓋痛別再只練直抬腿了！三步驟改善你的膝蓋健康!",channel:"Beiimu fitness",duration:315,views:385132,uploadDate:"20250420",note:"超越傳統「直抬腿」的三步驟膝蓋強化法，更全面且有效。"},{youtubeId:"Utg95EEcVPo",title:"膝關節退化不用怕，這 8 個護膝法讓你帶回家｜啾c物理治療師",channel:"啾c物理治療師",duration:705,views:324611,uploadDate:"20250605",note:"啾c物理治療師的護膝八招，從日常保養到訓練全涵蓋，適合長期執行。"},{youtubeId:"ikt6NME0k9E",title:"Stop Knee Pain Now! 5 Exercises To Strengthen Your Knees",channel:"Tone and Tighten",duration:507,views:12875921,uploadDate:"20200409",note:"（英文）1280萬觀看，五個強化膝蓋的運動，動作清楚可跟練。",tip:"注意臀肌啟動的部分——很多人練腿忽略臀肌，膝蓋問題一直回來"}]},{id:"u-ankle-mobility",name:"腳踝活動度與小腿放鬆",tags:["訓練","觀念"],mainVideo:{youtubeId:"TUv9zfQI6nM",title:"腳踝動力鏈完整介紹：為什麼腳踝卡住會讓全身痠痛？｜啾c物理治療師",channel:"啾c物理治療師",duration:734,views:98172,uploadDate:"20220831",note:"啾c物理治療師用「動力鏈」的概念解釋為什麼腳踝活動度會影響到膝蓋、髖關節、甚至腰部。腳踝是人體的地基，地基歪了上面全都要代償。這支影片讓你理解為什麼改善腳踝活動度可能同時改善膝蓋和腰部的問題。"},selfCheck:"你能在不抬腳跟的情況下做全蹲嗎（亞洲蹲）？如果不行，限制在哪裡——是腳踝、小腿、還是髖關節？你知道腳踝背屈角度不夠會如何影響你走路和上下樓梯嗎？",mistakes:"完全忽略腳踝訓練，只練上半身或只處理痛的部位。腳踝扭傷後不做復健就回到正常活動，是反覆扭傷和膝蓋代償的主要原因。小腿太緊也不要用滾筒猛壓——要結合活動度訓練才有持久效果。",skills:["用膝蓋推牆測試檢測腳踝背屈活動度","做小腿伸展和腳踝畫圓來改善腳踝活動度","理解「地基理論」——從腳踝開始建立穩定的動力鏈"],extVideos:[{youtubeId:"ll7En8h-d8c",title:"物理治療 腳踝扭傷自己來~~",channel:"詹珞瑤",duration:277,views:336340,uploadDate:"20190408",note:"詹珞瑤物理治療師的腳踝扭傷自我復健指南，適合扭傷後的恢復階段。"},{youtubeId:"ldelK-9hWqM",title:"腳踝扭傷怎麼復健？物理治療師教你降低後遺症｜啾c物理治療師",channel:"啾c物理治療師",duration:621,views:298129,uploadDate:"20211102",note:"強調扭傷後的完整復健流程，避免「好了又扭」的惡性循環。"},{youtubeId:"QBkpbD2k250",title:"宇劭的物理治療小教室 EP.3 腳踝活動度",channel:"健身魂soulfit",duration:263,views:2074,uploadDate:"20180427",note:"物理治療師示範腳踝活動度訓練的基礎動作，適合做為日常練習的參考。"}]}]}]},{id:"arm-strength",name:"手臂無力？從肩到手的完整訓練",chapters:[{id:"ch-upper-limb",name:"上肢力量",icon:"💪",units:[{id:"u-grip-forearm",name:"握力與前臂訓練",tags:["訓練","實用"],mainVideo:{youtubeId:"T6oxtNoPc4A",title:"握力不足 = 上半身肌少症 ？2招手掌運動 訓練肌力｜江P醫件事 229",channel:"HEALTH 2.0",duration:332,views:63993,uploadDate:"20240523",note:"江坤俊醫師從醫學角度指出握力是上半身肌少症的重要指標——握力不足不只是提不動東西，更預示著整體肌力衰退。兩招簡單的手掌運動就能開始訓練，門檻極低。"},selfCheck:"你能輕鬆擰乾毛巾嗎？你提兩袋超市購物袋能走多遠不用換手？握力和全身肌力有什麼關聯？你知道握力衰退是許多慢性病的早期指標嗎？",mistakes:"覺得「手無力」不是什麼大問題，不需要專門訓練。握力其實是全身肌力的縮影——研究顯示握力和壽命、心血管健康都有相關性。另一個錯誤是只用握力器猛捏，忽略手腕和前臂的整體訓練。",skills:["用擰毛巾測試自己的握力水準","每天做 3 組握力訓練（捏網球、握毛巾、農夫走路）","在日常生活中主動練習：自己提重物、擰瓶蓋不求人"],extVideos:[{youtubeId:"cUxHx7xZR1w",title:"為什麼要練握力? 原來握力跟這些有關! 5個握力訓練! ▏北木健身",channel:"Beiimu fitness",duration:383,views:153958,uploadDate:"20240107",note:"北木健身治療師完整講解握力的重要性和五個訓練動作，理論與實作兼具。"},{youtubeId:"XnQfryzMt-Q",title:"握力器有用嗎？用毛巾也可練？健身教練帶你5分鐘攻略握力訓練",channel:"Sense思法人",duration:274,views:21396,uploadDate:"20221021",note:"評比各種握力訓練工具的效果，告訴你不用買器材、用毛巾就能練。"},{youtubeId:"ee-gN6KOYZc",title:"超有效強化前臂肌肉！最易掌握的三個動作",channel:"Leo Kwan 曜儁教練",duration:151,views:2249,uploadDate:"20230529",note:"前臂肌肉強化三動作，補充握力之外的前臂整體訓練。"}]},{id:"u-shoulder-stability",name:"肩關節穩定性訓練",tags:["訓練"],mainVideo:{youtubeId:"x5GvVMyltHA",title:"肩膀卡卡、反覆痠痛？肩胛肱骨節律是你從沒聽過的肩關節保養關鍵｜啾c物理治療師",channel:"啾c物理治療師",duration:757,views:336622,uploadDate:"20220212",note:"「肩胛肱骨節律」是大多數人從沒聽過但卻是肩關節健康的核心概念——舉手時肩胛骨和肱骨要以特定比例同步轉動。節律不對，肩膀就會反覆夾擠和痠痛。啾c物理治療師用清楚的解剖圖解配合動作示範，讓你理解肩膀問題的根本原因。"},selfCheck:"舉手過頭時你的肩膀會痛或卡住嗎？你能感受到舉手時肩胛骨跟著旋轉嗎？「旋轉肌群」包含哪四條肌肉？為什麼旋轉肌群的訓練要用輕重量、多次數？",mistakes:"用大重量練肩膀——旋轉肌群是穩定肌，需要用輕重量、慢速、高次數來訓練。用大重量做側平舉或肩推反而讓大肌群主導，旋轉肌群照樣弱。另一個錯誤是肩膀痛就完全不動——適度的穩定訓練反而能改善疼痛。",skills:["正確執行外旋訓練（可用彈力帶或毛巾）","舉手過頭時有意識地讓肩胛骨跟著旋轉","區分「肩膀活動度」和「肩膀穩定度」，兩者都要練"],extVideos:[{youtubeId:"f0g0uIW7cTg",title:"肩旋轉肌腱撕裂傷 運動篇",channel:"菁英診所再生醫療門診",duration:264,views:306295,uploadDate:"20160713",note:"旋轉肌群受傷後的安全訓練動作，動作溫和適合有肩傷的人。"},{youtubeId:"JgNatRnJASY",title:"肩膀有聲音，肩膀卡卡，其實是旋轉肌群不平衡。「靠牆畫弧」一招立馬肩關節回正位",channel:"全人物理治療所",duration:261,views:80863,uploadDate:"20240201",note:"一個「靠牆畫弧」動作就能即時改善肩膀卡卡，簡單到隨時可做。"},{youtubeId:"-NA8lUy5_Qc",title:"The Best Rotator Cuff Strengthening Routine (BULLETPROOF YOUR SHOULDERS)",channel:"Jeremy Ethier",duration:595,views:5178978,uploadDate:"20190714",note:"（英文）Jeremy Ethier 基於研究設計的旋轉肌群訓練菜單，500萬觀看，動作解說極其詳細。",tip:"每個動作的角度和速度都很重要——跟著他的節奏做，不要自己加快"}]},{id:"u-wrist-elbow",name:"手腕手肘常見問題（滑鼠手、網球肘）",tags:["實作","辦公族"],mainVideo:{youtubeId:"S1ODpO_5URY",title:"手麻手痛！是腕隧道症候群嗎？現代人必學的三招物理治療方式",channel:"光合物理治療所",duration:294,views:396403,uploadDate:"20210531",note:"光合物理治療所針對滑鼠手（腕隧道症候群）的完整講解：從如何判斷自己是不是腕隧道、到三招物理治療自救法。做為辦公族最高發的上肢問題，每個長時間用電腦的人都應該看這支。"},selfCheck:"你打字或用滑鼠時手指會麻嗎？你能做 Phalen test（手腕彎曲 60 秒）不麻嗎？網球肘和滑鼠手的差別在哪裡——一個痛在手肘外側，一個麻在手指？你的工作環境（鍵盤高度、滑鼠位置）是否符合人體工學？",mistakes:"手麻就戴護腕了事，不處理根本原因。腕隧道症候群的根本問題通常是長時間手腕彎曲的姿勢加上重複動作，不改姿勢只戴護腕效果有限。另一個錯誤是把所有手痛都當成腕隧道——可能是頸椎問題造成的轉移痛。",skills:["用 Phalen test 和 Tinel sign 自我檢測是否有腕隧道症候群","調整鍵盤和滑鼠位置讓手腕維持中立位","做手腕伸展和神經滑動運動來預防和緩解症狀"],extVideos:[{youtubeId:"VL1b1bUtU64",title:"網球肘、電腦手、手腕痛 - 4 招幫到手",channel:"Dr. Joe Wong",duration:566,views:194952,uploadDate:"20210408",note:"Dr. Joe Wong 一次涵蓋網球肘和電腦手的四招自救法，中英雙語字幕。"},{youtubeId:"B3BzN4tLL2M",title:"一招緩解手肘外側痛",channel:"healthyD",duration:36,views:380355,uploadDate:"20171122",note:"36秒的超精簡網球肘緩解法，一個動作就能即時減痛。"},{youtubeId:"8uCt_12Yf5E",title:"手肘疼痛 是 網球肘 ？黃金3招跟著做 不再疼痛！",channel:"HEALTH 2.0",duration:112,views:123580,uploadDate:"20220330",note:"侯鐘堡醫師的網球肘黃金三招，從放鬆到強化的完整流程。"}]}]}]},{id:"posture",name:"全身體態矯正",chapters:[{id:"ch-posture-fix",name:"體態重建",icon:"🧍",units:[{id:"u-upper-crossed",name:"駝背圓肩矯正（上交叉症候群）",tags:["體態","訓練"],mainVideo:{youtubeId:"SXAaR9O1ygs",title:"駝背改善第二步：旋轉肌訓練拉回圓肩，肩頸不再痠痛｜啾c物理治療師",channel:"啾c物理治療師",duration:404,views:283947,uploadDate:"20220706",note:"啾c物理治療師的駝背改善系列第二步，專注在旋轉肌訓練。為什麼選這支而不是更基礎的第一步？因為大多數人已經知道要「挺胸」但做不到，問題出在旋轉肌群太弱、胸肌太緊，這支直接解決根本原因。"},selfCheck:"你靠牆站時，後腦勺、肩胛骨、臀部能不能同時碰到牆？你的手肘能不能在靠牆狀態下完全貼牆上下滑動（wall angel）？你知道為什麼「刻意挺胸」不是改善駝背的正確方式嗎？",mistakes:"用力挺胸、夾背來「矯正」駝背——這只是用另一組肌肉硬撐，撐累了就回到原本的駝背。真正的改善需要放鬆緊繃的前側（胸肌、前三角肌），同時強化無力的後側（菱形肌、下斜方肌、旋轉肌群）。",skills:["用靠牆測試檢測自己的圓肩程度","做胸肌門框伸展（每次 30 秒，每天 3 次）","正確執行 wall angel（牆壁天使），訓練肩胛後收能力"],extVideos:[{youtubeId:"rrdng8ZhPbE",title:"不想駝背、圓肩、烏龜脖？破解「上交叉症候群」的終極矯正術！",channel:"唯心運動物理治療所",duration:473,views:5064,uploadDate:"20250519",note:"最新的上交叉症候群完整解說，從理論到實作一次到位的自救指南。"},{youtubeId:"yK2tB_T-QD8",title:"圓肩駝背怎麼辦？10分鐘搞懂「上交叉症候群」",channel:"一米六健身服利社",duration:611,views:13582,uploadDate:"20220509",note:"10分鐘有系統地搞懂上交叉症候群的成因和解法，圖解清晰。"},{youtubeId:"yghNB3z0Ulw",title:"How to Fix Rounded Shoulders (FOREVER!)",channel:"ATHLEAN-X™",duration:651,views:750421,uploadDate:"20241219",note:"（英文）ATHLEAN-X 的圓肩永久修復方案，強調「永久」——不是暫時做做就好。",tip:"重點在他講的「不只是伸展胸肌，更要強化後背」的完整策略"}]},{id:"u-lower-crossed",name:"骨盆前傾矯正（下交叉症候群）",tags:["體態","訓練"],mainVideo:{youtubeId:"SPjIcD_8Bwc",title:"骨盆前傾改善教學（上）：拉伸放鬆告別腰酸下背痛｜啾c物理治療師",channel:"啾c物理治療師",duration:544,views:137405,uploadDate:"20200910",note:"啾c物理治療師的骨盆前傾教學上篇，專注在「放鬆緊繃的部位」——主要是髂腰肌和豎脊肌。骨盆前傾不只是體態不好看，更是下背痛的常見原因。這支影片讓你先處理「太緊」的部分，下一步才能有效訓練「太弱」的部分。"},selfCheck:"你站立時肚子是否不自覺地往前凸？靠牆站時腰後面能不能塞進一個拳頭（如果可以，很可能有骨盆前傾）？你知道骨盆前傾涉及哪些肌肉「太緊」和哪些「太弱」嗎？",mistakes:"只做放鬆不做訓練——髂腰肌放鬆完如果不啟動臀肌和腹肌，骨盆馬上又會前傾回去。另一個錯誤是以為自己有骨盆前傾就拼命做後傾運動，但有些人其實是「假性前傾」（腹部脂肪造成的視覺效果），需要先正確判斷。",skills:["用靠牆測試判斷自己是否有骨盆前傾","做髂腰肌（弓步伸展）和豎脊肌的放鬆","搭配下篇的臀肌啟動訓練，形成完整的矯正流程"],extVideos:[{youtubeId:"TbixyhnVB1I",title:"骨盆前傾改善教學（下）：喚醒臀肌訓練核心肌群｜啾c物理治療師",channel:"啾c物理治療師",duration:470,views:58931,uploadDate:"20200917",note:"上篇的續集——放鬆完緊繃的部位後，用這支來啟動無力的臀肌和核心。",tip:"上下兩篇是一套的，建議連續看完再開始練"},{youtubeId:"B2b4cQHpVcY",title:"醫動就通－舒緩下交叉症候群看過來，請你跟我這樣動！",channel:"i運動",duration:795,views:4191,uploadDate:"20221219",note:"跟練式影片，適合照著做完整的下交叉症候群改善運動。"},{youtubeId:"2NZMaI-HeNU",title:'Fix "Anterior Pelvic Tilt" in 10 Minutes/Day (Daily Exercise Routine)',channel:"Jeremy Ethier",duration:493,views:9852817,uploadDate:"20180218",note:"（英文）Jeremy Ethier 的骨盆前傾每日10分鐘修復計畫，980萬觀看，科學研究支持。",tip:"這支影片的訓練菜單非常適合做為每日固定流程"}]},{id:"u-full-body-mobility",name:"全身活動度流動訓練",tags:["訓練","整合"],mainVideo:{youtubeId:"zF_2-21l0cw",title:"【中高齡運動 - 動態伸展操】12分鐘全身拉筋伸展操 ▏北木健身",channel:"Beiimu fitness",duration:745,views:663603,uploadDate:"20221225",note:"北木健身治療師設計的12分鐘全身動態伸展操，雖然標題寫「中高齡」，但動作流暢且涵蓋全身主要關節，適合所有年齡層做為每日活動度維護。66萬觀看證明實用性高，跟練式設計讓你不用思考、跟著做就好。"},selfCheck:"你能流暢地做完一套從頭到腳的全身伸展嗎？過程中哪些部位感覺特別緊？你知道「動態伸展」和「靜態伸展」的差別嗎？什麼時候該用動態、什麼時候用靜態？",mistakes:"只伸展自己覺得緊的部位，忽略其他部位。身體是一個整體——只放鬆肩頸不管髖關節，代償問題不會解決。另一個錯誤是在身體還沒熱的時候做激烈的靜態伸展，可能拉傷肌肉。",skills:["完成一套 10-15 分鐘的全身動態伸展流程","區分動態伸展（運動前暖身用）和靜態伸展（運動後放鬆用）","把全身活動度訓練設為每日固定流程（早起或睡前）"],extVideos:[{youtubeId:"qhyMktZprLw",title:"10分鐘 睡前運動｜關節活化運動｜放鬆肌肉 10 MIN BEDTIME MOBILITY",channel:"一米六健身服利社",duration:636,views:9343,uploadDate:"20230130",note:"睡前版本的活動度訓練，節奏更慢、動作更溫和，適合睡前放鬆。"},{youtubeId:"aRVFt79LqCM",title:"10 Min. Morning Mobility Routine | Full Body, No Equipment, Follow Along",channel:"mobility by julia reppel",duration:656,views:2034293,uploadDate:"20220107",note:"（英文）200萬觀看的晨間活動度流程，10分鐘無器材，非
