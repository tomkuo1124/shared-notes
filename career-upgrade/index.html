lor:var(--text-soft);font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px}.topbar-right{display:flex;align-items:center;gap:10px}.searchbox{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 12px;width:260px}.searchbox:focus-within{border-color:var(--primary)}.search-icon{font-size:13px;opacity:.6}#search-input{border:none;outline:0;background:0 0;color:var(--text);width:100%;font-size:14px}.icon-btn{font-size:17px;padding:6px 9px;border-radius:8px}.icon-btn:hover{background:var(--bg-hover)}.layout{display:flex;max-width:1500px;margin:0 auto}.sidebar{width:300px;flex-shrink:0;padding:20px 14px 40px;position:sticky;top:57px;height:calc(100vh - 57px);overflow-y:auto}.main{flex:1;min-width:0;padding:24px 32px 80px}body.lesson-active .sidebar{display:none}.progress-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:18px;box-shadow:var(--shadow)}.progress-card-head{display:flex;justify-content:space-between;font-weight:600;font-size:14px;margin-bottom:8px}.progress-bar{height:8px;background:var(--badge-bg);border-radius:999px;overflow:hidden}.progress-bar-fill{height:100%;width:0;background:var(--primary);border-radius:999px;transition:width .35s}.reset-btn{margin-top:12px;font-size:13px;color:var(--text-soft);border:1px solid var(--border);border-radius:8px;padding:4px 12px}.reset-btn:hover{background:var(--bg-hover)}.side-part-label{font-size:12.5px;font-weight:700;color:var(--text-faint);letter-spacing:.1em;margin:18px 8px 6px}.side-chapter{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:14px;color:var(--text);border-left:3px solid transparent}.side-chapter:hover{background:var(--bg-hover)}.side-chapter.active{background:var(--primary-soft);border-left-color:var(--primary);font-weight:600}.side-chapter-icon{font-size:15px;width:20px;text-align:center;flex-shrin ap:14px;align-items:flex-start;border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:14px}.main-video-icon{width:40px;height:40px;border-radius:10px;background:var(--accent-blue-bg);color:var(--accent-blue);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}.main-video-info{flex:1;min-width:0}.main-video-title{font-weight:700;font-size:15px}.main-video-meta{font-size:13px;color:var(--text-soft);margin:2px 0 6px}.main-video-note{font-size:14px;color:var(--text-soft)}.play-btn{width:38px;height:38px;border-radius:10px;flex-shrink:0;background:var(--accent-red-bg);color:var(--accent-red);border:1px solid transparent;font-size:15px;display:flex;align-items:center;justify-content:center;align-self:center}.play-btn:hover{border-color:var(--accent-red)}.self-check{background:var(--accent-yellow-bg);border:1px solid var(--accent-yellow-border);border-radius:12px;padding:14px 18px;margin-bottom:14px;font-size:14.5px}.self-check-title{font-weight:700;margin-right:4px}.self-check-title::before{content:"📝 "}.cards-2col{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}.mistake-card,.skill-card{border:1px solid var(--border);border-radius:12px;padding:14px 18px;font-size:14px}.mistake-card-title{color:var(--accent-red);font-weight:700;margin-bottom:6px}.mistake-card-title::before{content:"🔥 "}.skill-card-title{color:var(--accent-blue);font-weight:700;margin-bottom:6px}.skill-card-title::before{content:"🎯 "}.skill-card ul{list-style:none}.skill-card li{background:var(--badge-bg);border-radius:8px;padding:4px 12px;margin-bottom:6px;font-size:13.5px}.ext-head{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px;margin:4px 0 10px}.ext-head::before{content:"●";color:var(--primary);font-size:10px}.ext-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px}.ext-card{border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}.ext-card-top{display:flex;gap:10px;align-items:flex-start}.ext-card-title{font-weight:700;font-size:14.5px;flex:1}.ext-card-note{font-size:13.5px;color:var(--text-soft);flex:1}.ext-card-tip{font-size:12.5px;background:var(--badge-bg);border-radius:8px;padding:3px 10px;align-self:flex-start}.ext-card-meta{font-size:12.5px;color:var(--text-faint)}.ext-thumb{width:120px;border-radius:8px;aspect-ratio:16/9;object-fit:cover;flex-shrink:0;background:var(--badge-bg)}.lesson-wrap{max-width:900px;margin:0 auto}.lesson-topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px}.lesson-pos{font-size:14px;color:var(--text-soft)}.lesson-nav-btn{border:1px solid var(--border);border-radius:8px;padding:7px 16px;font-size:14px;background:var(--bg-card)}.lesson-nav-btn:hover:not(:disabled){background:var(--bg-hover)}.lesson-nav-btn:disabled{opacity:.4;cursor:default}.lesson-nav-btn.primary{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:600}.lesson-breadcrumb{font-size:13px;color:var(--text-faint);margin-bottom:4px}.stance-wrap{max-width:780px;margin:0 auto}.stance-card{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:24px 28px;margin-bottom:18px;box-shadow:var(--shadow)}.stance-card h2{font-size:17px;margin-bottom:8px}.stance-card p{color:var(--text-soft);font-size:14.5px}.stance-disclaimer{border-left:4px solid var(--accent-red)}.search-summary{font-size:14px;color:var(--text-soft);margin-bottom:16px}.search-empty{text-align:center;color:var(--text-faint);padding:60px 0;font-size:15px}mark{background:var(--accent-yellow-border);color:inherit;border-radius:3px;padding:0 2px}.lightbox{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center}.lightbox.hidden{display:none}.lightbox-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.72)}.lightbox-body{position:relative;width:min(920px,94vw);background:var(--bg-card);border-radius:14px;box-shadow:var(--shadow-lg);overflow:hidden}.lightbox-frame{aspect-ratio:16/9;background:#000}.lightbox-frame iframe{width:100%;height:100%;border:none;display:block}.lightbox-caption{padding:12px 18px;font-size:14px}.lightbox-caption a{color:var(--primary)}.lightbox-close{position:absolute;top:10px;right:10px;z-index:2;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:14px}@media (max-width:1000px){.cards-2col,.ext-grid{grid-template-columns:1fr}.searchbox{width:170px}}@media (max-width:780px){.sidebar{display:none}.main{padding:16px 14px 60px}.brand-name{display:none}}</style>

<body>

<header class="topbar">
  <div class="topbar-left">
    <div class="brand">
      <span class="brand-icon">🎮</span>
      <span class="brand-name">職涯升級系統</span>
    </div>
    <nav class="topnav">
      <button class="topnav-item active" data-view="content">
        <span class="topnav-icon">📚</span>課程內容
        <span class="badge" id="badge-total-items">0</span>
      </button>
      <button class="topnav-item" data-view="lesson">
        <span class="topnav-icon">▶</span>上課模式
      </button>
      <button class="topnav-item" data-view="stance">
        <span class="topnav-icon">🧭</span>這門課的立場
        <span class="badge" id="badge-stance">0</span>
      </button>
    </nav>
  </div>
  <div class="topbar-right">
    <div class="searchbox">
      <span class="search-icon">🔍</span>
      <input type="search" id="search-input" placeholder="搜尋單元、主題或影片…" autocomplete="off">
    </div>
    <button class="icon-btn" id="theme-toggle" title="切換深淺色主題">☀️</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="progress-card">
      <div class="progress-card-head">
        <span>學習進度</span>
        <span id="progress-count">0 / 0</span>
      </div>
      <div class="progress-bar"><div class="progress-bar-fill" id="progress-fill"></div></div>
      <button class="reset-btn" id="reset-progress">⟲ 重設進度</button>
    </div>
    <nav class="side-nav" id="side-nav"><!-- rendered by app.js --></nav>
    <div class="sidebar-foot">本站為教學資源策展，非投資建議</div>
  </aside>

  <main class="main" id="main-content"><!-- rendered by app.js --></main>
</div>

<!-- video lightbox -->
<div class="lightbox hidden" id="lightbox">
  <div class="lightbox-backdrop" data-close-lightbox></div>
  <div class="lightbox-body">
    <button class="lightbox-close" data-close-lightbox title="關閉">✕</button>
    <div class="lightbox-frame" id="lightbox-frame"></div>
    <div class="lightbox-caption" id="lightbox-caption"></div>
  </div>

<script>window.COURSE_DATA={title:"職涯升級系統",storageKey:"career-upgrade",subtitle:"用遊戲化思維重新設計你的職涯：從焦慮迷茫到有方向、有策略、有行動",stance:[{title:"立場一：職涯沒有標準答案，適合你的才是最好的",body:"這門課不教「正確路線」，而是幫你建立探索與判斷的框架。每個人的起點、資源、偏好都不同，與其追求別人定義的成功，不如用系統化的方式找出屬於自己的升級路徑。"},{title:"立場二：遊戲化不是把工作當兒戲",body:"用遊戲化思維管理職涯，是把成長拆解成可追蹤的里程碑與可操作的行動——設定目標、累積經驗值、解鎖技能樹，而不是抱持「玩玩看」的態度。這套方法的核心是讓你在不確定中保持前進動力。"},{title:"本站為學習策展，非專業職涯諮詢（免責聲明）",body:"本站整理 YouTube 公開教學資源並規劃學習路徑，僅供自學參考。涉及職涯重大決策（轉職、離職、創業），建議諮詢專業職涯顧問。所有影片內容版權屬各原創頻道所有。"}],parts:[{id:"reboot",name:"重開機",chapters:[{id:"ch1",name:"重新定位你的職涯",icon:"🔄",units:[{id:"u-career-anxiety-root",name:"職涯焦慮的根本原因",tags:["心態觀念"],mainVideo:{youtubeId:"9MfVKw-_Sa8",title:"人生沒有目標？容易放棄？重啟你的內在指南針｜Sherry's Notes 雪力的心理學筆記",channel:"Sherry's Notes 雪力的心理學筆記",duration:551,views:448389,uploadDate:"20211026",note:"從心理學角度剖析為什麼我們會對職涯感到迷茫——問題不在外部環境，而是內在指南針失靈。雪力用清晰的框架解釋目標感的來源與消失機制，適合作為整門課的起點：先理解焦慮的根源，後面的方法才有著力點。"},selfCheck:"看完後你能回答：職涯焦慮的根源是外在環境（薪水、公司、產業）還是內在狀態？當你說「不知道自己要什麼」，背後真正缺少的是什麼？你目前的焦慮，屬於「資訊不足」還是「自我認識不足」？如果是後者，你打算從哪裡開始重新認識自己？",mistakes:"把焦慮全歸咎於外在環境——薪水太低、主管太爛、產業沒前景。這些可能是事實，但只看外部會讓你陷入「換一個環境就好了」的循環，忽略了真正需要處理的是內在的方向感。",skills:["區分你的職涯不滿是「環境問題」還是「方向問題」","用一張紙寫下過去三年讓你有成就感的時刻，找出共通模式","停止比較他人的職涯軌跡，專注盤點自己的現有資源與偏好"],extVideos:[{youtubeId:"orGu_8rj_IY",title:"【學習成長】你快被職涯焦慮壓垮了嗎？┃五招幫你解決職涯焦慮┃HR菲比小姐",channel:"HR菲比小姐",duration:586,views:4978,uploadDate:"20220522",note:"從人資角度提供五個應對職涯焦慮的實用方法，補充具體可操作的行動步驟。"},{youtubeId:"EsIvZWYF09g",title:"9成人都想離職！老是職業倦怠，到底該怎麼辦？換工作是解方嗎？ft.雪力｜志祺七七",channel:"志祺七七",duration:1427,views:158410,uploadDate:"20260210",note:"探討職業倦怠與離職衝動——換工作不一定是解方，先搞清楚倦怠的類型才能對症下藥。",tip:"留意影片中區分三種倦怠類型的段落，對照自己屬於哪一種"},{youtubeId:"qPf0RjoXAkA",title:"為何許多人都在問：未來要做什麼？真相在這裡！｜青茶說",channel:"青茶說",duration:1004,views:85850,uploadDate:"20241021",note:"用哲學諮商視角解讀「不知道未來要做什麼」的焦慮，提供不同於心理學的思考路徑。"}]},{id:"u-gamification-mindset",name:"職場遊戲化思維",tags:["心態觀念","方法論"],mainVideo:{youtubeId:"FY3Xz6zVSpY",title:"EP488 用玩RPG的思維經營你的人生？！職場卡關不能錯過的3大攻略！｜大人的Small Talk",channel:"大人學",duration:2597,views:21659,uploadDate:"20240808",note:"大人學用 RPG 遊戲框架解讀職涯經營——選角色、配技能點、接任務、打副本。這支影片直接對應本課程的核心方法論：把職涯當成可被設計的遊戲，而不是被動等待。理解這套思維後，後續每一篇的工具才有統一的邏輯。"},selfCheck:"看完後你能回答：把職涯「遊戲化」和把工作「不當回事」有什麼本質差異？RPG 思維中的「角色定位」對應到職場是什麼？你目前的職涯卡關，用遊戲語言來說是「等級不足」「裝備不對」還是「選錯副本」？",mistakes:"聽完遊戲化思維就開始「佛系經營」——覺得既然是遊戲，那輸了也沒關係。遊戲化的重點不是降低嚴肅性，而是建立系統化的成長追蹤機制。沒有經驗值累積和技能樹規劃的「遊戲化」，只是給拖延找了一個好聽的名字。",skills:["用一句話描述你在職場中的「角色定位」——你是什麼職業、擅長什麼打法","列出你目前正在「刷」的三個副本（專案或任務），評估經驗值是否值得","設定一個 30 天內可完成的「支線任務」，用來測試新技能或新方向"],extVideos:[{youtubeId:"eqH_sGGWYoc",title:"生活自律、產品銷售、人才管理，都可以靠遊戲化設計提升成功率！ft. 國際遊戲化權威 周郁凱｜志祺七七",channel:"志祺七七",duration:1334,views:59427,uploadDate:"20250813",note:"周郁凱的八角框架是遊戲化設計的經典模型，理解它能幫你設計出有動力的職涯計畫。",tip:"注意「核心驅動力」的分類——看看哪些驅動力是你目前工作中最缺乏的"},{youtubeId:"YB489WZFl_k",title:"EP156 關於人生的遊戲規則——有些錯誤你該嘗試，有些則萬萬不可出差錯｜大人的Small Talk",channel:"大人學",duration:1573,views:37788,uploadDate:"20210603",note:"補充「人生遊戲」中的風險管理——哪些錯誤是可逆的經驗值，哪些是不可逆的遊戲結束。"},{youtubeId:"q6FMvXJpyBg",title:"「我難道一輩子就要這樣了嗎？」大人學職涯規劃心法大公開！ft. 大人學 Bryan｜志祺七七",channel:"志祺七七",duration:1107,views:335880,uploadDate:"20230826",note:"大人學創辦人 Bryan 分享職涯規劃的底層邏輯，從停滯感中找出突破口。"}]}]}]},{id:"read-the-map",name:"看懂局",chapters:[{id:"ch2",name:"探索你的職涯地圖",icon:"🗺️",units:[{id:"u-stay-flexible",name:"留彈性｜在資訊不足下的不敗選擇",tags:["策略思維"],mainVideo:{youtubeId:"-BlS-debE8k",title:"EP408 擺脫職涯困境別靠孤注一擲，而是在對的路上走穩每一步｜大人的Small Talk",channel:"大人學",duration:2072,views:23802,uploadDate:"20231102",note:"多數人在職涯困境中會想「孤注一擲」——裸辭、轉行、創業。這支影片提醒你：真正的不敗策略是在現有位置上保持彈性，走穩每一步而非賭一把。在資訊不足時，保留選項比做出「決定性選擇」更重要。"},selfCheck:"你能說出目前手上有哪些「選項」嗎？如果明天公司裁員，你有幾條路可以走？「保持彈性」和「沒有方向」的差別是什麼？你最近做過的一個職涯決定，是在資訊充足下做的，還是在焦慮驅動下做的？",mistakes:"在資訊不足時做出不可逆的重大決定——裸辭後才開始想下一步、all-in 一個還不確定的方向。另一個極端是「永遠在等更多資訊」而什麼都不做，這其實也是一種選擇，只是你沒意識到它的代價。",skills:["盤點你目前擁有的選項數量，如果少於三個就刻意創造新選項","在做重大決定前問自己：這個決定可逆嗎？不可逆的話我能承受最壞結果嗎？","每季花一小時更新你的「職涯備案清單」，即使現在不打算用"],extVideos:[{youtubeId:"3lXX3vwYVqI",title:"EP204 關於工作選擇：與其討論擅不擅長，不如談談天賦與熱情｜大人的Small Talk",channel:"大人學",duration:1757,views:31556,uploadDate:"20211118",note:"工作選擇不必非黑即白——先探索天賦與熱情的交集，比急著「選定方向」更實際。"},{youtubeId:"NHOxd4APEpo",title:"EP690 工作做得開心卻賺不到錢，我該追求熱情還是趕快轉行？｜大人的Small Talk",channel:"大人學",duration:1721,views:7956,uploadDate:"20260720",note:"拆解「熱情 vs 收入」的假二選一——釐清四大職涯盲點後你會發現第三條路。"},{youtubeId:"xKtAqR89I_k",title:"對工作倦怠怎麼辦？你真的適合你的工作嗎？ft.職涯諮詢師 葉家瑜｜志祺七七",channel:"志祺七七",duration:1251,views:85149,uploadDate:"20230729",note:"從職涯諮詢師的角度檢視「你適不適合這份工作」，提供結構化的自我評估方法。"}]},{id:"u-keywords",name:"關鍵字｜收斂你對完美工作的想像",tags:["自我探索","實作工具"],mainVideo:{youtubeId:"Ka6VKEUj8-o",title:"【看完再努力】如何找到適合自己的工作⭐ 選對跑道後薪水漲3倍",channel:"HelloJuJu",duration:673,views:279790,uploadDate:"20240126",note:"用實際轉職經歷示範「選對跑道」的威力。核心觀點：與其追求完美工作，不如找出你的三個職涯關鍵字（工作內容、能力發揮、價值意義），再用它們交叉篩選機會。這正是本單元「收斂想像」的核心方法。"},selfCheck:"你能用三個關鍵字描述你的理想工作嗎？這三個關鍵字是從自我探索中提煉的，還是從別人的期待中借來的？如果把你目前的工作和這三個關鍵字比對，匹配度大概多少？不匹配的部分，是可以透過調整現有工作來改善的嗎？",mistakes:"用「完美工作」的幻想取代具體的探索——「我要找一份既有意義、又高薪、又自由、又穩定的工作」。這種全要的想像讓你永遠找不到，因為你從來沒有排過優先順序。收斂不是放棄，而是聚焦。",skills:["從五個維度（工作內容、能力發揮、人際互動、環境條件、價值意義）各列出 2-3 個候選關鍵字","從候選池中收斂出最重要的三個關鍵字，並排出優先順序","用這三個關鍵字重新審視你目前的工作或下一份目標工作"],extVideos:[{youtubeId:"EhUdOqbR-9w",title:"如何找到適合自己的工作？夢想可以當飯吃嗎？｜葳老闆的辣雞湯",channel:"葳老闆的辣雞湯🌶️",duration:883,views:387568,uploadDate:"20210519",note:"用直白的方式拆解「夢想 vs 現實」的選擇——不是雞湯，而是務實的思考框架。"},{youtubeId:"4E5GaP3f5f4",title:"什麼是適合自己的工作？回答這 3 個問題，怎麼選工作都不後悔！｜Dr. Harvey不廢話",channel:"商談・不廢話 | Real Biz Chat",duration:433,views:7608,uploadDate:"20240626",note:"三個核心問題幫你快速收斂——即使沒有明確的「熱情」也能做出不後悔的選擇。"},{youtubeId:"PsPWlVvoPGc",title:"如何找到「適合自己」的工作？職場工作選擇障礙先看這篇｜IamMarkVen",channel:"IamMarkVen",duration:975,views:18685,uploadDate:"20211007",note:"從「選擇障礙」的角度切入——你不是不知道要什麼，而是需要一套篩選系統。"}]},{id:"u-tune-frequency",name:"調頻率｜找出讓你怦然心動的任務",tags:["自我探索","心流"],mainVideo:{youtubeId:"GxJH-FP5GB8",title:'當一個人進入"心流"到底有多可怕？四個技巧教你快速進入心流，翻倍你的工作效率！',channel:"富人俱樂部",duration:874,views:335622,uploadDate:"20230626",note:"心流是「怦然心動的任務」的科學名稱——當挑戰程度和你的能力恰好匹配時，你會進入全神貫注、忘記時間的狀態。這支影片教你辨認和創造心流條件，等於在教你「調頻」到對的工作頻率。"},selfCheck:"你能說出最近一次在工作中進入心流的經驗嗎？那時你在做什麼？如果想不起來，是因為工作太簡單（無聊）還是太困難（焦慮）？你知道自己的心流條件是什麼嗎——需要安靜還是熱鬧、獨立還是協作、創造還是分析？",mistakes:"等待心流自動出現，而不去主動創造條件。心流不是天賦，是可以被設計的——它需要明確的目標、即時的回饋、和剛好超出能力一點點的挑戰。如果你的工作完全沒有心流體驗，問題可能不在工作本身，而在你沒有調整任務的難度和方式。",skills:["回顧過去一個月，標記出讓你「忘記時間」的任務，分析它們的共通特徵","在日常工作中刻意調整一項任務的挑戰程度，讓它略高於你目前的能力","建立一個「心流觸發清單」：什麼環境、什麼時段、什麼類型的工作最容易讓你進入狀態"],extVideos:[{youtubeId:"h-1m63cxwl4",title:"這3個方法，幫助你在日常裡找到熱情與幸福►《心流》FLOW 正向心理學｜千芸說書",channel:"千芸說書book review",duration:916,views:98445,uploadDate:"20220119",note:"說書角度拆解《心流》——如何在日常生活中（不只工作）找到最優體驗的方法。"},{youtubeId:"CmVbgxXVFcM",title:"進入心流的關鍵心理：別讓表現綁架自我認同 with Dr. Michael Gervais｜雪力",channel:"Sherry's Notes 雪力的心理學筆記",duration:2700,views:28892,uploadDate:"20260403",note:"深層心理視角：為什麼「怕表現不好」會阻止你進入心流——放下自我評價才能全情投入。"},{youtubeId:"qDPDS2pMpvU",title:'"肯學習"是求職地雷？找工作前６個心態與準備｜雪力',channel:"Sherry's Notes 雪力的心理學筆記",duration:967,views:45309,uploadDate:"20240621",note:"從求職角度談「調對頻率」——你展現出來的特質要和目標工作的需求對齊。"}]},{id:"u-open-map",name:"開地圖｜三軸向拓展你的認知邊界",tags:["視野拓展"],mainVideo:{youtubeId:"nHFappVbZmA",title:"什麼是多重職涯組合？AI時代下的重要人生觀｜Sherry's Notes 雪力的心理學筆記",channel:"Sherry's Notes 雪力的心理學筆記",duration:1506,views:14258,uploadDate:"20260724",note:"雪力介紹「Portfolio Career（組合式職涯）」的概念——職涯不再是一條直線，而是多條軌道的組合。這正是「開地圖」的核心：看見更多可能的路徑，才能做出更好的選擇。AI 時代讓這種多重身份的職涯模式變得更可行。"},selfCheck:"你認為職涯只有「往上爬」一個方向嗎？除了升遷，你能說出至少兩種「職涯發展」的方式嗎？你目前的視野是被產業限制、被職能限制、還是被地理限制？如果可以自由組合，你會把哪些不同領域的能力拼在一起？",mistakes:"只在自己熟悉的領域裡找答案——做行銷的只看行銷職缺，做工程的只看工程職缺。認知邊界的拓展不是要你變成通才，而是讓你看見「跨界組合」的可能性。很多突破性的機會都藏在你目前認知地圖的邊緣。",skills:["列出你目前認知範圍內的所有職涯選項，然後問三個不同產業的朋友他們怎麼看你的能力","每月接觸一個你完全不熟悉的領域——讀一本書、聽一場演講、或約一個該領域的人聊天","畫一張你的「職涯地圖」：橫軸是產業、縱軸是職能、第三軸是工作型態"],extVideos:[{youtubeId:"WL3AGmQBJLQ",title:"管理職快消失了？哈佛教授解密 AI 時代組織圖：T型專家與M型通才如何翻轉身價",channel:"知識商業研究所",duration:2189,views:4929,uploadDate:"20260715",note:"哈佛教授的觀點：AI 時代的人才價值從「深度專精」轉向「T型或M型」的跨域組合。",tip:"對照自己是T型還是I型，思考要不要開始往橫向發展"},{youtubeId:"zgbnEy2oVgk",title:"EP354 想中年轉職，職場難有機會？年紀不是你職涯卡關的主因｜大人的Small Talk",channel:"大人學",duration:1971,views:55049,uploadDate:"20230427",note:"打破「年紀大就沒機會」的迷思——卡關的原因往往是認知邊界太窄，不是年齡。"},{youtubeId:"czPxfhoHBeQ",title:'找到你的"人生之路"的正確方法 | 老高與小茉',channel:"老高與小茉 Mr & Mrs Gao",duration:2071,views:6394938,uploadDate:"20240313",note:"用更宏觀的視角看「人生之路」——適合在拓展認知邊界時給自己一些更大的想像空間。"}]},{id:"u-skill-tree",name:"技能樹｜打造個人專屬的升級路徑",tags:["實作工具","能力盤點"],mainVideo:{youtubeId:"ZTpBchiOaWA",title:"軟實力重要還是硬實力重要！提升你的職場競爭力學會三隻腳思維｜IamMarkVen",channel:"IamMarkVen",duration:936,views:3697,uploadDate:"20211004",note:"「三隻腳思維」是建構技能樹的基礎框架——你需要硬實力（專業技術）、軟實力（溝通協作）、加上一條差異化的「第三隻腳」。這支影片幫你理解技能不是越多越好，而是要形成穩固的支撐結構。"},selfCheck:"你能畫出自己目前的技能樹嗎——哪些技能已經點滿、哪些還在初級、哪些完全沒有？你的技能組合有沒有形成獨特的「角色」，還是和其他人高度重疊？如果要加一個新技能，你會選擇加深現有的，還是開一個全新的分支？",mistakes:"技能焦慮：看到什麼火就學什麼——AI 火學 AI、數據火學數據、設計火學設計。沒有策略的技能累積就像 RPG 裡每個技能都點一點但都不精，結果什麼副本都打不了。技能樹需要有主線和支線，不是全面開花。",skills:["列出你的「硬實力」「軟實力」和「差異化能力」各三項，檢查結構是否穩固","找出你所在領域中公認「必備但你還沒有」的技能，排出學習優先順序","設計一個 90 天的技能升級計畫，聚焦在一個技能上做到「堪用」程度"],extVideos:[{youtubeId:"tT_WiCruEmM",title:"自動控制的職涯發展！如何點擊你的技能樹？",channel:"陳真 憑真本事",duration:325,views:1488,uploadDate:"20230601",note:"用「技能樹」的遊戲化概念直接對應職涯發展——短片，概念清晰好入門。"},{youtubeId:"80oeuL_krSM",title:"職場軟實力的重要性與增強方法",channel:"富職致富",duration:700,views:1329,uploadDate:"20221231",note:"專門展開「軟實力」這條支線——很多人硬實力夠了但軟實力成為瓶頸。"},{youtubeId:"Wc9NHYfY5uA",title:"EP215 影響我職涯最大的外掛技能——銷售能力｜大人的Small Talk",channel:"大人學",duration:2503,views:52529,uploadDate:"20211227",note:"大人學分享一個意想不到的「外掛技能」——銷售能力如何成為職涯最大的加速器。",tip:"思考你的技能樹中有沒有類似的「外掛技能」可以大幅提升整體戰力"}]}]}]},{id:"strategy",name:"選策略",chapters:[{id:"ch3",name:"規劃你的升級策略",icon:"🎯",units:[{id:"u-point-card",name:"集點卡｜化職涯為集點晉級的過程",tags:["策略思維","經驗累積"],mainVideo:{youtubeId:"8GpibFsSSVM",title:"中年轉職很難？怎麼把「年資」變「優勢」？30歲、40歲、50歲的最佳職涯策略",channel:"BetweenGos 找到你的職場優勢",duration:846,views:12617,uploadDate:"20250306",note:"每一段工作經歷都是「集點」——重點不是工作了幾年，而是這些年你集到了什麼點數。這支影片拆解不同年齡段的最佳策略，讓你理解職涯是一個「累積」的遊戲，而不是「跳躍」的遊戲。"},selfCheck:"你能說出過去每份工作讓你「集到」了什麼嗎——是技能、人脈、還是產業知識？這些點數是否有在累積，還是每次換工作都從零開始？你目前的工作正在幫你集什麼類型的點數？這些點數對你的長期目標有幫助嗎？",mistakes:"把「年資」當「經驗」——在同一個位置做了五年，但其實是一年的經驗重複五次。集點卡的重點不是蓋章的數量，而是每個章代表的成長。另一種錯誤是頻繁跳槽，每份工作都還沒集到有價值的點就走了。",skills:["回顧你每份工作的「集點成果」：學到什麼技能、建立什麼人脈、累積什麼作品","為你目前的工作設定明確的「集點目標」——在這裡你要集到什麼才算值回票價","評估下一步的職涯選擇時，用「能集到什麼新點數」作為關鍵考量"],extVideos:[{youtubeId:"DFyUgh3WgB0",title:"EP509【升遷】為何升官的不是我？！專業之外，還看「升遷策略地圖」5元件",channel:"104人力銀行",duration:1941,views:5318,uploadDate:"20250826",note:"升遷不只看能力——了解「升遷策略地圖」的五個元件，讓你的集點更有方向。"},{youtubeId:"0ANFQlkvZe4",title:"為什麼拚命做的人不是先升遷？真正厲害的人懂得如何休息跟練習｜艾爾文",channel:"艾爾文",duration:701,views:229788,uploadDate:"20200623",note:"「一流的人如何保持顛峰」的核心觀點——持續集點需要刻意練習和策略性休息的平衡。"},{youtubeId:"I8DX5TlbhRw",title:"EP220 明明領基層的薪水，老闆卻要我用上位者的方式思考？｜大人的Small Talk",channel:"大人學",duration:1591,views:12625,uploadDate:"20220113",note:"用「上位者思維」集點——在基層就開始練習高階思考，等到升遷機會來時才有準備。"}]},{id:"u-killer-move",name:"必殺技｜修練小技能擦亮個人品牌",tags:["個人品牌","差異化"],mainVideo:{youtubeId:"YdrzU-H2dOE",title:"如何打造個人品牌？沒有粉絲可以透過個人品牌賺錢嗎？Feat.Yale Chen || Ms. Selena",channel:"Ms.Selena",duration:1049,views:21598,uploadDate:"20200903",note:"個人品牌不需要百萬粉絲——它是你在職場中被辨識的「必殺技」。這支影片從零開始講解如何找到和打磨你的差異化定位，適合還沒開始經營個人品牌的人理解：品牌不是自吹自擂，而是讓對的人認出你的價值。"},selfCheck:"如果別人要用一句話介紹你的專業價值，他們會怎麼說？你有沒有一個讓人印象深刻的「小技能」或獨特角度？你的必殺技是通用型的還是差異化的——「我會做簡報」vs「我擅長用數據說故事給非技術人員聽」？",mistakes:"覺得個人品牌是網紅才需要的東西。在職場中，你的品牌就是同事和主管提到你時腦中浮現的印象。如果這個印象模糊或沒有記憶點，升遷和好機會就很難主動找上你。不是要你去當網紅，而是要讓你的專業有記憶點。",skills:["問五個同事或朋友：「你覺得我最擅長什麼？」收集他人眼中的你","從收集的回饋中找出一個可以深化的「必殺技」，投入 30 天刻意練習","在工作中創造一個可以展示必殺技的機會——寫一篇分享、主持一個小工作坊"],extVideos:[{youtubeId:"FMdZMDXbxM4",title:"別再燒錢做品牌！360º 品牌定位系統，從零打穩品牌核心價值｜查理的創業化合物",channel:"查理的創業化合物",duration:5766,views:85330,uploadDate:"20241022",note:"雖然講的是企業品牌，但「品牌定位系統」的方法完全可以套用到個人品牌的建立。",tip:"把影片中的「品牌」替換成「你自己」來聽，特別是核心價值和差異化的段落"},{youtubeId:"150EhCNtg00",title:"為什麼要經營個人品牌？經營個人品牌怎麼樣算成功？｜李洛克",channel:"李洛克的大師小聊",duration:643,views:1225,uploadDate:"20210908",note:"個人品牌入門第一課——先理解「為什麼要做」和「做到什麼程度算成功」。"},{youtubeId:"_Ov5_yvV2oY",title:"35歲就是「職場老人」？專業知識比不過年輕肝的「職場魔咒」？",channel:"The World TODAY",duration:519,views:321909,uploadDate:"20230710",note:"反面視角：如果沒有差異化的必殺技，年齡增長反而變成劣勢——這就是為什麼要盡早打造個人品牌。"}]},{id:"u-catch-luck",name:"捉好運｜發掘藏在身邊的職場契機",tags:["機會辨識"],mainVideo:{youtubeId:"iJr_Ppp3POw",title:"運氣和能力哪一個更重要？運氣好的人都有的3個特質！《科學的好運》",channel:"富人俱樂部",duration:841,views:75962,uploadDate:"20230918",note:"運氣不是隨機的——《科學的好運》研究發現，幸運的人有三個共通特質：開放性高、善於注意細節、行動力強。這支影片用科學視角解讀「好運」，讓你理解職場機會不是等來的，而是被特定的行為模式「吸引」來的。"},selfCheck:"回想過去三年你遇到的最好的職場機會——它是怎麼來的？是你主動爭取的，還是「剛好」出現的？如果是「剛好」，你能分析出哪些行為讓你剛好在對的時間出現在對的地方嗎？你目前有沒有在做任何「增加運氣面積」的事？",mistakes:"等待好運降臨——「等到好機會出現我就行動」。研究顯示，幸運的人不是等到好運，而是因為嘗試的次數多、接觸面廣、對新事物保持開放，所以「碰到」機會的機率比別人高。被動等待是減少運氣的最有效方法。",skills:["每週刻意和一個「非日常圈」的人交流——不同部門、不同產業、不同背景","對意外的邀請或機會說「好」至少一次，即使它不在你的計畫中","建立一個「機會雷達」：定期掃描產業趨勢、職缺動態、和社群中的新需求"],extVideos:[{youtubeId:"rgioY4rIeFQ",title:"這個節目就是你幸運的開始｜15步創造你自己的運氣",channel:"堆金積玉",duration:1162,views:22768,uploadDate:"20220222",note:"15 個具體步驟幫你「創造運氣」——從改變日常習慣開始增加機會碰撞的面積。"},{youtubeId:"KHCgNfHVxSE",title:"轉職舉棋不定？只要看一件事就夠｜104職涯診所",channel:"104人力銀行",duration:245,views:47554,uploadDate:"20200211",note:"短片點出一個關鍵——辨識轉職契機只需要看一件事，別讓猶豫讓好運溜走。"},{youtubeId:"DeNsOvJw3TU",title:"人脈大健檢！如何打造你的「成長型人脈」？｜哈佛商業評論",channel:"哈佛商業評論",duration:2094,views:772,uploadDate:"20250115",note:"「成長型人脈」是職場好運的基礎設施——好機會往往透過人脈網絡傳遞，而不是職缺網站。"}]},{id:"u-hopscotch",name:"跳格子｜跨領域轉職的低風險策略",tags:["轉職策略"],mainVideo:{youtubeId:"mqdnGJ9MqN0",title:"跨領域轉職的 3 個關鍵準備：方法、風險、優勢，完整分析給你聽！",channel:"BetweenGos 找到你的職場優勢",duration:735,views:3712,uploadDate:"20250313",note:"BetweenGos 用結構化的方式拆解跨領域轉職——不是一步跳到全新領域，而是像跳格子一樣一格一格跨。三個關鍵準備幫你降低風險：找到可遷移的能力、建立目標領域的初步作品、創造低成本的試錯機會。"},selfCheck:"你想轉職是因為「想去哪裡」還是「想離開這裡」？你目前的能力中，有哪些是可以直接帶到新領域的「可遷移能力」？你有沒有在不離職的情況下測試過目標領域——比如接案、志工、或個人專案？",mistakes:"裸辭轉職——在沒有目標領域的經驗、作品、和人脈的情況下直接離開。這不是勇敢，是把風險最大化。低風險的跨領域策略是在現有工作中逐步建立橋樑，讓轉職變成「自然過渡」而非「斷崖跳躍」。",skills:["列出你目前所有能力中可以跨域使用的「可遷移能力」","在不離職的前提下，用一個月時間在目標領域做一個小型實驗（接案、寫文章、做專案）","找到目標領域中已經成功轉職的人，了解他們的路徑和建議"],extVideos:[{youtubeId:"zIOc0WLlAXc",title:"跨領域轉職工程師求職策略與心態｜ALPHA Camp",channel:"ALPHA Camp School",duration:609,views:2049,uploadDate:"20201118",note:"以轉職工程師為例——非本科跨入技術領域的具體策略和心態調整。"},{youtubeId:"7AYlEbuenN4",title:"轉職軟體工程師後如何思考職涯規劃與發展？｜ALPHA Camp",channel:"ALPHA Camp School",duration:758,views:5073,uploadDate:"20201216",note:"轉職「之後」的規劃——成功跳格子只是第一步，在新領域如何繼續升級同樣重要。"},{youtubeId:"uL7G6JZaCp0",title:"轉職拖延？明明重要卻拖拖拉拉... 職涯教練拆解 5 大原因",channel:"BetweenGos 找到你的職場優勢",duration:895,views:7128,uploadDate:"20250220",note:"如果你一直想轉職卻一直沒行動，這五個拖延原因可能正中要害。"}]},{id:"u-clone",name:"開分身｜在職中同步提升市場行情",tags:["副業策略","市場價值"],mainVideo:{youtubeId:"ZKBlKqZLLBc",title:"想增加收入？2025最賺錢的6種副業！副業選對，財富翻倍！",channel:"Ms.Selena",duration:756,views:136478,uploadDate:"20250311",note:"「開分身」不是叫你做兩份全職，而是在主業之外開一條副線來測試市場、累積作品、和提升議價能力。這支影片盤點當前最實際的副業選項，幫你找到與主業互補而非衝突的分身路徑。"},selfCheck:"你目前的市場行情如何——如果明天要換工作，你能談到多少薪水？你有沒有「主業以外」的收入來源或技能展示？如果要開一個分身，你會選擇和主業相關的（深化專業）還是完全不同的（拓展可能性）？",mistakes:"把副業當成「多一份薪水」而忽略它的策略價值。開分身的真正目的不只是賺外快，而是：測試新領域的水溫、累積可公開展示的作品、建立主業以外的專業人脈。如果副業只是把時間賣給另一個雇主，你只是在打兩份工。",skills:["評估你目前的時間和精力預算，找出每週可投入副業的 5-10 小時","選擇一個能「累積作品」的副業類型，而不是純粹出賣時間的工作","設定副業的三個月里程碑：要驗證什麼假設、累積什麼成果、建立什麼連結"],extVideos:[{youtubeId:"HeX55oTficw",title:"6種在家增加收入的方式！在家賺錢每月多賺五位數！｜SHIN LI 李勛",channel:"SHIN LI",duration:586,views:283897,uploadDate:"20210605",note:"務實盤點在家就能做的增收方式——從低門檻開始，不需要先投入大量資金。"},{youtubeId:"KMXtzyiN1Hk",title:"低門檻！普通人也能做的簡單副業💰上班族＆學生黨增加額外收入",channel:"Aya He",duration:491,views:179860,uploadDate:"20250312",note:"專為「沒有一技之長」的人設計的副業起步指南——從簡單開始也能累積經驗。"},{youtubeId:"aqhQAE7298o",title:"從斜槓紅海中找到你的契機點！人生獲利三部曲（上）｜謝文憲",channel:"謝文憲的極憲思維",duration:527,views:1722,uploadDate:"20210825",note:"從「斜槓紅海」中脫穎而出的策略——不是做別人都在做的，而是找到你的獨特契機點。"}]}]}]},{id:"build-capital",name:"積籌碼",chapters:[{id:"ch4",name:"累積你的職場資本",icon:"🏆",units:[{id:"u-achievement",name:"解成就｜用年度里程碑度過停滯期",tags:["目標設定","突破停滯"],mainVideo:{youtubeId:"Nps6p2SYSiA",title:"如何開啟更好的一年？克服3個自我停滯的風險｜艾爾文",channel:"艾爾文",duration:640,views:36565,uploadDate:"20210114",note:"停滯期不是因為你不夠努力，而是你沒有設定正確的里程碑。艾爾文拆解三種讓人停滯的風險——舒適圈依賴、目標模糊、和完美主義——並提供具體的破解方法。把年度目標拆成可「解鎖」的成就，停滯感自然消退。"},selfCheck:"你能說出今年要完成的三個具體里程碑嗎？它們是可衡量的（而非「變得更好」這種模糊目標）嗎？你上一次感覺到明顯的成長是什麼時候？如果超過六個月，你可能正處於停滯期而不自知。",mistakes:"把「忙碌」當成「進步」——每天都很累但回顧年度時說不出具體的成長和成就。另一種陷阱是設定太遠大的目標然後全部放棄，不如設定季度里程碑，每個都小到可以完成，大到值得慶祝。",skills:["設定三個本年度要「解鎖」的具體成就，每個都要可衡量、有截止日期","每月做一次 15 分鐘的進度回顧——哪些前進了、哪些卡住了、需要調整什麼","建立一個「成就日誌」，記錄每個月完成的具體成果，用來對抗停滯期的無力感"],extVideos:[{youtubeId:"8UAuh6Hx6AI",title:"如何設定且達到目標？Part 1｜找到 & 制定有效的目標！",channel:"學生Why",duration:465,views:34325,uploadDate:"20171215",note:"目標設定的基礎教學——從「找到」目標到「制定」目標的完整流程。"},{youtubeId:"Z9opVj0dra8",title:"外商都在嘗試的目標管理工具OKR＋SMART？四步驟帶你搞懂！",channel:"Hi, 迷途艾比",duration:481,views:2419,uploadDate:"20220929",note:"把外商的 OKR + SMART 目標管理工具用在個人職涯上——結構化的設定方法。"},{youtubeId:"AUgXT-SkAEo",title:"從全職媽媽到清大研究員！那些看似停滯的日子，其實都是生命最溫厚的累積！",channel:"賴芳玉聊法",duration:1825,views:2682,uploadDate:"20260722",note:"真實故事：停滯期不是浪費，而是在為下一次突破累積能量——耐心也是一種策略。"}]},{id:"u-show-progress",name:"秀進度｜累積小勝利擊退工作倦怠",tags:["動力維持","工作倦怠"],mainVideo:{youtubeId:"Tx0ZMvXp5Xg",title:"討厭工作是因為我們的生活只剩工作｜《我得了不想上班的病》｜文森說書",channel:"文森說書",duration:1147,views:200628,uploadDate:"20250401",note:"工作倦怠的根源不一定是工作太多，而是生活只剩下工作。文森說書拆解這本書的核心觀點：當你的自我價值完全綁在工作表現上，任何挫折都會變成存在危機。解方是在工作之外也「秀進度」——讓成就感來源多元化。"},selfCheck:"你最近一次在工作中感覺「有成就感」是什麼時候？如果想不起來，是因為沒有成就，還是有成就但沒有被看見（包括被自己看見）？你的生活中除了工作，還有什麼事讓你覺得自己在進步嗎？",mistakes:"把倦怠當成懶惰來處理——更努力、更拼命、更長工時。倦怠不是動力不足，而是能量耗盡。正確的做法不是「更用力推」，而是找回小勝利的節奏感：完成一個任務就標記完成，累積可見的進度條。",skills:["每天下班前寫下「今天完成了什麼」，哪怕只有一件小事，讓進度可見","把大專案拆成每週可交付的小里程碑，每完成一個就給自己一個小獎勵","在工作之外建立一個「進度來源」——學一個新技能、參加一個社群、或維護一個副專案"],extVideos:[{youtubeId:"gCY2zKLfcwU",title:"沒動力怎麼辦？第一次產生職業倦怠！3個方法重新找回工作熱情",channel:"Erin's Diary 艾琳的日常",duration:725,views:33281,uploadDate:"20200904",note:"親身經歷分享——第一次面對職業倦怠時的三個實用調適方法。"},{youtubeId:"BusmSJ-xpDw",title:"你累了嗎？！職業倦怠怎麼辦？｜身心科 Sivi 陳韋伶醫師",channel:"Sivi聊聊天",duration:631,views:11033,uploadDate:"20240501",note:"從身心科醫師的角度看倦怠——什麼時候是正常疲勞、什麼時候需要專業協助。"},{youtubeId:"PstEu5-bxdo",title:"你得了不想上班的病嗎？治癒職場倦怠的三個小方法｜下一本讀什麼?",channel:"下一本讀什麼?",duration:1263,views:21954,uploadDate:"20260131",note:"另一個說書角度拆解同一本書——三個小方法讓「不想上班」的感覺開始消退。"}]},{id:"u-guild",name:"組公會｜串連起盟友組建戰鬥單位",tags:["人際關係","團隊協作"],mainVideo:{youtubeId:"mFvLmaIxS-o",title:"在職場到底做人重要還是做事重要？菜鳥最容易踩的雷？｜葳老闆的辣雞湯",channel:"葳老闆的辣雞湯🌶️",duration:714,views:346548,uploadDate:"20210728",note:"組公會的第一步不是「找盟友」，而是搞懂「做人」在職場中真正的意義。葳老闆用直白的風格點破：做人不是拍馬屁，而是建立信任和合作的基礎。沒有這個基礎，你找到的不是盟友，只是暫時的利益交換。"},selfCheck:"你在職場中有真正的盟友嗎——不只是「關係好的同事」，而是願意在關鍵時刻為你背書、分享資源、互相支持的人？你的人際經營方式是「有需要才聯絡」還是「平時就在累積信任」？",mistakes:"把「經營人脈」當成交換名片和加好友。真正的職場盟友不是靠一次飯局建立的，而是靠長期的信任累積——在對方需要時伸出援手、分享資訊不計較回報、言行一致。只在自己有需求時才冒出來的人，不會有人想和你結盟。",skills:["盤點你目前的職場關係網——哪些人是真正的盟友、哪些只是點頭之交","每月主動幫助一個人（分享資訊、引薦、或提供建議），不求回報","找到 2-3 個和你能力互補的人，定期交流，形成一個互相支持的小型「公會」"],extVideos:[{youtubeId:"iOu5DwEQaJE",title:"如何打造一個出色的團隊｜我工作，我沒有不開心｜好葉",channel:"Better Leaf 好葉",duration:364,views:119528,uploadDate:"20200819",note:"動畫說書——從管理學角度看如何打造有凝聚力的團隊，原則同樣適用於組建盟友圈。"},{youtubeId:"v7N--IPClXY",title:"雁行理論——團隊合作的啟發",channel:"斜槓同學會",duration:132,views:172848,uploadDate:"20130203",note:"經典短片：大雁飛行的V字陣型告訴我們——團隊合作能讓每個人飛得更遠、更省力。"},{youtubeId:"YFUrUnnpjFg",title:"神隊友？豬隊友？團隊關係建立與摧毀的重要關鍵！",channel:"共享觀點",duration:1355,views:6145,uploadDate:"20210222",note:"分析團隊關係的建立和摧毀因素——了解什麼行為讓你成為神隊友，什麼行為讓人退避三舍。"}]},{id:"u-no-overthink",name:"不糾結｜化解負面情緒的萬用心態",tags:["心態管理","情緒調適"],mainVideo:{youtubeId:"vV-Q7A7_NCE",title:"EP540 學會「不糾結，往前看」的強者法則，維持情緒穩定，讓你的人生不再內耗｜大人的Small Talk",channel:"大人學",duration:1201,views:193397,uploadDate:"20250206",note:"大人學的「不糾結」法則——不是要你壓抑情緒或假裝沒事，而是建立一套快速處理負面情緒的思考框架。職涯中的挫折、不公平、和焦慮無法避免，但你可以選擇不讓它們佔據你大量的心理頻寬。"},selfCheck:"你最近一次糾結某件事糾結了多久？那件事值得佔據你那麼多的心理空間嗎？你有沒有區分過「可以改變的」和「不能改變的」——你糾結的事通常屬於哪一類？你的情緒內耗主要消耗在什麼類型的情境上——人際衝突、自我懷疑、還是對未來的不確定？",mistakes:"兩種極端：一是壓抑情緒假裝堅強（遲早爆發），二是任由情緒帶著你走（做出衝動決定）。正確的方式是「承認情緒存在→分析它在告訴你什麼→做出理性決定→放手不再反覆咀嚼」。糾結的本質是反覆咀嚼無法改變的事。",skills:["當負面情緒出現時，用「能改變→改變；不能改變→接受」的二分法快速歸類","設定一個「糾結時限」——允許自己難過或生氣 30 分鐘，時間到就切換到行動模式","建立一個情緒出口——運動、寫日記、或找信任的人傾訴，讓情緒流過而非卡住"],extVideos:[{youtubeId:"3ofegUWDi44",title:"如何在做困難決定時不糾結？► 聽聽哈佛教授怎麼說",channel:"Wisdom Bread 智慧麵包",duration:223,views:525475,uploadDate:"20241221",note:"哈佛教授 Ellen Langer 的研究——不糾結的關鍵不是做出「正確決定」，而是接受任何決定都有好結果的可能。"},{youtubeId:"9yKq-Pwxwg4",title:"五個方法讓你不再精神內耗！",channel:"松明講心理",duration:907,views:949868,uploadDate:"20240419",note:"五個具體方法幫你停止內耗迴圈——從認知行為的角度切斷反覆咀嚼的循環。"},{youtubeId:"RzheVYMsqyQ",title:"【今周刊】別逃避負面情緒，蔡康永：你應該擁抱它",channel:"今周刊",duration:227,views:566899,uploadDate:"20190402",note:"蔡康永的觀點：負面情緒不是敵人，而是在傳遞訊號——學會聆聽它而非逃避它。"}]}]}]},{id:"face-future",name:"迎未來",chapters:[{id:"ch5a",name:"認識 AI 焦慮與依賴",icon:"🤖",units:[{id:"u-ai-anxiety-source",name:"AI 焦慮的真正來源，其實不是 AI 本身！",tags:["AI 時代","注意時效"],mainVideo:{youtubeId:"ZtQygM7XE5Q",title:"AI正在終結內卷？該如何規避AI時代下的職涯風險？ft. 哈佛商學院 Christina Wallace教授",channel:"Thought Lab with Guowei",duration:2417,views:51820,uploadDate:"20260711",note:"哈佛商學院教授 Christina Wallace 的觀點：AI 焦慮的真正來源不是「AI 會取代我」，而是我們長期以來把自我價值綁定在單一工作角色上。當這個角色被威脅，焦慮的其實是身份認同而非生計。這個視角會改變你面對 AI 的整個策略。"},selfCheck:"當你聽到「AI 會取代工作」時，你的第一反應是什麼——恐懼、否認、還是好奇？你的焦慮是具體的（擔心某個特定技能被取代）還是模糊的（一種對未來的不安）？如果 AI 真的取代了你目前的工作內容，你的自我價值會因此崩塌嗎？",mistakes:"把 AI 焦慮等同於「要趕快學 AI 工具」。工具可以學，但如果你的焦慮來源是身份認同和自我價值的脆弱性，學再多工具也無法消除那份不安。先搞清楚你焦慮的是「失去工具」還是「失去定位」。",skills:["寫下你對 AI 的具體擔憂，區分「真實威脅」和「想像中的恐懼」","檢視你的自我價值是否過度綁定在單一工作角色上——你是否能用三個不同維度描述自己？","找一篇你所在產業的 AI 影響分析報告，用數據取代想像來評估風險"],extVideos:[{youtubeId:"J1P_RIeYPVY",title:"3億工作即將消失？AI 熱潮半年，你的工作真的有改變嗎？｜志祺七七",channel:"志祺七七",duration:716,views:116939,uploadDate:"20230627",note:"AI 取代工作的數據盤點——區分「媒體炒作」和「實際影響」，幫你冷靜評估。"},{youtubeId:"mxdj7pAD2G8",title:"AI 不是來搶你飯碗的：7 個思維，把焦慮變成職涯槓桿!",channel:"辣個分析師-黎志建(Vic)",duration:761,views:4578,uploadDate:"20260130",note:"七個具體思維轉換——把 AI 焦慮重新框架為職涯升級的槓桿，而非威脅。"},{youtubeId:"blMitQkwMDs",title:"EP599 AI來了！文組生也能鹹魚翻身？｜104職涯診所",channel:"104人力銀行",duration:1742,views:21116,uploadDate:"20260415",note:"文組視角的 AI 應對策略——AI 不只影響理工科，但文組反而可能有獨特的機會。"}]},{id:"u-seven-dependencies",name:"這 7 種依賴在 AI 時代最容易讓你的職涯崩潰",tags:["AI 時代","注意時效"],mainVideo:{youtubeId:"c8fMWoofJG0",title:"這10種工作人工智慧永遠無法取代，未來世界上最穩定最安全的工作【科技啟示錄】",channel:"科技啟示錄",duration:610,views:300872,uploadDate:"20231017",note:"從「什麼不會被取代」的角度理解「什麼依賴最危險」——如果你的工作核心是 AI 擅長的（重複、規律、純資訊處理），依賴度就高；如果核心是 AI 不擅長的（同理心、創意判斷、身體技能），你的位置就相對安全。"},selfCheck:"你目前工作中有多少比例是「可以被 AI 自動化」的？你的核心價值是在執行層面（做事）還是判斷層面（決定做什麼、為什麼做）？如果 AI 接管了你工作中的例行部分，剩下的部分你能獨立完成嗎？",mistakes:"只關注「AI 會不會取代我的職位」而忽略更深層的依賴——依賴單一技能、依賴單一公司、依賴固定流程、依賴資訊不對稱的優勢。職位可能還在，但如果你的工作方式高度依賴 AI 可以做的事，你的議價能力會大幅下降。",skills:["列出你工作中的所有主要任務，標記哪些 AI 現在就能做、哪些近期可能被自動化","找出你的「不可取代核心」——那些需要人類判斷、同理心、創造力的部分","開始把更多時間和精力投入到「不可取代核心」的強化上"],extVideos:[{youtubeId:"kusFnmym1So",title:"【緊急】2025年AI需知 DeepSeek！95%人會失業，我們怎麼辦？",channel:"Chief PaPa 張志雲",duration:1003,views:227740,uploadDate:"20250109",note:"危機意識警鐘——用比較激烈的視角呈現 AI 的衝擊，適合和上一支「不會被取代」的影片形成正反對照。",tip:"注意區分影片中的事實陳述和誇大推測，培養對 AI 新聞的判讀能力"},{youtubeId:"kOuehn3zyMg",title:"藍領大翻身！微軟揭「最難被AI取代10大工作」",channel:"台視新聞 TTV NEWS",duration:119,views:86109,uploadDate:"20250802",note:"微軟的數據：最難被取代的工作反而是藍領——打破「白領更安全」的迷思。"},{youtubeId:"-fcerJgZGdo",title:"白領危機！30%工作被取代，薪資慘遭藍領反超？｜TVBS",channel:"TVBS Money",duration:2927,views:5770,uploadDate:"20260801",note:"深度報導白領面臨的 AI 衝擊——如果你是辦公室工作者，這支值得認真看完。"}]},{id:"u-find-dependencies",name:"找出你身上有哪些依賴？",tags:["自我檢視","實作工具"],mainVideo:{youtubeId:"Yolkz9rkwDE",title:"生涯規畫，自我盤點｜善用心智圖，活出更好版本的自己｜曾荃鈺｜人文講堂",channel:"大愛人文講堂",duration:1440,views:20960,uploadDate:"20240907",note:"用心智圖做自我盤點的完整方法——把你的技能、經驗、人脈、和資源全部攤開來看。當你清楚看到自己的全貌，也就能辨識出哪些部分過度依賴特定的技能、公司、或工作方式，為下一步的「擺脫依賴」做準備。"},selfCheck:"如果你用心智圖畫出自己的所有能力和資源，哪些分支特別粗大（過度依賴）、哪些幾乎沒有（潛在風險）？你的收入來源有多少比例綁在單一雇主上？你的專業能力有多少是只在目前這間公司才用得到的？",mistakes:"做自我檢視時只看優點——「我的簡報能力很強、團隊管理很好」。盤點的重點不是列優點清單，而是找出結構性的脆弱點：你的能力有沒有集中在一個即將被 AI 改變的領域？你的人脈有沒有集中在一個即將縮編的產業？",skills:["用心智圖畫出你的能力地圖，標記「強依賴」（只有一個來源）的部分","做一次「如果⋯會怎樣」的壓力測試：如果公司裁員？如果產業萎縮？如果核心技能被 AI 取代？","針對每個「強依賴」的部分，想出至少一個備案或替代方案"],extVideos:[{youtubeId:"7F9CV-6sSgM",title:"【職涯諮詢】能力不再模糊：職能盤點卡幫你精準定位強弱項",channel:"新北市政府青年局",duration:483,views:1402,uploadDate:"20251210",note:"職能盤點卡工具——把模糊的「我擅長什麼」變成具體的能力清單和強弱項分析。"},{youtubeId:"d_jAgpLuyXs",title:"你，就是一家公司！像CEO一樣思考你的人生策略！",channel:"每天10分鐘 帶你人生思維都升級",duration:431,views:962,uploadDate:"20251103",note:"把自己當一家公司來經營——用商業思維檢視你的「個人企業」有沒有過度依賴。"},{youtubeId:"itOetlDA5_8",title:"五步驟重建思維模式，學會改變才能扭轉人生｜成長型思維｜心態致勝",channel:"清流君",duration:830,views:22921,uploadDate:"20200909",note:"成長型思維是擺脫依賴的心理基礎——相信能力可以發展，才有動力去改變現狀。"}]}]},{id:"ch5b",name:"擺脫依賴與重建優勢",icon:"💪",units:[{id:"u-ai-break-free-1",name:"你該怎麼藉由 AI 來擺脫依賴（上）",tags:["AI 工具","注意時效"]
