<script>window.COURSE_DATA={title:"戀愛賽局論",storageKey:"love-game-theory",subtitle:"用理性經營感情關係——看懂戀愛中的賽局，找出阻力最小的雙贏策略",stance:[{title:"立場一：戀愛不需要理性，但經營關係需要",body:"心動是直覺，但關係能否走得長遠，取決於你是否看懂了這場「局」。這門課不教你操控對方，而是幫你從賽局的角度理解雙方需求，找到讓彼此都能從中得到快樂的策略。"},{title:"立場二：教判讀框架，不教操控技巧",body:"我們教的是「理解對方在想什麼」的分析方法，以及「讓雙方都能接受」的溝通策略。任何把對方當棋子的做法，短期或許有效，長期必定崩盤——這正是賽局理論告訴我們的事。"},{title:"立場三：本站為策展整理，非專業諮商建議（免責聲明）",body:"本站為 YouTube 教學資源的策展與學習路徑整理，僅供教育與自我學習用途。內容不構成心理諮商或專業醫療建議，遇到嚴重的關係困擾請尋求專業心理師協助。所有影片版權屬原頻道所有。"}],parts:[{id:"opening",name:"開場篇",chapters:[{id:"ch1",name:"為何戀愛需要策略",icon:"🎬",units:[{id:"u-love-fail-reasons",name:"會導致戀愛失敗的三大原因",tags:["觀念主題"],mainVideo:{youtubeId:"0W4TT6g8cyo",title:"為什麼愛情長跑會失敗｜一起戀愛吧｜卓苡瑄",channel:"卓苡瑄Jessie",duration:431,views:6046,uploadDate:"20201022",note:"七分鐘把愛情長跑失敗的核心原因講清楚——不是不夠愛，而是不懂經營。作為整門課的第一支影片，先建立「戀愛也需要方法」的認知，後面的賽局思維才有著力點。"},selfCheck:"看完後你能回答：愛情長跑失敗最常見的原因是什麼——是感覺消退，還是經營方式出了問題？你目前或過去的感情中，是否有影片提到的某個失敗模式？如果重新來過，你會在哪個環節做出不同選擇？",mistakes:"把「感覺沒了」當成分手的唯一原因。多數人在感情降溫時選擇被動等待或直接放棄，而不是去理解降溫背後的結構性問題。感覺是結果，不是原因——找到原因才能改變結果。",skills:["能列出至少三個導致感情失敗的結構性原因","在關係出現問題時，先分析原因再做反應","區分「感覺消退」和「經營方式出錯」的差異"],extVideos:[{youtubeId:"khQs9J0ZPHE",title:"感情別這樣做小心她對你沒感覺｜貝克書",channel:"貝克書",duration:703,views:25091,uploadDate:"20210909",note:"從男性視角補充：哪些具體行為會讓對方失去感覺，實例拆解很實用。"},{youtubeId:"4lprt1sSRCw",title:"5個重新檢視這段感情關係的時機⎥Blaire暖昕相談室",channel:"Blaire Chen",duration:1089,views:264713,uploadDate:"20231019",note:"從「該不該離開」的角度反向審視關係問題，幫助你判斷問題是否可修復。",tip:"注意五個時機中哪些是「對方的問題」、哪些是「互動模式的問題」"},{youtubeId:"IvyOChKykoE",title:"追求失敗繼續當朋友會怎樣｜貝克書",channel:"貝克書",duration:232,views:45240,uploadDate:"20201109",note:"四分鐘短片，討論追求失敗後的關係定位——是常見的戀愛失敗場景之一。"}]},{id:"u-love-five-problems",name:"感情的五大難題",tags:["觀念主題"],mainVideo:{youtubeId:"LxK6_ywi8ZM",title:"【兩性】5個傻眼的戀愛問題！妳中了幾個？｜阿畫",channel:"阿畫",duration:267,views:27048,uploadDate:"20200502",note:"用輕鬆的方式帶出感情中常見的「傻眼問題」——這些看似小事的困擾，其實是多數情侶反覆踩到的坑。四分鐘快速建立問題意識，為後面的系統分析做鋪墊。"},selfCheck:"你能列出感情中最常見的幾個難題嗎？這些問題是「溝通問題」還是「需求不匹配」？你是否曾經因為不知道怎麼處理這些問題而選擇逃避？逃避之後問題是消失了還是惡化了？",mistakes:"以為感情問題會自然解決。「再等等看」「時間會沖淡一切」是最常見的自我欺騙。問題不處理只會累積，等到爆發時往往已經來不及修復。",skills:["能辨識出自己感情中正在面對的是哪一類問題","用「這是溝通問題還是需求問題」來分類困擾","在問題剛出現時就開始思考對策，而非等到惡化"],extVideos:[{youtubeId:"73pJFw6bkuw",title:"墜入愛河需要多久？心理學家：問他這36道問題！【戀愛心理學】",channel:"維思維WeisWay",duration:764,views:359246,uploadDate:"20240727",note:"從心理學角度補充：愛情的產生有其科學基礎，理解它有助於你判斷感情狀態。",tip:"36道問題不只是實驗——試著跟伴侶或朋友實際做一次，觀察對話深度的變化"},{youtubeId:"Y0voBcuxLkI",title:"尋找天作之合？別傻了！2步驟找出雙方的感情期待",channel:"Kitty老師小教室",duration:558,views:3789,uploadDate:"20220218",note:"實用的兩步驟框架，幫你找出雙方的感情期待差異——這正是五大難題的根源。"},{youtubeId:"ocnPfIut00c",title:"婚姻溝通的5個要點，不會用，很慘烈！",channel:"Kitty老師小教室",duration:653,views:3493,uploadDate:"20220826",note:"從婚姻場景切入溝通難題，五個要點同樣適用於交往中的感情經營。"}]}]}]},{id:"perspective",name:"改變視點篇",chapters:[{id:"ch2",name:"人際關係的新視點",icon:"🔄",units:[{id:"u-case-marriage",name:"案例：結婚還是不結婚",tags:["案例分析"],mainVideo:{youtubeId:"1_sSSJ6Unec",title:"婚姻有什麼意義？結婚到底是好還是不好？",channel:"松明講心理",duration:1029,views:990424,uploadDate:"20240426",note:"百萬觀看的深度分析——從心理學角度拆解「結婚與否」這個經典難題。作為第一個案例，它示範了如何用理性框架思考看似只有感性答案的問題，這正是本課程的核心方法。"},selfCheck:"你能說出「結婚」與「不結婚」各自的核心價值與代價嗎？婚姻對你而言是「社會期待」還是「個人選擇」？如果拿掉外界壓力，你真正想要的關係形式是什麼？你的答案和伴侶一致嗎？",mistakes:"把結婚當成感情的「畢業典禮」。結婚不是終點，而是另一段關係的起點。很多人花大量精力追求「結婚」這個目標，卻沒有認真思考婚後的經營——這和考上大學就開始混日子是一樣的邏輯陷阱。",skills:["能客觀列出結婚與不結婚的各項利弊，而非只看社會觀感","用「這對雙方各自意味著什麼」來分析重大關係決策","在做人生選擇前，先釐清自己的核心需求，而非隨波逐流"],extVideos:[{youtubeId:"-0JA_qyDKDI",title:"沒結婚到底會怎樣？老了一個人怎麼辦？",channel:"葳老闆的辣雞湯🌶️",duration:719,views:900071,uploadDate:"20230621",note:"從「不結婚的恐懼」切入，直面孤獨終老的擔憂，90萬人看過的實話。"},{youtubeId:"wkhgswSTiIc",title:"現代人到底為什麼要結婚？婚姻的意義是什麼？",channel:"BBK Network",duration:2171,views:477759,uploadDate:"20230625",note:"從現代社會結構分析婚姻意義的變遷——傳統理由已經不成立，新理由是什麼？",tip:"注意嘉賓對「經濟合夥」和「情感連結」兩種婚姻觀的辯論"},{youtubeId:"1a7kX7TSQCE",title:"單身好還是結婚好？不要為了滿足社會期待而結婚",channel:"共享觀點",duration:627,views:13791,uploadDate:"20250721",note:"書評角度：拆解「獨居不好」和「單身不好」的區別，觀點清晰。"}]},{id:"u-new-perspective",name:"人際關係的新視點",tags:["觀念主題","賽局理論"],mainVideo:{youtubeId:"LyZCxoLF9lo",title:"7分鐘破解人性!? 賽局理論如何讓妳感情變幸福？",channel:"Introduction",duration:616,views:25013,uploadDate:"20210207",note:"蕾咪用七分鐘把賽局理論和感情幸福的關係講清楚——這是本課程的理論基石。理解「雙方都在做策略選擇」這個前提，你看感情的視角就會徹底改變。"},selfCheck:"你能用一句話解釋賽局理論的核心概念嗎？在你的感情中，你和對方各自的「策略」是什麼？你們的互動模式比較像「合作賽局」還是「零和賽局」？為什麼這個區分很重要？",mistakes:"把感情當成「只要真心就夠了」的單人遊戲。感情是雙人互動，你的每個行為都會影響對方的反應，對方的反應又會影響你的下一步。不理解這個動態，就會反覆困惑「為什麼我付出這麼多，對方卻沒有反應」。",skills:["能用「雙方都在做選擇」的視角來分析感情互動","區分合作型互動和對抗型互動，並調整自己的策略","在關係中遇到僵局時，先想「對方的立場是什麼」再做反應"],extVideos:[{youtubeId:"kBYH-g4Sc48",title:"商學院一定要懂的賽局理論！",channel:"吳淡如人生實用商學院（Official官方唯一頻道）",duration:1128,views:11257,uploadDate:"20220830",note:"吳淡如從商業角度講賽局，很多概念可以直接套用到感情分析。"},{youtubeId:"yh4uKLhmvXU",title:"博弈論之囚徒困境：明明合作彼此都有利，人們為何很難合作",channel:"天天讀書會 DailyReading",duration:962,views:26836,uploadDate:"20220311",note:"囚徒困境是理解感情衝突的關鍵模型——為什麼明明可以雙贏，卻走向雙輸？",tip:"看完後想想：你的感情中有沒有「囚徒困境」的場景？"},{youtubeId:"BgSjQBWoRok",title:"《博弈論與生活》教你培養成功的博弈心態",channel:"Reading for Riches",duration:3631,views:11711,uploadDate:"20240122",note:"一小時的書籍深度解讀，涵蓋博弈在商業、政治、婚姻中的應用。",tip:"可以先看婚姻和人際關係相關的段落，其他部分選看"}]},{id:"u-what-is-game",name:"局是甚麼？",tags:["觀念主題","賽局理論"],mainVideo:{youtubeId:"U8ZIlfTVPwA",title:"賽局理論生活應用：理科太太完敗大力",channel:"理科太太 Li Ke Tai Tai",duration:470,views:1052503,uploadDate:"20180913",note:"理科太太用一場趣味對決來示範賽局理論的生活應用——百萬觀看，八分鐘就能直覺理解「局」是什麼。搞懂這個概念，你就能開始分析感情中每次互動背後的策略邏輯。"},selfCheck:"你能解釋什麼是「局」嗎？一場「局」需要哪些基本元素（玩家、策略、報酬）？在你的日常生活中，能舉出一個符合「局」的場景嗎？這個場景中，你和對方的最佳策略分別是什麼？",mistakes:"以為「看懂局」就是要算計對方。賽局理論的核心不是算計，而是理解：在這個情境下，雙方各自的最佳選擇是什麼，以及這些選擇組合在一起會產生什麼結果。理解了這一點，你才能找到讓結果變好的方式。",skills:["能辨識日常互動中的「賽局結構」：誰是玩家、各自有什麼選擇","用「如果我這樣做，對方最可能怎麼反應」來預判互動結果","在做決定前，先畫出雙方的選擇與可能結果的簡單矩陣"],extVideos:[{youtubeId:"IpBHueXzUqc",title:"賽局理論｜用「囚徒困境」看中美關稅大戰",channel:"賴春輯Neo Sharing",duration:403,views:31641,uploadDate:"20201001",note:"用國際政治案例示範賽局分析，七分鐘看完會對「局」有更具體的感覺。"},{youtubeId:"SVXFPphbE2c",title:"一場你無法逃脫的無限賽局",channel:"艾倫悅讀空間",duration:891,views:47470,uploadDate:"20210430",note:"「有限賽局」和「無限賽局」的區分——感情正是一場無限賽局，目標不是贏，是繼續。",tip:"感情是無限賽局：重點不是這一次吵架誰贏了，而是關係能不能繼續走下去"},{youtubeId:"h6xGfN6wvV4",title:"賽局理論基礎：Nash Equilibrium",channel:"星經濟STARECON",duration:804,views:27458,uploadDate:"20200810",note:"納許均衡的基礎教學——理解「雙方都不想改變」的穩定狀態，這在感情分析中很關鍵。"}]}]},{id:"ch3",name:"賽局工具與思考",icon:"🧩",units:[{id:"u-four-tools",name:"讓你秒懂人際賽局的4種客觀工具",tags:["賽局理論","實戰技巧"],mainVideo:{youtubeId:"2JZwEmad6Ws",title:"《心理學不玄》囚徒困境——明明合作彼此都有利，人們為何很難合作",channel:"JT才知道",duration:387,views:4949,uploadDate:"20230617",note:"六分鐘把囚徒困境這個最重要的賽局工具講透——為什麼情侶明明相愛，卻常常做出傷害彼此的選擇？因為你們可能正卡在囚徒困境裡。理解這個模型，就掌握了分析感情衝突的第一個工具。"},selfCheck:"你能解釋囚徒困境嗎？在感情中，什麼情境像囚徒困境（雙方都想合作，卻因為不信任而選擇自保）？除了囚徒困境，你還知道哪些賽局模型？在你的感情經驗中，是否有過「明明合作就好了，卻搞到雙輸」的經歷？",mistakes:"知道了賽局工具卻只用來分析別人。這些工具最大的價值是讓你看清自己的行為模式——你是不是也在某些時候因為恐懼或不信任，做出了「自保但傷害關係」的選擇？",skills:["能用囚徒困境模型分析至少一個感情衝突場景","辨識出「雙方都在自保」導致的惡性循環","嘗試先釋出合作信號，打破僵局"],extVideos:[{youtubeId:"LelQRt9d5Bg",title:"淺淺談｜賽局理論之囚犯困境",channel:"高維奇 | A-kî sai",duration:952,views:7241,uploadDate:"20230809",note:"用台語風格講囚犯困境，輕鬆有趣的另一種理解角度。"},{youtubeId:"zzGFJTmqBWg",title:"統計學、賽局理論和政治學：這三者有什麼關係？",channel:"中央研究院Academia Sinica",duration:7363,views:369642,uploadDate:"20170516",note:"中研院的完整賽局理論講座，學術級深度——想要系統性理解賽局理論的人必看。",tip:"全片兩小時，建議先看前30分鐘的基本概念介紹"},{youtubeId:"VwL35zT_bMw",title:"人生如果是一場遊戲，從經濟學賽局理論中學習最佳策略",channel:"擺渡人偉恩Wayne",duration:499,views:224,uploadDate:"20230429",note:"從「人生是遊戲」的視角出發，八分鐘連結賽局理論與實際生活選擇。"}]},{id:"u-conflict-thinking",name:"人際衝突的思考流程",tags:["溝通技巧","實戰技巧"],mainVideo:{youtubeId:"FrgO69iCfec",title:"一個神奇公式，搞定所有人際衝突！——自我肯定式表達法",channel:"蘇予昕諮商心理師",duration:711,views:52554,uploadDate:"20200610",note:"心理師教你一個萬用公式處理人際衝突——「我看到...我感覺...我希望...」。這個公式把賽局理論的「表達自己需求，同時考慮對方反應」具體化成可操作的步驟。掌握這個，後面的案例分析會輕鬆很多。"},selfCheck:"你能說出「自我肯定式表達法」的步驟嗎？這個方法和「忍耐不說」或「直接爆發」比，優勢在哪裡？你上一次和伴侶或朋友發生衝突時，用的是什麼溝通方式？如果改用這個公式，結果會不同嗎？",mistakes:"衝突來了不是忍就是爆。忍的人累積委屈到最後大爆炸；爆的人每次都在修補關係。兩種都沒有真正解決問題。問題的關鍵不是「要不要表達」，而是「怎麼表達才能讓對方聽進去」。",skills:["能用「我訊息」（I-message）表達需求，而非用「你訊息」指責對方","在衝突中先辨識自己的情緒，再選擇表達方式","練習在安全的場景（小事）中使用自我肯定式表達，建立肌肉記憶"],extVideos:[{youtubeId:"20owPza6O0w",title:"溝通心理學：從衝突到走進他人內心的7項修煉",channel:"天天讀書會 DailyReading",duration:1318,views:71724,uploadDate:"20250419",note:"書籍解讀，把溝通心理學整理成七個具體修煉方向，體系完整。",tip:"特別注意「共情」那一章——這是賽局中「理解對方立場」的具體操作"},{youtubeId:"7pFTD8o1PgA",title:"人際衝突因應之道（上集）",channel:"輔仁大學學生輔導中心",duration:888,views:2418,uploadDate:"20230921",note:"蘇予昕心理師的延伸課程，從學術角度補充衝突處理的理論基礎。"},{youtubeId:"tmbHqYOJgI4",title:"善意溝通卡化解衝突示範（一）",channel:"ACCR, Compassionate Communication",duration:693,views:1446,uploadDate:"20190827",note:"用卡牌工具實際演練衝突化解，看完你會知道理論落地長什麼樣子。"}]}]}]},{id:"understand",name:"理解他者篇",chapters:[{id:"ch4",name:"體察別人的需求",icon:"👁️",units:[{id:"u-case-moody-girl",name:"案例：心情不好才來找你的學妹",tags:["案例分析","自我提升"],mainVideo:{youtubeId:"4RLnG2DsuIs",title:"女生把你當工具人的三個起手式｜貝克書",channel:"貝克書",duration:529,views:24284,uploadDate:"20210113",note:"九分鐘拆解工具人陷阱的三個起手式——這個案例的核心問題不是「她壞」，而是你沒有在互動中正確判讀對方的需求。學會辨識這些信號，才能決定要不要繼續投入。"},selfCheck:"你能辨識出「被當工具人」的三個典型信號嗎？當對方只在需要幫助時找你，你的第一反應是什麼——是「她需要我」還是「她只是在利用我」？你有沒有明確的判斷標準來區分這兩者？",mistakes:"把「對方來找我」等於「對方喜歡我」。情緒價值和戀愛價值是兩回事。有些人找你是因為你好用、好說話，不是因為對你有感覺。分不清這個差別，就會反覆在「付出-失望」的循環中打轉。",skills:["觀察對方找你的時機和頻率，判斷是「需求驅動」還是「情感驅動」","設定適當的界線，不因為想被喜歡就無條件配合","在發現被當工具人時，能直接確認關係定位而非繼續猜測"],extVideos:[{youtubeId:"mqk3A5vqfCw",title:"一起來審慎你的感情是否健康",channel:"Blaire Chen",duration:812,views:195741,uploadDate:"20210718",note:"從「健康關係」的標準來檢視，幫你建立判斷工具人關係的整體框架。"},{youtubeId:"Zr2P7uC91I0",title:"不想再當工具人？首先別以為付出就絕對有回報！",channel:"VS MEDIA Taiwan",duration:250,views:3645,uploadDate:"20180430",note:"四分鐘短片，直接點出工具人心態的核心謬誤：付出≠回報。"},{youtubeId:"KQJcsOlOmC8",title:"別再傻傻當工具人——會被利用的面相特徵",channel:"新聞挖挖哇！",duration:230,views:6499,uploadDate:"20190927",note:"從性格特徵角度分析哪些人容易被當工具人，輕鬆娛樂的補充視角。"}]},{id:"u-read-others",name:"如何從互動去體察別人要甚麼",tags:["溝通技巧","心理學"],mainVideo:{youtubeId:"7p-iA8Bcuio",title:"五個必學的高情商溝通技巧！",channel:"松明講心理",duration:914,views:953038,uploadDate:"20240924",note:"近百萬觀看的高情商溝通教學——五個技巧都圍繞同一個核心：先理解對方要什麼，再決定怎麼回應。這就是賽局理論中「判讀對手策略」的實際操作。"},selfCheck:"你能列出五個高情商溝通技巧嗎？在你的日常互動中，你通常是先「表達自己」還是先「理解對方」？你有沒有過「以為對方需要建議，其實只需要傾聽」的經驗？這五個技巧中，哪一個對你來說最難做到？",mistakes:"急著給建議、急著解決問題。大部分時候，對方找你說話不是要解決方案，而是要被理解。尤其是在親密關係中，「你應該怎樣怎樣」只會讓對方覺得你沒在聽——你在解題，不是在陪伴。",skills:["在對方說話時，先用「你的意思是...」確認理解，再給回應","區分對方需要的是「情緒支持」還是「問題解決」","觀察對方的非語言信號（語氣、表情、姿態）來補充語言資訊"],extVideos:[{youtubeId:"VMV7Zh630jc",title:"《讀心術》全書解讀：如何一眼就能看透他人的心思",channel:"名书解读|阿素读书",duration:4162,views:117045,uploadDate:"20230625",note:"一小時的識人術深度解讀，教你從行為細節推斷對方的真實想法。",tip:"不需要一次看完，可以先看「微表情判讀」和「說話模式分析」兩個段落"},{youtubeId:"2sCWA8aQvmE",title:"EP30 夫妻相處之道——避開4種溝通模式＋2種正向表達方法",channel:"人生解扣方程式",duration:1845,views:162284,uploadDate:"20250711",note:"心理學家 John Gottman 的「末日四騎士」溝通模型，辨識哪些溝通方式正在毀掉關係。"},{youtubeId:"Pbofx1XnFQA",title:"與另一半溝通心好累？男女如何有效對話？",channel:"親子天下",duration:697,views:2872,uploadDate:"20240716",note:"從男女溝通差異切入，實用的日常對話技巧分享。"}]},{id:"u-perceived-value",name:"知覺價值：分析自己在別人眼中的形象",tags:["自我提升","心理學"],mainVideo:{youtubeId:"eyPTmnjoohQ",title:"【兩性】如何提升價值讓人喜歡妳？吸引力的關鍵是？｜阿畫",channel:"阿畫",duration:532,views:131629,uploadDate:"20200805",note:"阿畫用九分鐘解析「吸引力的關鍵」——不是外貌，而是你展現出的整體價值。在賽局中，你的「知覺價值」決定了對方願意投入多少。理解這個概念，你就能有策略地展現自己。"},selfCheck:"你知道「知覺價值」和「實際價值」的差別嗎？在別人眼中，你最被認可的特質是什麼？你有沒有過「明明很優秀，對方卻不感興趣」的經驗？問題可能出在哪裡——是價值不夠，還是價值沒有被看見？",mistakes:"只顧提升自己卻不懂展現。很多人拼命健身、學才藝、賺錢，以為「變優秀就會被喜歡」。但知覺價值是對方「感受到的」價值，不是你「擁有的」價值。不懂得在互動中自然展現，再多努力也會被忽略。",skills:["列出自己的核心優勢，並想出在互動中自然展現它們的方式","觀察對方最在意什麼特質，針對性地展現相應的價值","定期從信任的朋友那裡獲取回饋，校準自我認知與他人認知的差距"],extVideos:[{youtubeId:"4howVtrbzG4",title:"五種讓你更有魅力、吸引力的心法",channel:"人生啊 - 陪你一起看懂人生",duration:2825,views:101201,uploadDate:"20250611",note:"從書本《活學》提煉的五個魅力心法，不是技巧而是內在狀態的調整。",tip:"注意「不需要證明自己」這個心法——越想展現價值反而越顯得不自信"},{youtubeId:"6dFYJJDgAUs",title:"男人最愛的5個特質：培養這些習慣，效果驚人",channel:"真命天女方法 - 妳的戀愛老師Max",duration:779,views:166353,uploadDate:"20240928",note:"從男性視角列出最被看重的五個特質——了解對方的需求清單，精準提升知覺價值。"},{youtubeId:"pIPYFJuBqhc",title:"男人想要的，無非是女人給的這一樣東西",channel:"Lovery三重愛",duration:1237,views:7150,uploadDate:"20251028",note:"深入分析男性在關係中最核心的需求——被理解和被肯定，而非物質條件。"}]},{id:"u-am-i-tool",name:"我是工具人嗎？怎麼知道別人是否喜歡我",tags:["實戰技巧","案例分析"],mainVideo:{youtubeId:"b1zjIYOsTnk",title:"如果男生對你這樣做，100%代表他根本不喜歡你！【77老大】",channel:"77老大",duration:575,views:2200899,uploadDate:"20210304",note:"220萬觀看的經典判斷教學——用具體行為來判斷對方是否喜歡你。在賽局中，「對方的真實意圖」是你做策略選擇的關鍵資訊，而行為比言語更誠實。"},selfCheck:"你能列出至少三個「對方不喜歡你」的行為信號嗎？你平常是根據對方的「言語」還是「行為」來判斷好感度？如果兩者矛盾（嘴上說在乎，行為卻很冷淡），你會相信哪個？為什麼？",mistakes:"只聽對方說什麼，不看對方做什麼。「嘴上說喜歡你但從不主動找你」和「不太會說話但總在你需要時出現」，哪個才是真正的喜歡？太多人被甜言蜜語迷惑，忽略了行為才是最可靠的判斷依據。",skills:["建立「行為優先於言語」的判斷習慣","能列出至少五個判斷對方好感度的具體行為指標","在曖昧期主動創造「測試場景」來驗證假設，而非被動等待"],extVideos:[{youtubeId:"kHmBWE3Vxw4",title:"為什麼無法讓我喜歡的人也喜歡我？",channel:"阿畫",duration:346,views:118498,uploadDate:"20200304",note:"從心理學角度分析「單方面喜歡」的機制——不是你不夠好，是吸引力有其規律。"},{youtubeId:"p0bt-lxQanY",title:"3個你以為男生不喜歡，實際是喜歡你的表現",channel:"路远情长LY",duration:313,views:179527,uploadDate:"20230228",note:"反向補充：有些看似冷淡的行為其實是喜歡的表現，避免誤判。"},{youtubeId:"qO-g60zdu8A",title:"他不喜歡我！為什麼又對我好？",channel:"阿畫",duration:636,views:41390,uploadDate:"20230114",note:"處理最糾結的灰色地帶：對方的行為忽冷忽熱時，該怎麼判斷真實意圖。"}]}]},{id:"ch5",name:"接近階段的策略",icon:"🌡️",units:[{id:"u-case-painful-relation",name:"案例：痛苦又不快樂卻還在持續的關係",tags:["案例分析","心理學"],mainVideo:{youtubeId:"nUmEIOPpZSE",title:"EP50 明明很痛苦為何離不開？4個「分不了手」的心理陷阱",channel:"人生解扣方程式",duration:1880,views:43167,uploadDate:"20251128",note:"半小時深度分析「為什麼痛苦卻離不開」——四個心理陷阱（沉沒成本、損失趨避、熟悉感依賴、自我價值綁定）。這是賽局理論中「非理性決策」的經典案例：你不是不想離開，是認知偏差讓你「覺得離開更可怕」。"},selfCheck:"你能列出四個「分不了手」的心理陷阱嗎？「沉沒成本」在感情中長什麼樣子？你有沒有過「知道應該離開，卻遲遲下不了決心」的經驗？如果有，是哪個心理陷阱在作用？",mistakes:"用「我已經付出這麼多」來合理化留在痛苦的關係中。沉沒成本是經濟學告訴我們最重要的教訓：已經花掉的錢拿不回來，不應該影響未來的決策。感情也是——過去的付出不代表未來會變好。",skills:["辨識自己是否正在被沉沒成本綁架：問自己「如果今天才認識，我還會選擇這段關係嗎？」","區分「對方的行為讓我痛苦」和「離開讓我恐懼」，分開處理","設定具體的底線和評估時間點，而非無限期地「再看看」"],extVideos:[{youtubeId:"Ol_sSHtJN3o",title:"我們能從分手中學到什麼？｜《關係結束後，成為更好的自己》",channel:"文森說書",duration:1e3,views:276089,uploadDate:"20231212",note:"文森說書解讀分手後的成長——離開不一定是失敗，而是另一段成長的開始。"},{youtubeId:"HXyYUxLmTZY",title:"沒有結果的感情，為什麼就是放不下？",channel:"才子情感",duration:254,views:33943,uploadDate:"20211024",note:"四分鐘快速解析兩個關鍵心理效應，讓你理解「放不下」的機制。"},{youtubeId:"H4lV5KOB0hQ",title:"離開舊愛像坐慢車，走出分手平均會花這麼久",channel:"理科太太 Li Ke Tai Tai",duration:306,views:756228,uploadDate:"20180827",note:"理科太太用數據告訴你：走出分手需要的時間比你想的長，但終究會到。"}]},{id:"u-heat-cool",name:"冷卻與加溫的關鍵概念",tags:["實戰技巧"],mainVideo:{youtubeId:"HCeiA1FaQC4",title:"戀愛必經之路——被拒絕後用這五招！讓自己不再痛苦",channel:"貝克書",duration:551,views:17708,uploadDate:"20230506",note:"被拒絕是戀愛的必經之路，關鍵是拒絕之後你怎麼做。這五招不是教你死纏爛打，而是教你如何在被拒絕後調整策略——知道何時該「冷卻」讓對方有空間，何時該「加溫」重新建立連結。"},selfCheck:"被拒絕後，你通常的反應是什麼——退縮、死纏、還是裝沒事？你知道「冷卻」和「放棄」的區別嗎？什麼情況下應該暫時退後（給對方空間），什麼情況下應該果斷放手？",mistakes:"被拒絕就覺得一切結束了。很多成功的關係都經歷過早期的拒絕——重點不是「被拒絕」這個事實，而是「為什麼被拒絕」。如果是時機不對或表達方式不對，調整後重新來過不丟人。但如果對方明確表達沒有感覺，持續追求就是騷擾。",skills:["被拒絕後先分析原因（時機、方式、還是根本沒興趣），再決定下一步","學會「策略性退後」：降低接觸頻率但保持友善存在感","設定明確的重新評估時間點，避免無限期等待"],extVideos:[{youtubeId:"NahZeynkWzg",title:"還沒交往就吃醋？原本互有好感卻搞砸了！",channel:"阿畫",duration:472,views:85049,uploadDate:"20220406",note:"曖昧期的經典錯誤：還沒確認關係就展現佔有欲，把好感搞砸了。"},{youtubeId:"kHOfe1hM8oA",title:"告白失敗如何起死回生的曖昧技巧！",channel:"約會診療室TV",duration:626,views:16647,uploadDate:"20201031",note:"告白失敗不等於永遠出局——這支影片教你如何重新建立曖昧感。",tip:"關鍵在於「自然地回到朋友狀態」而非「裝作沒告白過」"},{youtubeId:"FGvi8zp6KI0",title:"告白被拒絕後，對方開始冷淡，該怎麼處理？",channel:"曖昧小偵探",duration:197,views:983,uploadDate:"20230322",note:"三分鐘精簡分析告白後的冷淡期——是暫時的尷尬還是永久的拒絕？"}]},{id:"u-loser-signals",name:"甚麼事情會讓對方覺得你是Loser",tags:["實戰技巧","自我提升"],mainVideo:{youtubeId:"_0gSUSJS2AI",title:"真實案例！初次約會的4個錯誤示範｜卓苡瑄",channel:"卓苡瑄Jessie",duration:535,views:4560,uploadDate:"20220518",note:"用真實案例示範約會中四個讓對方扣分的錯誤——這些不是「條件不夠好」的問題，而是「行為展現」的問題。在賽局中，你的每個行為都在向對方傳遞信號，而這些負面信號會讓你的知覺價值瞬間歸零。"},selfCheck:"你能列出約會中最常見的扣分行為嗎？你有沒有做過類似的事？為什麼這些行為會讓對方瞬間失去興趣——是行為本身的問題，還是它們暴露了更深層的問題（如不尊重、不自信、不靠譜）？",mistakes:"以為「做自己」就是不需要注意形象。做自己不代表可以不修邊幅、遲到、搶著說話、或在約會時一直看手機。真正的做自己是展現真實的你，而不是展現懶惰的你。別把不禮貌和真實搞混了。",skills:["在重要互動前檢查基本禮儀清單（準時、整潔、專注）","練習「聽比說多」的對話模式，讓對方感受到被重視","觀察約會中對方的反應（表情、回話長度、身體語言），即時調整行為"],extVideos:[{youtubeId:"kA4pZofbu-w",title:"大扣分！四個男友最受不了的瞬間！",channel:"GirlStyle 女生日常",duration:185,views:2848,uploadDate:"20180906",note:"從女生視角列出男友最受不了的行為——了解對方的地雷，避免踩中。"},{youtubeId:"avBGqyLc44k",title:"戀愛中的禁忌，20件事絕對不要做！【77老大】",channel:"77老大",duration:614,views:489787,uploadDate:"20220901",note:"77老大整理的20條戀愛禁忌清單，近50萬人看過的避坑指南。",tip:"把這20條當成自我檢查清單，看你中了幾條"},{youtubeId:"JXxkdL6bUxk",title:"女生5大討好行為！男生眼中超加分！",channel:"Tagcircle 集合",duration:171,views:1215,uploadDate:"20180829",note:"反向參考：什麼行為會讓對方覺得加分？從「要做什麼」補充「不要做什麼」。"}]}]}]},{id:"predict",name:"預測訓練篇",chapters:[{id:"ch6",name:"伴侶關係的本質",icon:"🔮",units:[{id:"u-case-triangle",name:"案例：進退失據的三角關係",tags:["案例分析","心理學"],mainVideo:{youtubeId:"HUmOIlmUl0A",title:"三分鐘秒懂心理學——三角關係",channel:"MoneySan:EasyPsy 簡單心理學",duration:236,views:17190,uploadDate:"20190410",note:"三分鐘用心理學框架拆解三角關係的本質——不是「誰比較好」的問題，而是每個人在關係中扮演什麼角色、滿足什麼需求。理解了這個，你就能看懂為什麼有些人明知道不對卻走不出來。"},selfCheck:"三角關係中每個角色的心理需求分別是什麼？為什麼有些人會「同時對兩個人有感覺」——這是貪心，還是不同的需求被不同的人滿足了？如果你身處三角關係，你的「最佳策略」是什麼？",mistakes:"在三角關係中把自己定位成「受害者」。三角關係中每個人都在做選擇——包括你選擇留下來等待。如果你一直等對方「選你」，其實你已經在用被動的方式做出了選擇。看清自己的選擇權，是走出困局的第一步。",skills:["分析三角關係中每個人的核心需求，而非只看「誰對誰不好」","給自己設定明確的底線和時間表，不做無限期的等待者","用「如果這不是三角關係，我還會選這個人嗎」來校準判斷"],extVideos:[{youtubeId:"BnUWZXk_tFM",title:"EP45 關係中卡住怎麼辦？先理解「卡普曼三角」",channel:"人生解扣方程式",duration:1100,views:23877,uploadDate:"20251024",note:"「卡普曼三角」（迫害者-受害者-拯救者）是分析關係困局的強力工具。",tip:"想想你在關係中最常扮演哪個角色——這個角色是你選擇的嗎？"},{youtubeId:"SFNntocqtbk",title:"用對方法牢牢套住他！為什麼情感吸引力比外在重要太多？",channel:"Blaire Chen",duration:490,views:463891,uploadDate:"20200915",note:"46萬人看過——在三角關係中，情感吸引力才是決定勝負的關鍵。"},{youtubeId:"j8uWjGgMkb0",title:"當感情出現了第三者應該怎麼辦！",channel:"爱逢情感",duration:102,views:1127,uploadDate:"20230531",note:"兩分鐘極簡分析：第三者出現時的三個應對選項，直接有力。"}]},{id:"u-love-not-enough",name:"伴侶關係只有愛是不夠的",tags:["觀念主題","心理學"],mainVideo:{youtubeId:"bHVKaLFjUo0",title:"我們一定得談戀愛嗎？｜《親密關係》｜文森說書",channel:"文森說書",duration:920,views:956998,uploadDate:"20230103",note:"近百萬觀看的書籍解讀——從《親密關係》這本經典出發，解析伴侶關係的真正本質。愛是起點，但信任、承諾、溝通才是讓關係持續的基礎設施。沒有這些，愛會被日常磨損消耗殆盡。"},selfCheck:"除了「愛」，伴侶關係還需要哪些要素？你能列出至少三個嗎？你目前或過去的關係中，哪些要素是充足的，哪些是缺乏的？如果要排優先順序，你覺得「愛、信任、溝通、承諾」哪個最重要？",mistakes:"相信「有愛就夠了」。愛是必要條件，不是充分條件。很多相愛的人最後分開，不是因為不愛了，而是因為不會處理衝突、不願意溝通、或者生活目標越走越遠。只靠愛支撐的關係，就像只有引擎沒有輪子的車。",skills:["定期評估關係中「愛」以外的其他要素：信任度、溝通品質、目標一致性","在關係初期就開始建立溝通習慣，而非等到出問題才開始","把「經營關係」當成和「保持感情」同等重要的事來投入時間"],extVideos:[{youtubeId:"Igf9wvM-nDw",title:"EP81 你對他掏心掏肺，他卻不珍惜你？",channel:"人生解扣方程式",duration:1657,views:80973,uploadDate:"20260710",note:"伴侶關係的四大能力拆解——問題可能在一開始就註定了。"},{youtubeId:"ac6M9O4c7Tg",title:"怎麼跟逃避型伴侶相處？逃避依附者其實很敏感？",channel:"周慕姿放心說",duration:789,views:83468,uploadDate:"20240926",note:"周慕姿心理師解析逃避型依附，理解「對方不是不愛你，是不知道怎麼愛」。"},{youtubeId:"sfDkkekjDEc",title:"為何有些感情談起來就是舒服？伴侶關係的四種關鍵能力",channel:"情感小火柴",duration:557,views:44,uploadDate:"20260804",note:"四種關鍵能力的順序很重要——這支影片把「舒服的感情」拆解成可操作的能力。"}]},{id:"u-want-vs-want",name:"我要的 VS 他要的，落點在哪裡",tags:["溝通技巧","實戰技巧"],mainVideo:{youtubeId:"lAUGlg5hBD8",title:"EP36 談感情，這5點看似沒什麼，卻是慢性分手的主因",channel:"人生解扣方程式",duration:1777,views:484799,uploadDate:"20250822",note:"近50萬觀看——五個看似無害的行為，實際上正在慢慢殺死你的關係。這就是「我要的VS他要的」的落差：你以為沒什麼，對方卻覺得很嚴重。在賽局中，如果你不知道對方的「報酬函數」，你的策略永遠會失準。"},selfCheck:"你知道你的伴侶最在意的五件事是什麼嗎？你們有沒有「你覺得不重要但對方很在意」的議題？你上一次認真了解對方的需求是什麼時候？「慢性分手」的五個主因中，你中了幾個？",mistakes:"用自己的需求清單去揣測對方的需求。「我覺得重要的，對方一定也覺得重要」是感情中最常見的投射謬誤。你需要安全感，對方需要的可能是空間；你需要陪伴，對方需要的可能是被理解。需求不同不代表不合適，但不理解差異就一定會出問題。",skills:["用「你在這段關係中最需要什麼」的問題來主動了解對方的核心需求","把「我要的」和「他要的」畫成兩張清單，找出重疊區和衝突區","在衝突區上練習協商：不是一方妥協，而是找到雙方都能接受的中間方案"],extVideos:[{youtubeId:"aDFszDDp6LU",title:"溝通不再變吵架：開口前提醒自己六件事",channel:"Sherry's Notes 雪力的心理學筆記",duration:558,views:121143,uploadDate:"20230714",note:"十分鐘掌握「溝通不變吵架」的六個原則——討論需求差異時的必備技巧。"},{youtubeId:"TrralL4ekN4",title:"伴侶相處之道：愛的五種語言×相處的黃金比例",channel:"Sherry's Notes 雪力的心理學筆記",duration:497,views:269576,uploadDate:"20210813",note:"「愛的五種語言」框架幫你理解需求差異的根源——你用的是對方聽得懂的語言嗎？",tip:"做一次愛的語言測驗，比較你和伴侶的前三名——差異就是溝通的重點"},{youtubeId:"kzWpn1ff6r8",title:"親密關係溝通技巧｜伴侶關係修復練習",channel:"大愛人文講堂",duration:1440,views:21897,uploadDate:"20260314",note:"心理師曾心怡的完整講座——從理論到實練的伴侶關係修復方法。"}]}]},{id:"ch7",name:"機率與量測",icon:"📊",units:[{id:"u-probability",name:"我想要的選擇，能從中獲得機率多高",tags:["觀念主題","賽局理論"],mainVideo:{youtubeId:"RI5-kNYnccY",title:"EP390 如何建構全局視野？一套對人生越有幫助的訓練方法｜大人學",channel:"大人學",duration:1640,views:49336,uploadDate:"20230831",note:"大人學的全局視野訓練——在感情中，你做的每個選擇都有機會成本。這支影片教你如何跳出當下的情緒，用更寬廣的視角評估「這個選擇對我長期最好嗎」。掌握全局視野，你才能做出不後悔的決定。"},selfCheck:"你在做感情決策時，是根據「當下的感覺」還是「長期的利弊」？你能列出你目前關係選擇的機會成本嗎（選了A就放棄了B）？你有沒有因為只看眼前而錯過更好選擇的經驗？",mistakes:"只用「喜不喜歡」來做所有決定。喜歡是必要條件，但不是唯一條件。長期關係還需要考慮生活節奏是否配合、價值觀是否相近、人生目標是否可以共存。不做這些評估就投入，就像不看財報就買股票。",skills:["在做重大感情決策前，列出至少三個評估維度（不只是「喜歡」）","練習「如果五年後回頭看這個選擇」的長期思維","接受「沒有完美選擇」的事實，選了就專注經營"],extVideos:[{youtubeId:"t-vmEt0gqcg",title:"你為什麼又答應了根本不想做的事",channel:"理科 Plus",duration:414,views:193535,uploadDate:"20201103",note:"19萬觀看——「拒絕的科學」教你為什麼總是答應不想做的事，這在感情中同樣適用。"},{youtubeId:"E4M4SYyBnGI",title:"身為一個中年人，如何面對青春的沉沒成本？",channel:"吳淡如人生實用商學院（Official官方唯一頻道）",duration:1192,views:28090,uploadDate:"20220205",note:"沉沒成本與感情選擇——已經投入的時間不應該影響未來的決定。",tip:"把「沉沒成本」套用到你自己的感情經歷上，看看有沒有被它綁架過"},{youtubeId:"-dGbMMbSWfg",title:"超準分手評量表！愛情要繼續還是離開？【77老大】",channel:"77老大",duration:668,views:320607,uploadDate:"20220419",note:"32萬觀看的實用工具——用評量表來量化「這段關係值不值得繼續」。"}]},{id:"u-why-not-cooperate",name:"為何對方不願意配合我",tags:["溝通技巧","心理學"],mainVideo:{youtubeId:"o8EF1s5N3zE",title:"EP288 付出了那麼多，為何你不感動？無法回報的心意，造就相愛相殺的痛苦循環｜大人學",channel:"大人學",duration:1458,views:25544,uploadDate:"20220908",note:"大人學深度分析「付出卻得不到回報」的困境——這不是對方不好，而是你的付出可能不是對方需要的。在賽局中，「我以為的好」和「對方覺得的好」可能完全不同。搞清楚這個差異，才能停止相愛相殺的循環。"},selfCheck:"你有沒有過「我付出這麼多，對方為什麼不感動」的經驗？你的付出是基於「對方需要什麼」還是「你覺得什麼好」？如果對方也覺得自己在付出但你沒感覺，問題出在哪裡？你們有沒有直接討論過「什麼才算付出」？",mistakes:"用自己的標準衡量付出。你覺得「每天傳早安」是付出，對方覺得「重要的事記得提醒我」才是付出。你覺得「花錢買禮物」是愛，對方覺得「願意聽我說話」才是愛。付出錯了方向，不如不付出。",skills:["直接問對方「什麼事情會讓你覺得被愛」，而非自己猜","記錄對方抱怨過的事——那些抱怨就是未被滿足的需求","在付出之前先確認方向對不對，省力又有效"],extVideos:[{youtubeId:"w2DT0XEwTnE",title:"6個不愛對方的徵兆",channel:"小白心理學",duration:218,views:25882,uploadDate:"20200701",note:"Psych2go中文版，四分鐘辨識「不愛了」的行為徵兆——幫你判斷對方是「不配合」還是「不愛了」。"},{youtubeId:"TdFj7mQ8e34",title:"如何從控制走向愛？磨合與妥協的關鍵差異",channel:"禪師不打坐",duration:307,views:12708,uploadDate:"20230423",note:"五分鐘釐清「磨合」和「妥協」的差別——前者是雙方調整，後者是單方壓抑。"},{youtubeId:"VQ_49LnTSww",title:"戀情檢測！8個跡象讓你確認他適不適合你",channel:"DeerDeer Milu",duration:1048,views:49369,uploadDate:"20231012",note:"八個具體跡象幫你評估對方是否適合長期交往——從行為層面做系統性檢測。"}]},{id:"u-ambiguity-women",name:"曖昧階段該知道的事",tags:["實戰技巧"],mainVideo:{youtubeId:"rEEXbZsp5F0",title:"曖昧期到底該怎麼辦？怎麼分辨他到底是不是真的喜歡妳？",channel:"葳老闆的辣雞湯🌶️",duration:725,views:926730,uploadDate:"20210901",note:"92萬觀看的曖昧期指南——教你用具體行為來判斷對方的真實意圖。曖昧期是最需要「賽局思維」的階段：資訊不完整，雙方都在試探，你需要策略性地收集資訊並做出判斷。"},selfCheck:"你能列出五個判斷曖昧期對方是否認真的指標嗎？曖昧和正式交往的核心差異是什麼——是「關係名份」還是「行為承諾」？如果曖昧超過多久你會開始焦慮？你的焦慮是合理的嗎？",mistakes:"把曖昧期當成無限延長的舒適區。有些人享受曖昧的甜蜜卻害怕確認關係的責任——這對另一方是不公平的。曖昧的本質是「資訊收集期」，目的是判斷要不要進入關係。沒有終點的曖昧，是一種隱形的消耗。",skills:["在曖昧期設定心理時間表：多久之內要得到明確答案","用「行為一致性」而非「瞬間甜蜜」來評估對方的認真程度","該確認關係時果斷開口，不要用「繼續曖昧」來逃避被拒絕的風險"],extVideos:[{youtubeId:"KN9UPEx3F00",title:"他是不是真的愛你？曖昧期確認法，準確率100%！【77老大】",channel:"77老大",duration:619,views:697790,uploadDate:"20210715",note:"70萬觀看——77老大的曖昧期確認法，具體到可以直接套用。"},{youtubeId:"6qv0YFVfUDA",title:"花時間曖昧值得嗎？確認關係前你該問自己的5個問題",channel:"DeerDeer Milu",duration:800,views:181609,uploadDate:"20230227",note:"從自我審視的角度出發——你真的想談戀愛嗎？還是只想要曖昧的感覺？"},{youtubeId:"enmlQ1FtQtM",title:"曖昧期這些行為NG！害你沒自信又沒吸引力",channel:"卓苡瑄Jessie",duration:568,views:17297,uploadDate:"20221207",note:"列出曖昧期的NG行為——避開這些坑，你的吸引力會提升不少。"}]},{id:"u-third-party",name:"第三者關係該怎麼應對",tags:["案例分析","實戰技巧"],mainVideo:{youtubeId:"GTB3Guet1fg",title:"配偶外遇出軌後的三條發展路線，竟然是原配可以決定的！",channel:"兩性溝通幸福學苑",duration:1335,views:143012,uploadDate:"20200320",note:"14萬觀看——打破「被外遇就只能被動承受」的迷思。這支影片用賽局思維分析出軌後的三條路線，讓你理解：原配並不是沒有選擇權，關鍵是你願不願意拿回主動權。"},selfCheck:"你能列出配偶外遇後的三條發展路線嗎？在每條路線上，原配分別需要做什麼？「原諒」和「接受」有什麼區別？如果你身處這個情境，你會如何評估哪條路線最適合自己？",mistakes:"在情緒最激動的時候做人生最重大的決定。發現外遇的當下做的決定，幾乎都是你以後會後悔的。不管是衝動離婚還是馬上原諒，都不是經過理性分析的選擇。給自己冷靜的時間，才能做出不後悔的決定。",skills:["在重大關係危機發生時，給自己至少72小時的冷靜期再做決定","用「這對我的長期幸福最好嗎」而非「我現在最想做什麼」來評估選項","尋求專業心理諮商協助，不要只靠朋友的建議做重大決策"],extVideos:[{youtubeId:"gMPG0w0ZPeY",title:"如何耗盡第三者的耐心讓他主動退出？",channel:"兩性溝通幸福學苑",duration:651,views:8772,uploadDate:"20240902",note:"策略分析：如果選擇留下，怎樣讓第三者自行退出？用策略取代對抗。"},{youtubeId:"DRwrbKZLfVs",title:"另一半外遇只能分手離婚？心理諮商師教你避開毀滅性決策",channel:"孟聿晨・20年心理諮商師",duration:1230,views:9309,uploadDate:"20260426",note:"20年經驗的諮商師觀點——90%的人在被背叛後會做出毀滅性決策，如何避開。"},{youtubeId:"upukSCHuseQ",title:"感情出軌回頭的另一半，還能信任他嗎？",channel:"Kitty老師小教室",duration:592,views:61982,uploadDate:"20220603",note:"面對回頭的另一半，信任能重建嗎？Kitty老師從實務經驗給出具體建議。"}]}]}]},{id:"influence",name:"影響策略篇",chapters:[{id:"ch8",name:"衝突處理",icon:"⚡",units:[{id:"u-case-conflict",name:"案例：碰到衝突會怎麼處理",tags:["案例分析","溝通技巧"],mainVideo:{youtubeId:"yKRKFH3I9Vk",title:"這樣吵架一定分！你們都在吵沒意義的架？",channel:"葳老闆的辣雞湯🌶️",duration:845,views:294348,uploadDate:"20231129",note:"29萬觀看——拆解「會導致分手的吵架方式」和「有建設性的吵架方式」的差別。吵架不是問題，怎麼吵才是問題。在賽局中，衝突是必然的，但衝突的處理方式決定了關係是強化還是崩解。"},selfCheck:"你和伴侶的吵架模式是什麼——是就事論事還是人身攻擊？你有沒有在吵架中說過事後後悔的話？「會導致分手的吵架」和「有建設性的吵架」具體差在哪裡？你上一次吵架是哪一種？",mistakes:"吵架時的目標是「贏」而不是「解決問題」。很多人在衝突中的潛意識目標是證明自己是對的、對方是錯的。但感情不是法庭辯論——你贏了道理卻輸了感情。真正的目標應該是「解決讓雙方都不舒服的問題」。",skills:["吵架前先確認目標：是要「贏」還是要「解決問題」","當情緒上來時按暫停鍵：「我現在太生氣了，我們三十分鐘後再談」","吵完之後做復盤：這次衝突的根本原因是什麼，下次怎麼避免"],extVideos:[{youtubeId:"uaYUGcbQSsc",title:"情侶夫妻吵架不想溝通怎麼辦？男女吵架必看實戰經驗分享",channel:"Ashley艾嘻哩",duration:1158,views:33270,uploadDate:"20230701",note:"實戰經驗分享——從真實吵架經驗中提煉出的溝通方法，很接地氣。"},{youtubeId:"gyZyXXEhqmo",title:"另一半生氣了，怎麼辦？5個步驟解開婚姻衝突！",channel:"Kitty老師小教室",duration:531,views:5880,uploadDate:"20230210",note:"Kitty老師的五步驟衝突解決法——從「察覺」到「修復」的完整流程。"},{youtubeId:"TBSlO3X88HU",title:"交往中衝突/冷戰的感情，該如何復合成功？",channel:"戀愛診療室 Max",duration:604,views:17653,uploadDate:"20210428",note:"衝突後的復合策略——不是「假裝沒事」而是「真正修復」。"}]},{id:"u-case-why-not-me",name:"案例：為何女生都不選我",tags:["案例分析","自我提升"],mainVideo:{youtubeId:"mkb-mbzs2sk",title:"戀愛時怎麼愛自己？愛自己的終極意義？",channel:"葳老闆的辣雞湯🌶️",duration:1060,views:628513,uploadDate:"20221123",note:"62萬觀看——「為什麼別人不選我」的答案往往是「你還不夠選自己」。這支影片把「愛自己」從空泛的心靈雞湯變成具體的操作方法。在賽局中，一個不選擇自己的人，別人也不會選擇你。"},selfCheck:"「愛自己」對你來說是什麼意思——是自私，還是有底線？你有沒有為了被喜歡而放棄自己的標準？「別人不選我」的原因是你不夠好，還是你展現自己的方式有問題，還是你選錯了對象？",mistakes:"把「被選擇」當成人生目標。如果你的自我價值建立在「有沒有人喜歡我」上面，你永遠會焦慮。因為即使有人選了你，你也會害怕被拋棄。真正有吸引力的人，是有自己生活重心的人——對方是錦上添花，不是雪中送炭。",skills:["列出三件讓你有成就感的事，並持續投入——這是你價值感的來源","區分「被拒絕」和「不適合」，前者不影響你的價值","練習獨處而不寂寞：能享受一個人的人，在關係中才不會過度依賴"],extVideos:[{youtubeId:"DnAf6zekYpc",title:"成為單身勝利組！是你在選擇，不是別人選你！【77老大】",channel:"77老大",duration:669,views:269300,uploadDate:"20210601",note:"27萬觀看——翻轉「被選擇」的心態，建立「你在選擇」的自信。"},{youtubeId:"gXi8kH0VYVw",title:"為什麼你不主動找女生，就沒有女生主動來找你",channel:"反抗者J",duration:601,views:55077,uploadDate:"20250721",note:"直接點出很多男生的盲點：等著被選擇，而不是主動出擊。"},{youtubeId:"G0b5BrrgMak",title:"3招提升自我價值感！為什麼總是覺得我不配？",channel:"Anna欸娜",duration:960,views:25218,uploadDate:"20240825",note:"從「我不配」到「我值得」的心態轉換——三個具體的自我價值提升方法。"}]},{id:"u-change-game",name:"我該怎麼改變局",tags:["賽局理論","實戰技巧"],mainVideo:{youtubeId:"vO_0QnpDmGI",title:"女人該如何在婚姻中掌握主動權？",channel:"才子情感",duration:571,views:21820,uploadDate:"20201105",note:"十分鐘分析如何在關係中從被動轉為主動——這是賽局理論的核心應用：當你不滿意現在的「均衡狀態」，你可以透過改變自己的策略來改變整個局面。不是要控制對方，而是讓對方看到一個新的、更好的均衡點。"},selfCheck:"你在關係中通常是主動的還是被動的一方？如果你不滿意現在的互動模式，你覺得改變應該從誰開始？在賽局理論中，改變「局」的方法有哪些？你有沒有過「改變自己的做法後，對方也跟著改變」的經驗？",mistakes:"等對方先改變。「我改了一大堆，為什麼對方還是老樣子？」因為你可能改的不是對方在意的點。改變局面不是「我變好了你就該配合」，而是「我改變互動方式，讓新的模式對雙方都更有吸引力」。",skills:["找出目前關係中最想改變的一個互動模式","先改變自己在這個模式中的反應，觀察對方的反應變化","如果對方的反應沒變，調整你的改變方向——問題可能不在你想的地方"],extVideos:[{youtubeId:"fJSZYEeoMRk",title:"女生主動會不被珍惜？主動就是廉價嗎？",channel:"人生啊 - 陪你一起看懂人生",duration:3254,views:39273,uploadDate:"20241016",note:"打破「主動就是廉價」的迷思——主動不是問題，沒有策略的主動才是。"},{youtubeId:"Mx0uT962Jhk",title:"他不是不愛你，是在你開口之前他就已經防衛了",channel:"人生解扣方程式",duration:973,views:5994,uploadDate:"20260626",note:"改變局面的第一步：改變你的溝通開場方式，讓對方的防衛降下來。"},{youtubeId:"8NJfIMYSS2Q",title:"你以為缺乏安全感是自己的問題？其實從選人那一步就已經決定了",channel:"人生解扣方程式",duration:1387,views:43008,uploadDate:"20260619",note:"有時候改變局面不是改變互動方式，而是重新審視這個「局」本身。"}]}]},{id:"ch9",name:"策略與選擇",icon:"🎯",units:[{id:"u-conflict-elements",name:"處理衝突的五大要素與三個策略",tags:["溝通技巧","實戰技巧"],mainVideo:{youtubeId:"pINqEH9y50o",title:"遇到衝突，你是不是又妥協了？別再做沒立場的人了",channel:"Better Leaf 好葉",duration:536,views:24444,uploadDate:"20220706",note:"好葉用動畫風格講解衝突處理的關鍵技巧——不是要你更強硬，而是教你有立場地表達。在賽局中，一個永遠妥協的人是最容易被利用的；但一個永遠不妥協的人則無法建立關係。關鍵是知道什麼時候該堅持，什麼時候該讓步。"},selfCheck:"你在衝突中通常是妥協方還是堅持方？你覺得「有立場」和「固執」的差別在哪裡？你能列出處理衝突的五大要素嗎？在你最近一次衝突中，你用了哪些要素，忽略了哪些？",mistakes:"把「妥協」等於「成熟」。總是妥協的人不是成熟，是不敢面對衝突。長期妥協會累積怨氣，最後以更激烈的方式爆發。真正成熟的做法是：說出你的底線，願意在底線以上協商。",skills:["在每次衝突中先確認自己的底線是什麼——哪些可以讓，哪些不能讓","用「我可以接受...但我不能接受...」的句式來表達立場","衝突結束後確認雙方都接受的方案，而非只是單方面的讓步"],extVideos:[{youtubeId:"233EqPN0roo",title:"《人性的弱點》改善人際關係和溝通技巧的五個重點！",channel:"成長空間",duration:652,views:2992,uploadDate:"20230326",note:"卡內基經典重新解讀——五個改善關係的溝通重點，歷久彌新。"},{youtubeId:"4ZxCBBhZn8E",title:"這五點看似沒什麼，卻是慢性分手的關鍵原因",channel:"人生啊 - 陪你一起看懂人生",duration:2573,views:43214,uploadDate:"20260128",note:"和人生解扣方程式合作的深度對談——把「慢性分手」的根因追溯到五個日常衝突處理的失誤。"},{youtubeId:"_qjycWAo5SM",title:"談判桌上兩難衝突選擇的解決方案",channel:"鼎新數智 知識學院",duration:1332,views:1216,uploadDate:"20200413",note:"從談判角度看衝突解決——商業談判的技巧同樣適用於感情中的協商。"}]},{id:"u-blind-date",name:"相親與生育的理性思考",tags:["觀念主題"],mainVideo:{youtubeId:"Sdx979xaY0w",title:"你適合生小孩嗎？用這5點快速判斷！養小孩要花多少錢？",channel:"葳老闆的辣雞湯🌶️",duration:873,views:317850,uploadDate:"20221102",note:"32萬觀看——用五個具體問題幫你評估「生小孩」這個重大人生決策。在賽局中，生育是一個不可逆的選擇，而且會徹底改變關係的動態。這支影片幫你在做決定之前，先想清楚你真正要面對的是什麼。"},selfCheck:"你有認真想過要不要生小孩嗎？你的答案是基於「社會期待」還是「自己的人生規劃」？你和伴侶在這個問題上的立場一致嗎？如果不一致，這是一個可以協商的問題，還是一個根本性的分歧？",mistakes:"以為生小孩會讓關係變好。在關係本身就有問題的情況下生小孩，通常會讓問題加速惡化而非解決。小孩需要穩定的家庭環境，不是用來修補關係的工具。先把關係修好，再考慮生育。",skills:["在做生育決定之前，和伴侶坦誠討論五個核心問題：經濟、分工、教育理念、職涯影響、支持系統","不被「別人都生了」的社會壓力影響你的理性判斷","尊重伴侶在這個問題上的立場，即使和你不同"],extVideos:[{youtubeId:"HzuEtKcTLdQ",title:"要不要生小孩？這8件事情你們考慮過了嗎？",channel:"茜茜與人夫謙 Chien&Chien",duration:910,views:41421,uploadDate:"20231022",note:"以過來人身份分享八個生育前該考慮的面向——實用且誠實的經驗談。"},{youtubeId:"SgsX5HHr_9E",title:"生了孩子，我們會放棄什麼？｜《為什麼我們不想生》",channel:"文森說書",duration:965,views:190913,uploadDate:"20230328",note:"文森說書的書籍解讀——理性分析「生育的代價」，幫你做更清醒的選擇。"},{youtubeId:"B6VxFOC8Gfw",title:"不生小孩很孤單、生了又很負擔？訪問6年級生的心裡話",channel:"白癡公主",duration:1688,views:1638233,uploadDate:"20250911",note:"164萬觀看——真實訪問不同選擇的人，聽到各種人生路徑的真實感受。"}]},{id:"u-approach-tips",name:"在接近階段該知道這些",tags:["實戰技巧"],mainVideo:{youtubeId:"BsO3hPtvyPw",title:"這是迄今為止女生最最最喜歡的追求方式，男生必看！",channel:"楚儿恋爱说",duration:380,views:1385061,uploadDate:"20211230",note:"138萬觀看——直接告訴你女生最喜歡的追求方式。在賽局中，「接近階段」就是雙方都在試探和展示的過程。這支影片告訴你：不是要你表演什麼角色，而是用對方喜歡的方式展現真實的你。"},selfCheck:"你覺得「追求」和「糾纏」的界線在哪裡？你知道對方喜歡的追求方式嗎——是浪漫型、實際型、還是自然型？你在接近異性時最大的障礙是什麼——害羞、不知道說什麼、還是害怕被拒絕？",mistakes:"用「感動」來代替「吸引」。送花、送禮、每天早安晚安——這些可能會感動對方，但感動不等於吸引。吸引力來自你的個人魅力、幽默感、獨立性和可靠感，不是來自你付出了多少物質或時間。",skills:["在接近初期，用輕鬆的互動建立舒適感，而非用密集的關注製造壓力","觀察對方的回應強度來調整你的接近節奏——對方也在給你信號","保持自己的生活重心，不要因為追求某人就放棄其他一切"],extVideos:[{youtubeId:"Tnlr-8QAlvY",title:"到底該怎麼追女生？男生這樣提高好感度！",channel:"葳老闆的辣雞湯🌶️",duration:649,views:310496,uploadDate:"20241211",note:"31萬觀看——從女生視角告訴男生什麼做法會加分。"},{youtubeId:"T0ibuu05M5o",title:"女生是用釣的！不用追！女生才知道的追求小技巧",channel:"凹凹葳",duration:572,views:433686,uploadDate:"20200722",note:"43萬觀看——翻轉「追」的思維，用「吸引」取代「追逐」。"},{youtubeId:"GHtyFF9RhFw",title:"你會不會跟女生聊天？男生這樣難怪不OK！",channel:"葳老闆的辣雞湯🌶️",duration:525,views:239853,uploadDate:"20250115",note:"24萬觀看——聊天是接近階段最重要的技能，這支影片指出最常見的聊天錯誤。"}]}]}]},{id:"long-term",name:"長期經營篇",chapters:[{id:"ch10",name:"不安全感與成長",icon:"🛡️",units:[{id:"u-case-insecure",name:"案例：沒有安全感的情人",tags:["案例分析","心理學"],mainVideo:{youtubeId:"_sX6c0YQ3sU",title:"把對方當作全世界，訊息不回就焦慮，這不是愛，是潛意識在尋找熟悉的痛苦",channel:"文森說書",duration:3131,views:604501,uploadDate:"20260106",note:"60萬觀看——文森說書邀請諮商心理師深度剖析「不安全感」的心理根源。這不是簡單的「想太多」，而是潛意識中的依附模式在作用。理解了這一點，你才能停止用焦慮來消耗關係。"},selfCheck:"你在關係中的安全感程度是幾分（1-10）？你的不安全感主要來自哪裡——怕被拋棄、怕不被愛、還是怕被取代？你知道自己是什麼依附類型嗎（安全型、焦慮型、逃避型）？你的依附類型如何影響你在關係中的行為？",mistakes:"用「查勤」來獲得安全感。查手機、要求報備行蹤、限制對方交友——這些行為短期內會降低焦慮，但長期會摧毀信任。你用控制得到的不是安全感，是對方的反感。真正的安全感來自內在，不是外在的確認。",skills:["當焦慮升起時，先問自己「這個焦慮是真實的威脅，還是我的依附模式在作用」","練習「自我安撫」：在想要查勤之前，先做三次深呼吸，等焦慮降低再行動","和伴侶坦誠分享你的不安全感，而非用控制行為來間接表達"],extVideos:[{youtubeId:"7rFR1ksPbKo",title:"缺乏安全感：在你關係中作祟的怪物",channel:"Sherry's Notes 雪力的心理學筆記",duration:2043,views:313364,uploadDate:"20241115",note:"31萬觀看——周慕姿心理師從依附理論深度分析安全感議題。",tip:"搭配依附類型測試一起看，效果加倍"},{youtubeId:"P7CRGTIDuYE",title:"關係中常沒安全感？你知道自己是什麼依附類型嗎？",channel:"周慕姿放心說",duration:970,views:67690,uploadDate:"20250210",note:"十分鐘了解四種依附類型——知道自己的類型，就知道焦慮的根源。"},{youtubeId:"GIYFsT2sBVo",title:"成日懷疑另一半？經常擔心別人拋棄我？",channel:"Mill MILK",duration:1723,views:244830,uploadDate:"20250428",note:"24萬觀看——輔導心理學家用真實案例（放多個AirTag監控男友）分析焦慮型依附。"}]},{id:"u-case-growth-gap",name:"案例：成長不同調的兩個人",tags:["案例分析","長期經營"],mainVideo:{youtubeId:"1Uev9BLQyGU",title:"當談戀愛不再是兒戲，兩人之間失衡了，除了溝通還有什麼方法？",channel:"Blaire Chen",duration:1088,views:214903,uploadDate:"20211230",note:"21萬觀看——Blaire深度分析「兩人成長不同步」的困境。在長期關係中，最常見的挑戰不是外遇或吵架，而是兩個人漸漸變成了不同世界的人。這支影片教你在失衡時如何調整，而不是放棄。"},selfCheck:"你和伴侶的成長速度一致嗎？在哪些方面你們越來越像，哪些方面越來越不同？如果一方成長很快、另一方停滯不前，問題出在誰身上？「成長不同步」能解決嗎？解決的方法是什麼？",mistakes:"覺得「對方不進步」就是拖後腿。每個人有自己的節奏和方向。你眼中的「停滯」可能是對方在你不在意的領域成長。不要用自己的成長標準去衡量對方——真正的問題不是「誰成長比較快」，而是「你們還能不能互相理解」。",skills:["定期和伴侶分享各自的成長和變化，保持對彼此的理解更新","找到至少一個可以一起成長的領域（閱讀、運動、學習新技能）","在感到失衡時先溝通，而非直接下結論「我們不合適了」"],extVideos:[{youtubeId:"-aCwtFhFNqs",title:"另一半值不值得長久共老？看彼此三觀合不合就知道！",channel:"TVBS Global News",duration:914,views:385592,uploadDate:"20231025",note:"38萬觀看——方念華和律師賴芳玉深度對談「三觀」在長期關係中的重要性。"},{youtubeId:"9mfAhYW9qJ0",title:"如何穩定交往？分享我快7年的感情！",channel:"阿畫",duration:639,views:281440,uploadDate:"20201028",note:"28萬觀看——阿畫用七年交往經驗分享長期關係的穩定之道。"},{youtubeId:"_x1XC88T33w",title:"和另一半培養共同目標和夢想的3個方法",channel:"華生×阿西 Nomad Couple",duration:324,views:2965,uploadDate:"20220904",note:"五分鐘實用技巧——如何在長期關係中建立共同的成長方向。"}]},{id:"u-insecurity",name:"如何看待不安全感",tags:["心理學","自我提升"],mainVideo:{youtubeId:"zWBT2VgfyJw",title:"三個步驟，讓你練習給自己安全感",channel:"周慕姿放心說",duration:708,views:95315,uploadDate:"20250106",note:"周慕姿心理師的十分鐘實用教學——安全感不是向外索取的，而是可以自己練習建立的。三個步驟從「覺察焦慮」到「自我安撫」到「建立內在穩定」，每一步都具體可操作。"},selfCheck:"你通常是用什麼方式處理不安全感——向對方要確認、轉移注意力、還是壓抑不想？這三個步驟你覺得最難的是哪一個？「給自己安全感」和「不在乎」有什麼區別？你有沒有過「自己安撫成功」的經驗？",mistakes:"以為賺更多錢就能解決安全感問題。很多人拼命工作，以為經濟能力強就不怕被拋棄。但不安全感的根源在心理，不在錢包。再有錢的人如果內心不穩定，還是會在關係中焦慮——因為你永遠買不到「對方一定不會離開」的保證。",skills:["練習「情緒命名」：當焦慮出現時，說出「我現在感到不安全」而不是直接行動","建立「安全清單」：列出五件讓你感到安心的事，焦慮時去做其中一件","定期練習獨處：能在獨處中感到平靜的人，在關係中才不會過度依賴"],extVideos:[{youtubeId:"mYRj79rG7L8",title:"如何愛得安心又自在？跟沒安全感 Say ByeBye！",channel:"蔡博堯諮商心理師",duration:574,views:5965,uploadDate:"20221212",note:"心理師分享四種在愛情中自己給自己安全感的練習方法。"},{youtubeId:"JBKmSD7yGLI",title:"焦慮型依戀真的好累！4件事讓你在關係中擁有安全感",channel:"鼠鼠學生活 Learn Life",duration:638,views:18219,uploadDate:"20230507",note:"針對焦慮型依附的人量身打造的四個練習——看完就能開始做。"},{youtubeId:"e8hpnyOyeTc",title:"總是缺乏安全感的話，該怎麼找到長久穩定的安全感？",channel:"覓井講關係 MACHIEN on Relationship Psychology",duration:685,views:1407,uploadDate:"20201016",note:"從信仰和心理學的交叉角度探討安全感——提供不同於主流心理學的思考維度。"}]}]},{id:"ch11",name:"長期關係的經營",icon:"💎",units:[{id:"u-wrong-things",name:"大部分人都給錯東西了",tags:["觀念主題","長期經營"],mainVideo:{youtubeId:"O4DTu0FeqEU",title:"戀愛心理！讓他離不開妳——抓住人性！怎樣才會被珍惜？",channel:"葳老闆的辣雞湯🌶️",duration:1067,views:1968905,uploadDate:"20220831",note:"197萬觀看——全站最高觀看數的影片，講的核心道理很簡單：大部分人在關係中給的不是對方要的。你覺得對方需要物質，其實對方需要陪伴；你覺得對方需要關心，其實對方需要空間。給對了，才會被珍惜。"},selfCheck:"你在關係中付出最多的是什麼？這些付出是「你覺得對方需要的」還是「對方實際說過需要的」？你有沒有問過對方「什麼行為會讓你感到被愛」？你自己最需要的是什麼——你的伴侶知道嗎？",mistakes:"用自己的方式愛對方。你怕冷所以一直給對方加衣服，但對方不怕冷，覺得你很煩。這就是「給錯東西」的本質。不是你不努力，是你努力的方向不對。感情經營最大的浪費就是「我這麼用心，對方卻沒感覺」。",skills:["直接問對方：什麼行為會讓你感到被愛？什麼行為會讓你覺得被忽略？","觀察對方做了什麼來表達愛——那通常就是對方希望你回報的方式","每月做一次「關係需求校準」：確認雙方的核心需求有沒有變化"],extVideos:[{youtubeId:"1mz_rYW8mpg",title:"維持感情十大經營之道：有愛還不夠，必須懂經營？",channel:"白瑜 心星占星",duration:430,views:7012,uploadDate:"20201025",note:"七分鐘列出十個感情經營的具體方向——快速掃描你做到了幾個。"},{youtubeId:"H-5XJfHZfYM",title:"孫儷和鄧超怎麼經營婚姻？感情長久秘訣是什麼？",channel:"Kitty老師小教室",duration:466,views:3722,uploadDate:"20230616",note:"用名人婚姻案例說明：感情長久不是靠「忍」，而是靠主動經營。"},{youtubeId:"GOYkqCFKZ8M",title:"不敢再相信愛情？比愛更能維繫長久感情的是什麼？",channel:"Kitty老師小教室",duration:624,views:1193,uploadDate:"20211127",note:"探討「比愛更重要的東西」——信任、承諾、和一起成長的意願。"}]},{id:"u-marriage-conflicts",name:"婚後常見的爭執與互相傷害",tags:["長期經營","溝通技巧"],mainVideo:{youtubeId:"4hmD1bzxmow",title:"生完小孩夫妻不和，為了孩子吵架，注意力都在孩子身上",channel:"Kitty老師小教室",duration:784,views:5314,uploadDate:"20230324",note:"直接點出婚後最常見的衝突引爆點：孩子。當注意力全部轉移到孩子身上，伴侶關係就被擠到邊緣。Kitty老師用五個實用建議告訴你如何在育兒和婚姻之間取得平衡——因為孩子需要的是穩定的父母關係，不是犧牲婚姻的全面照顧。"},selfCheck:"你覺得婚後最常見的爭執議題是什麼？如果有了孩子，你和伴侶有沒有討論過「如何分配注意力」？「為了孩子維持婚姻」是好的選擇嗎？孩子能感受到父母之間的緊張嗎？",mistakes:"以為「有了孩子就要把所有精力放在孩子身上」。孩子需要的不是父母100%的注意力，而是一個穩定和諧的家庭環境。如果你為了孩子忽略了伴侶，伴侶關係惡化後，孩子反而是最大的受害者。",skills:["每週至少安排一次「只有伴侶沒有孩子」的相處時間","在育兒觀念不一致時，先協商出共識，再面對孩子——不要在孩子面前唱反調","把「我們的關係好不好」當成和「孩子好不好」同等重要的事來經營
