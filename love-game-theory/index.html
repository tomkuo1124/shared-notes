<script>window.COURSE_DATA={title:"戀愛賽局論",storageKey:"love-game-theory",subtitle:"用理性經營感情關係——看懂戀愛中的賽局，找出阻力最小的雙贏策略",stance:[{title:"立場一：戀愛不需要理性，但經營關係需要",body:"愛情的起點是感性——心動、吸引、直覺，這些無法被計算。但當兩個人決定走在一起，關係的維繫就需要理性思考：如何溝通、如何分配注意力、如何在衝突中找到平衡。本站相信，理性不是用來壓抑感情，而是用來保護感情——當你能看懂互動背後的結構，你才有能力做出讓關係更好的選擇。"},{title:"立場二：教判讀框架，不教操控技巧",body:"賽局理論提供的是「理解局勢」的框架——幫助你看懂雙方的動機、預測可能的結果、找到更好的策略。這不是教你操控對方，而是幫你看清互動的結構，做出更有意識的選擇。我們拒絕任何以「讓對方聽話」為目標的話術教學，因為真正的贏，是兩個人都覺得值得。"},{title:"立場三：本站為策展整理，非專業諮商建議（免責聲明）",body:"本站內容為 YouTube 公開影片的策展整理，旨在提供系統化的學習路徑，幫助你建立思考感情問題的框架。所有影片版權屬於原創作者。本站不提供心理諮商或專業治療建議，若你正經歷嚴重的情感困擾、關係暴力或心理健康問題，請尋求合格的心理諮商師或相關專業人士協助。"}],parts:[{id:"opening",name:"開場篇",chapters:[{icon:"🎬",name:"為何戀愛需要策略",units:[{id:"u-love-fail-reasons",name:"會導致戀愛失敗的三大原因",tags:["觀念主題"],mainVideo:{youtubeId:"0W4TT6g8cyo",title:"為什麼愛情長跑會失敗｜一起戀愛吧｜卓苡瑄",channel:"卓苡瑄Jessie",duration:431,views:6046,uploadDate:"20201022",note:"這支影片從真實案例切入，歸納出愛情長跑中最常犯的三種致命錯誤，每一個都讓人心有戚戚焉。放在課程開場，是因為它直接點破「不經思考就行動」的代價有多高——先看清問題全貌，才有改變的起點。"},selfCheck:"你能列出影片中提到的三個導致戀愛失敗的主要原因嗎？這三個原因中，哪一個最容易在不自覺的情況下發生？你在過去的感情中，是否曾經犯過其中任何一個錯誤？如果現在重來，你會怎麼調整自己的做法？",mistakes:"以為只要有愛就夠了，忽略經營策略，等到問題爆發才驚覺——大部分人不是不夠愛，是不知道怎麼經營。",skills:["辨識自己感情中最可能觸發的失敗因素","用「事後覆盤」的方式回顧過去的感情經歷","建立「感情也需要策略思維」的基本心態"],extVideos:[{youtubeId:"khQs9J0ZPHE",title:"感情別這樣做小心她對你沒感覺|  (愛情)(感情)(戀愛)(吸引)【貝克書】",channel:"貝克書",duration:703,views:25091,uploadDate:"20210909",note:"從男性視角補充哪些行為會讓對方失去感覺",tip:"注意影片中列舉的具體行為，對照自己是否曾經這樣做"},{youtubeId:"4lprt1sSRCw",title:"一再受傷/溝通不良/冷暴力😭5個重新檢視這段「感情關係」的時機！是時候該退場了嗎？⎥Blaire暖昕相談室",channel:"Blaire Chen",duration:1089,views:264713,uploadDate:"20231019",note:"幫你判斷一段關係是否已經出現不可逆的惡化訊號",tip:"影片提到的五個檢視時機，可以當作關係健康度的檢核表"},{youtubeId:"IvyOChKykoE",title:"追求失敗繼續當朋友會怎樣|  (愛情)(感情)(戀愛)(吸引)【貝克書】",channel:"貝克書",duration:232,views:45240,uploadDate:"20201109",note:"探討追求失敗後的常見錯誤決策與後果"}]},{id:"u-love-five-problems",name:"感情的五大難題",tags:["觀念主題","心理學"],mainVideo:{youtubeId:"LxK6_ywi8ZM",title:"【兩性】5個傻眼的戀愛問題！妳中了幾個？｜阿畫",channel:"阿畫",duration:267,views:27048,uploadDate:"20200502",note:"阿畫用
