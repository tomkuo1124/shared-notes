<script>window.COURSE_DATA={title:"NLP 心法覺醒：佛學智慧的現代應用",storageKey:"nlp-buddhist-wisdom",subtitle:"以 NLP 核心技術為骨架、佛學智慧為深化視角，幫助你在工作與生活中活出覺察與改變",stance:[{title:"本站立場：NLP 是工具，佛學是智慧",body:"NLP 提供具體可操作的技巧，佛學提供深層的哲學視角。我們不是在說「佛學就是 NLP」，而是發現兩者在理解人類心智這件事上，走了相似的路。每個技巧都有其適用場景與限制，學習者應根據自身狀況靈活運用。"},{title:"批判思考：保持覺察，不盲從",body:"NLP 領域存在商業化過度包裝的現象，佛學也可能被誤解或濫用。本站鼓勵學習者保持獨立思考，從多元觀點中找到適合自己的路。對任何「保證有效」的說法，都值得多問一句為什麼。"},{title:"免責聲明",body:"本站為個人學習策展，不代表任何 NLP 機構或宗教團體的官方立場。影片版權屬原創作者所有。本站內容僅供自我成長參考，不構成心理治療建議。若有心理健康需求，請尋求專業心理諮商師協助。"}],parts:[{id:"awakening",name:"覺醒起點 — NLP 與佛學的共通智慧",chapters:[{id:"ch-two-paths",name:"兩條路，一個目的地",icon:"🌅",units:[{id:"u-what-is-nlp",name:"NLP 不是「洗腦術」：一套理解人的科學方法",tags:["入門","觀念建立"],mainVideo:{youtubeId:"E_KTnRkgjd0",title:"【#NLP講堂】【三句話，讓你的溝通事半功倍】【神經語言程式學】【口語催眠】",channel:"NLP心理學彭博",duration:294,views:22009,uploadDate:"20200816",note:"彭博老師用三句話示範 NLP 如何應用在日常溝通，不談玄學、不賣課程，直接展示 NLP 的實用面。適合作為第一支影片，讓學習者對「NLP 到底在幹嘛」有具體的畫面，而不是停留在模糊的印象。"},selfCheck:"你能用自己的話解釋 NLP 是什麼嗎？如果朋友問你「NLP 跟催眠有什麼不同」，你怎麼回答？NLP 的三個字母分別代表什麼，它們如何影響我們的行為模式？你能舉出一個生活中「語言改變了你的感受」的例子嗎？",mistakes:"最常見的誤解是把 NLP 當成「操控別人的技巧」或「速成心靈雞湯」。NLP 的核心是理解自己與他人的思維模式，不是背話術。如果你學 NLP 的目的是操控人，那你已經走偏了。",skills:["能向不懂 NLP 的朋友用一句話解釋它是什麼","分辨 NLP 的科學面與商業包裝的差異","理解「神經」「語言」「程式」三者如何連動影響行為"],extVideos:[{youtubeId:"Lndj1IIICRs",title:"学会NLP神经语言程序学真的能升级你的大脑，改变你的人生？今天我就来聊一聊这个被质疑了50年的神级方法论",channel:"王爷talk",duration:798,views:3607,uploadDate:"20260129",note:"從批判角度審視 NLP 五十年來的爭議與價值，提供平衡觀點",tip:"注意他提到的「NLP 被質疑的點」，這些質疑很重要"},{youtubeId:"uNmwKnX46Sg",title:"為甚麼要學習NLP？結合語言學X心理學X潛意識，讓改變和實踐變的輕而易舉",channel:"Iaa中華芳香精油全球發展協會",duration:222,views:1936,uploadDate:"20231012",note:"從語言學與心理學交叉的角度說明 NLP 的學科基礎",tip:"留意 NLP 如何結合不同學科的精華"},{youtubeId:"vvQ6lzkB9fQ",title:"常用NLP格言思考，我們會越來越好｜見人哥和你說說話",channel:"見人哥",duration:255,views:15370,uploadDate:"20220202",note:"用日常語言分享 NLP 格言如何融入生活思考",tip:"挑一句最觸動你的格言，記下來反覆品味"}]},{id:"u-map-territory",name:"「地圖不等於疆域」：NLP 前提假設 × 佛學世界觀",tags:["核心觀念","NLP前提假設"],mainVideo:{youtubeId:"as08TE2P59w",title:"NLPU專業執行師課程014 假設前提 地圖不等於疆域",channel:"jean johnson",duration:720,views:234,uploadDate:"20200529",note:"直接講解 NLP 最核心的前提假設「地圖不等於疆域」——你看到的世界不是世界本身，而是你的大腦建構出來的版本。這個觀念與佛學「萬法唯心」有驚人的相似。雖然觀看數不高，但內容紮實，是 NLPU 正規課程錄影。"},selfCheck:"你能解釋「地圖不等於疆域」這句話的意思嗎？想一個你最近跟人意見不同的場景，用這個概念重新看——對方的「地圖」跟你的有什麼不同？NLP 的前提假設跟佛學的「萬法唯心」有什麼相似之處？",mistakes:"理解「地圖不等於疆域」後，有些人會走向另一個極端：覺得「反正都是主觀的，沒有對錯」。但重點不是否定客觀事實，而是意識到每個人的理解都有盲區，願意去探索不同的「地圖」。",skills:["遇到意見衝突時，能暫停並思考「對方的地圖是什麼」","能列出至少三個 NLP 前提假設並舉出生活對應例子","理解「我的理解 ≠ 事實本身」這個認知框架"],extVideos:[{youtubeId:"VMflEgmgon8",title:"NLP 前提假設 - Part 2 | NLP 身心語言程式學執行師認證課程 | NLP評價 | NLP推薦 | NLP邊間好？ |",channel:"Hong Kong Society of Professional Training",duration:200,views:322,uploadDate:"20240206",note:"系統化講解 NLP 前提假設的第二部分，補充更多假設條目"},{youtubeId:"dVFSCqKgGfY",title:"NLP 前提假設 - Part1 | NLP 身心語言程式學執行師認證課程 | NLP評價 | NLP推薦 | NLP邊間好？ |",channel:"Hong Kong Society of Professional Training",duration:124,views:144,uploadDate:"20240206",note:"NLP 前提假設的第一部分，適合搭配 Part 2 一起看",tip:"建議先看 Part 1 再看 Part 2，循序漸進"},{youtubeId:"EcPmEkPPP8w",title:"【佛法唯識學與心理學】八個兄弟共一胎 假我？真我？如來藏思想 阿賴耶識 八識 因緣果報及輪迴法則",channel:"Andy Lin",duration:743,views:28107,uploadDate:"20180326",note:"佛法唯識學如何解釋「心」如何建構世界，與 NLP 前提假設遙相呼應",tip:"不需要全懂佛學術語，重點感受「心如何造世界」"}]},{id:"u-beginners-mind",name:"初心者之心：學習的最佳姿態",tags:["學習心態"],mainVideo:{youtubeId:"NyF0rMKyUyM",title:"有空杯心態、才會願意學習、才能進步更快！",channel:"進步思維",duration:321,views:328,uploadDate:"20220309",note:"空杯心態是 NLP 學習的第一步，也是禪宗「初心」的現代版本。這支影片用生活化的語言說明為什麼「以為自己懂了」是學習最大的敵人。在進入後面的技巧之前，先調整好這個姿態，所有的學習效果都會加倍。"},selfCheck:"你覺得自己在哪些領域已經「裝滿了」，不太願意聽不同的意見？「空杯心態」跟「沒有主見」有什麼不同？你能想到一個因為放下已有認知而獲得突破的經驗嗎？",mistakes:"「空杯心態」不是要你放棄所有已有知識變成白紙。真正的空杯是「暫時擱置判斷，先聽完再決定」。如果你把空杯當成「老師說什麼都對」，那反而是另一種不覺察。",skills:["在接收新觀點時，練習「先聽完再判斷」的暫停三秒法","區分「保持開放」與「盲目接受」的差異","每週記錄一個「原來我以前想錯了」的發現"],extVideos:[{youtubeId:"wuW7KxAiMlM",title:"生活即是修行🙏最宏偉的揚升發生在生活細節裡🏠你的日常生活就是你的朝聖之地👣",channel:"靈性種子學堂🌱",duration:307,views:805,uploadDate:"20210619",note:"佛學視角：學習不只在課堂，生活的每個細節都是修行道場"},{youtubeId:"hpi3r9zzrHo",title:"『激勵影片』當我們開始幫助人，世界就彩色起來了！",channel:"創玩生活-彼得教練",d fCheck:"你能解釋 NLP 錨定技術的基本原理嗎？你有沒有不自覺的「錨」——聽到某首歌就想到某個人、聞到某個味道就回到某個場景？如果你可以設定一個「自信按鈕」，你會選什麼觸發動作？",mistakes:"設定心錨時最常見的錯誤是「在情緒強度不夠時就設錨」。錨定的關鍵是在情緒最高峰的瞬間觸發，太早或太晚都會讓錨的效果大打折扣。另外，心錨需要定期「加強」才不會退化。",skills:["完成一次完整的自我錨定設定（選擇情緒→回憶場景→高峰觸發）","理解錨定與巴甫洛夫條件反射的關係","找到佛學持咒/念佛中的「錨定」邏輯並比較異同"],extVideos:[{youtubeId:"n2S7zt_z-KE",title:"隱蔽式心錨, 部分內容曝光! 話說迎新宿營之那晚的舞會。不用帕夫洛夫, 我改用完形（下）",channel:"Hogan Lee",duration:444,views:156,uploadDate:"20210604",note:"進階：隱蔽式心錨的實際應用故事，看錨定如何在社交中運作"},{youtubeId:"v5NxgaLT6YE",title:"3分鐘睡前心經禪修🌙聽完大腦立刻安靜 🌙 靜心助眠、告別思緒紛亂",channel:"Great Compassion Bodhi Prajna Temple  大悲菩提寺",duration:742,views:129365,uploadDate:"20260125",note:"佛學中的「錨」：心經禪修如何透過聲音與節奏觸發平靜狀態",tip:"體驗一次：這就是佛學版的「錨定技術」"},{youtubeId:"b5E1BO7unUA",title:"什麼是念佛與持咒的意義 |The True Meaning of Chanting Buddha's Names and Reciting Mantras | 妙音法師",channel:"Great Compassion Bodhi Prajna Temple  大悲菩提寺",duration:512,views:7736,uploadDate:"20220714",note:"念佛持咒的心理機制：反覆誦唸如何建立深層的心理錨定",tip:"不論信仰如何，理解「重複」如何改變大腦狀態"}]}]}]},{id:"communication",name:"溝通力 — 慈悲與連結",chapters:[{id:"ch-connection",name:"建立連結",icon:"🤝",units:[{id:"u-rapport",name:"讓人願意跟你說話：親和感的建立",tags:["核心技巧","溝通"],mainVideo:{youtubeId:"s9QcD1y3h00",title:"瞬間親和力技巧 | 李政忠(阿忠師)老師 |邦訓企管微學習",channel:"邦訓企管",duration:360,views:2403,uploadDate:"20200519",note:"NLP 的 Rapport（親和感）是所有溝通的起點——沒有親和感，任何技巧都是空中樓閣。阿忠師用實際情境示範如何快速建立親和感。在佛學中，慈悲心就是最強的親和感：當你真心想理解對方，連結自然產生。"},selfCheck:"你能說出建立親和感的三個關鍵要素嗎？回想上次跟陌生人順利聊起來的經驗，你做了什麼讓對方感到安全？「模仿對方的肢體語言」為什麼能增加親和感？這跟操控有什麼不同？",mistakes:"建立親和感最大的陷阱是「技巧化」——你刻意模仿對方的姿勢、故意用對方的詞彙，卻忘了最根本的事：你有沒有真的想理解這個人？如果動機不真誠，再精準的鏡像都會讓人感到不舒服。",skills:["下次對話時練習「配合對方的說話速度」這一個元素","在聆聽時減少給建議，增加「然後呢？」的好奇提問","觀察自己在什麼情況下會不自覺地「拉開距離」"],extVideos:[{youtubeId:"JQSy_zkHCZo",title:"NLP幫我改善與同事關係 增加親和感 NLP執行師證書課程畢業學員Charlie 分享 - Life Enrich",channel:"Denise Wah",duration:236,views:556,uploadDate:"20160329",note:"真實學員分享：學了 NLP 親和感技巧後，職場關係怎麼改變"},{youtubeId:"mfhDH2SLthg",title:"建立親和感最易犯的 8 個錯誤",channel:"Sam Jiang",duration:2960,views:218,uploadDate:"20200526",note:"反面教材：八個破壞親和感的常見錯誤，避免踩坑",ti 話的焦點。佛學說「無常」，也是一種最根本的換框：事情會變，所以現在的困境不是永恆的。"},selfCheck:"你能用換框法重新詮釋「被公司裁員」這件事嗎？「內容換框」和「情境換框」有什麼差異？佛學的「無常觀」如何幫助你面對人生低谷？你上次「想通了」一件事，是用了什麼樣的換框？",mistakes:"換框不是「正面思考毒雞湯」——不是叫你把所有壞事都說成好事。如果你失戀了，有人跟你說「這是好事！你自由了！」，你只會更難受。真正的換框是擴大視角，讓你看到更多可能性，而不是否定你的痛苦。",skills:["遇到負面事件時問自己：「十年後回看，這件事教會我什麼？」","練習「至少三個角度」法：任何事件都寫出三種不同的解讀","分辨「健康的換框」與「逃避現實的自我安慰」"],extVideos:[{youtubeId:"zoAf4wUxJQw",title:"逆向思維、帶你走出困境！",channel:"松明講心理",duration:362,views:66947,uploadDate:"20241219",note:"逆向思維就是一種強力換框：反過來想，問題反而有解"},{youtubeId:"cknvXQUdKBk",title:"懂逆向思维的人到底有多可怕？",channel:"思维空间 0505",duration:679,views:1773377,uploadDate:"20230415",note:"百萬觀看：逆向思維的威力，看高手如何把劣勢變優勢",tip:"找一個你目前的困境，試著用逆向思維重新看"},{youtubeId:"p1uCgPi-UJE",title:"【情感激勵】 正面思考雖然虛偽但有用 | 讓我告訴你為什麼要正面思考",channel:"鄭匡宇激勵達人",duration:185,views:12559,uploadDate:"20190515",note:"正面思考的「對」與「錯」：何時有用、何時是自欺欺人？"}]},{id:"u-perceptual-positions",name:"站在別人的角度看世界",tags:["核心技巧","同理心"],mainVideo:{youtubeId:"g7h6wDXOYHQ",title:"換位思考，通情達理，是一種高級的情商 Empathy, understanding, is a high-level emotional intelligence【愛學習】",channel:"Love to learn",duration:680,views:2916,uploadDate:"20210925",note:"NLP 的感知位置技術（Perceptual Positions）系統化了「換位思考」：第一位置看自己、第二位置看對方、第三位置看旁觀者。佛學的「無我」和「自他交換」也是在做同樣的事——當你不再只從「我」出發，理解的維度就打開了。"},selfCheck:"你能用 NLP 的三個感知位置分析一個最近的人際衝突嗎？「站在對方角度想」跟「放棄自己的立場」有什麼不同？佛學的「無我」是不是叫你沒有自我？它真正的意思是什麼？",mistakes:"換位思考的陷阱是「投射」——你以為自己站在對方角度了，但其實只是把自己的想法投射到對方身上。真正的第二位置需要你放下自己的判斷標準，用對方的價值觀去感受，這比想像中難得多。",skills:["遇到衝突時，花兩分鐘用「如果我是他/她」做完整的角色扮演","練習第三位置：像旁觀者一樣觀察自己和對方的互動","注意自己是在「換位思考」還是在「投射自己的想法」"],extVideos:[{youtubeId:"SH7HWfdJvFA",title:"練習換位思考，你也是溝通高手 -文大推廣教育部旅人心態課程",channel:"natural box",duration:89,views:59866,uploadDate:"20220913",note:"一分半鐘的精華：換位思考如何讓你成為溝通高手"},{youtubeId:"8mEZsvlUhRg",title:"【💞同理心計畫💞】Think, Listen, and Respect｜同情心不等於同理心",channel:"Moin Moin百靈佳殷格翰",duration:99,views:17017,uploadDate:"20190223",note:"同情心 vs 同理心：它們看起來像但本質完全不同",tip:"想想你平常給的是同情還是同理？"},{youtubeId:"H0fu5rOqPos",title:"學會站在別人的角度思考，更容易解決事情",channel:"Rich 富有一直來",duration:109,views:19551,uploadDate:"20170807",note:"實例說明換位思考如何直接幫助解決問題"}]}]},{id:"ch-integration",name:"內在整合",icon:"☯️",units:[{id:"u-parts-integration",name:"化解內心的拉扯與矛盾",tags:["進階技巧","內在和諧"],mainVideo:{youtubeId:"lGkd-NE-2cw",title:"情緒按鈕為什麼經常那麼容易爆發? 是脾氣不好嗎?  EP.185 ｜ SPECIAL Jade身心靈療癒師😇",channel:"Special Jade 身心靈療癒師",duration:490,views:557,uploadDate:"20221104",note:"NLP 的「部分整合」（Parts Integration）處理的就是內心不同部分的拉扯——想減肥的你 vs 想吃的你，想離職的你 vs 害怕的你。這支影片從「情緒按鈕為什麼容易爆發」切入，探索那些你無法控制的反應背後，是哪些內在部分在作祟。佛學的中道思維也是在說：不走極端，找到和諧。"},selfCheck:"你有沒有「我明明知道該怎麼做，但就是做不到」的經驗？你心裡有哪兩個聲音在拉扯？如果讓它們坐下來對話，它們各自想保護你的什麼？佛學的「中道」如何幫助你不在兩個極端之間擺盪？",mistakes:"面對內心矛盾時，最常見的錯誤是選邊站——認定一個聲音是「對的」、另一個是「壞的」。其實兩個聲音都在保護你，只是用了不同的策略。部分整合的關鍵是讓它們都被聽到，找到共同的目的。",skills:["找出一個你的內在矛盾，寫下兩個聲音各自在說什麼","問每個內在聲音：「你這樣做是為了保護我的什麼？」","練習中道思維：不是非A即B，而是找到AB都能接受的C"],extVideos:[{youtubeId:"EdbhGUlfLxk",title:"淨空法師：【靜坐頻率】調和個人內在衝突，可以調和全球性衝突",channel:"HZTV華藏衛視",duration:225,views:5168,uploadDate:"20160808",note:"佛學視角：內在衝突的調和是一切和平的起點"},{youtubeId:"bSVagjuvyQI",title:"禪者之弦：松則無聲，緊則斷，中道生樂",channel:"Lao Dan",duration:3859,views:1420,uploadDate:"20250813",note:"佛陀的經典比喻：弦太松沒聲音、太緊會斷，中道才能奏出美妙音樂",tip:"這個比喻就是「部分整合」的佛學版，找到張力的平衡點"},{youtubeId:"fJQQlMeJViY",title:"【話說星雲大師】慧知法師｜解決困境(上)",channel:"佛光山人間衛視",duration:2840,views:26677,uploadDate:"20230711",note:"星雲大師如何用佛學智慧處理人生困境中的兩難"}]},{id:"u-timeline",name:"釋放過去，設計未來",tags:["進階技巧","時間線"],mainVideo:{youtubeId:"GtWCdADwH6Y",title:"創造幸運人生　第四集(時間線的治療、扭轉成人後問題真實個案)",channel:"天泰策劃",duration:1456,views:4747,uploadDate:"20160206",note:"NLP 的時間線技術（Timeline Therapy）讓你在想像中「回到過去」釋放負面情緒，然後「走向未來」植入正面資源。這支影片用真實個案展示時間線治療的完整過程。佛學的因果觀和「活在當下」提供了更深的哲學基礎——過去不可改變，但你與過去的關係可以改變。"},selfCheck:"你有沒有一件「過去的事」到現在還影響你的情緒？如果可以改變你對那件事的「感覺」而不是事件本身，你願意嗎？佛學說「活在當下」，但時間線技術要你回到過去——這兩者矛盾嗎？還是互補？",mistakes:"時間線技術不是「刪除記憶」或「假裝過去沒發生」。它改變的是你對過去事件的情緒反應和認知框架，事件本身的記憶不會消失。如果你期待一次時間線就「什麼都不記得了」，那是錯誤的期待。",skills:["完成一次簡單的時間線練習：閉眼想像自己飄到過去事件的上方，以旁觀者角度重看","理解「改變對過去的感覺」和「否認過去」的根本差異","連結佛學因果觀：過去的因已種，但未來的果由現在決定"],extVideos:[{youtubeId:"GuHQsCv86q8",title:"【#NLP講堂】時間線療法--穿梭時空當然做得到啊！",channel:"NLP心理學彭博",duration:172,views:1655,uploadDate:"20200119",note:"彭博老師用輕鬆的方式解釋時間線療法的原理與流程"},{youtubeId:"IcojeQrXZ4I",title:'我對"時間線"的看法',channel:"jean johnson",duration:321,views:1133,uploadDate:"20170614",note:"NLP 資深講師對時間線技術的個人見解與使用心得"},{youtubeId:"N9l_haFP7HQ",title:"時間線-2",channel:"jean johnson",duration:352,views:747,uploadDate:"20170621",note:"時間線技術的進階講解，搭配第一支一起看更完整",tip:"建議先看上一支再看這支"}]}]}]},{id:"action",name:"行動力 — 目標與卓越",chapters:[{id:"ch-direction",name:"設定方向",icon:"🎯",units:[{id:"u-well-formed-outcomes",name:"你真正想要什麼？明確目標設定法",tags:["核心技巧","目標"],mainVideo:{youtubeId:"8UAuh6Hx6AI",title:"如何設定且達到目標？Part 1｜找到 & 制定有效的目標！| Why學生",channel:"學生Why",duration:465,views:34392,uploadDate:"20171215",note:"NLP 的「明確成果框架」（Well-Formed Outcomes）要求目標必須具備特定條件：正面表述、可感知、你能控制、有生態平衡。這支影片從「如何找到有效目標」開始，教你設定真正能達成的目標。佛學的正見、正思維也是從「你到底要往哪走」開始。"},selfCheck:"你目前最重要的目標是什麼？它是用正面語言（我要⋯⋯）還是負面語言（我不要⋯⋯）表述的？你怎麼知道自己達成了？有什麼具體的感官證據？達成這個目標只靠你自己就夠了嗎？",mistakes:"目標設定最大的錯誤是「目標太模糊」或「目標是別人的」。「我想成功」不是目標，「我想在今年底前完成⋯⋯」才是。同樣，「爸媽希望我考公務員」是別人的目標，不是你的。NLP 要求目標必須由你自己驅動。",skills:["用 NLP 成果框架重新檢視你目前最重要的三個目標","練習把每個目標轉成正面表述：「我要」取代「我不要」","為每個目標設定至少一個可觀察的「達成證據」"],extVideos:[{youtubeId:"xEJcTGPgsV0",title:"七個可以提升人生上限的思維模型！",channel:"松明講心理",duration:1068,views:1292708,uploadDate:"20241002",note:"百萬觀看的思維模型合集，多個模型跟目標設定直接相關",tip:"看完選一個最適合你的思維模型開始練習"},{youtubeId:"lNcLZdNAGQA",title:"第一次建立目標就上手！3 分鐘帶你解析曼陀羅九宮格！和大谷翔平學「自律」！",channel:"Will Be Good! 黃士豪",duration:212,views:21551,uploadDate:"20240208",note:"大谷翔平的曼陀羅九宮格是目標設定的經典工具"},{youtubeId:"IsqYueUPojk",title:"如何設定年度目標？2026年度計畫完整公開！",channel:"薑餅資",duration:792,views:37706,uploadDate:"20260107",note:"實際的年度目標設定流程分享，可以直接跟著做",tip:"拿出紙筆，跟著影片一起設定你的目標"}]},{id:"u-ecology-check",name:"生態檢查：好目標不會傷害其他面向",tags:["核心技巧","目標","平衡"],mainVideo:{youtubeId:"qyJWJhPArec",title:"【一連七集，第五】哈佛知識分享: Trade-offs 如何「取捨」?你要取得更多，就要捨棄更多。",channel:"李根興 Edwin 商舖創業分享 Shop PRO",duration:929,views:3491,uploadDate:"20210929",note:"NLP 的生態檢查（Ecology Check）問的是：「達成這個目標，會不會傷害你生命中其他重要的東西？」這支影片從哈佛的「取捨」概念出發，讓你看到每個選擇背後的代價。佛學的因果思維也在問同樣的問題：這個行動的業力影響是什麼？"},selfCheck:"你目前追求的目標，有沒有讓你犧牲健康、家庭或重要關係？如果達成目標需要十年，你願意嗎？這十年你會失去什麼？佛學的「因果」觀如何幫助你在做選擇前想清楚後果？",mistakes:"生態檢查不是叫你「什麼都顧到所以什麼都不做」。重點是在行動前有意識地看到取捨，做出你願意承擔的選擇——而不是追到一半才發現「原來代價這麼大」。有意識的取捨不是猶豫，而是智慧。",skills:["為你的目標做一次「生態檢查」：列出它可能影響的五個生活面向","練習「如果⋯⋯那麼⋯⋯」的因果推演：達成目標後，你的生活會變成什麼樣？","區分「我害怕所以不敢做」和「我看清代價後選擇不做」的差異"],extVideos:[{youtubeId:"f8LCmOMuFAc",title:"EP229 想找到適合自己的 #人生目標？從認識自己的大腦開始｜大人的Small Talk",channel:"大人學",duration:2418,views:133707,uploadDate:"20220214",note:"從認識自己的大腦開始找目標，確保目標真的是你要的",tip:"先搞清楚「你是誰」再決定「你要什麼」"},{youtubeId:"Aag7owZ71A0",title:"我是如何判斷該不該離職？用這3個問題幫你做出決定！",channel:"Katy Tu",duration:613,views:152457,uploadDate:"20231022",note:"離職決策就是生態檢查的實戰：三個問題幫你想清楚取捨"},{youtubeId:"kKFEsXRIGQs",title:"弘一法師：錢有因果業力，祂會自己來找你！放下3大心魔，調對吸金頻率",channel:"青燈古佛畔",duration:2284,views:36898,uploadDate:"20260427",note:"佛學因果觀應用在財富面向：你的行動會產生什麼業力？",tip:"不論是否認同宗教觀點，「行動有後果」的思維值得深思"}]}]},{id:"ch-excellence",name:"學習卓越",icon:"⭐",units:[{id:"u-modeling",name:"拆解高手的思維策略",tags:["核心技巧","學習"],mainVideo:{youtubeId:"lgauF-cC3os",title:"真正的高手都具備的能力 | 破局思維 | 解決所有問題的思維模式？",channel:"富人俱樂部",duration:577,views:511559,uploadDate:"20220228",note:"NLP 的「模仿卓越」（Modeling Excellence）核心理念是：任何人的成功背後都有一套可以拆解的思維策略。這支影片講解高手共同具備的「破局思維」，正是可以被模仿的思維模式。佛學的「聞思修」三學也是同樣的學習框架——聽到、思考、實踐。"},selfCheck:"你生活中有沒有一個「你想像他/她一樣」的人？你知道他/她做了什麼而你沒做嗎？如果要「模仿」這個人的成功，你需要複製他/她的哪些思維模式和行為？「聞思修」的三個步驟你通常卡在哪一步？",mistakes:"模仿卓越最常見的錯誤是「只模仿表面行為」——看到別人早起就跟著早起，卻不理解他早起是為了什麼。NLP 的 Modeling 要求你深入到「信念→策略→行為」三個層次，只複製行為卻沒有對應的信念，效果非常有限。",skills:["選一個你想模仿的對象，分析他的「信念-策略-行為」三層結構","練習「如果我是他，面對這個問題我會怎麼想？」的思維演練","把佛學「聞思修」應用在學習新技能：聽→想通→做到"],extVideos:[{youtubeId:"3UiUm37BvM8",title:"Ep555.如何自學成才丨20小時就可以由0開始學會任何技能丨NLP丨Josh Kaufman",channel:"暴走的陳老C",duration:1049,views:12569,uploadDate:"20230808",note:"20 小時學會任何技能的四步驟法，源自 NLP 的快速學習理念"},{youtubeId:"R3sxCxpJNTY",title:"EP.121 《高手學習》讀後心得：學校老師沒有教你的三個秘訣",channel:"下一本讀什麼?",duration:1659,views:4125,uploadDate:"20211224",note:"高手學習的三個秘訣，與 NLP 模仿卓越的方法論高度吻合"},{youtubeId:"6KUZhtfTLD8",title:"學習釋家法，不是一味的指望讀經，必須經過這三步驟，才能正確入門！",channel:"禪心之道",duration:2288,views:31527,uploadDate:"20260324",note:"佛學「聞思修」的完整解說：聽聞→思考→實修，正是最古老的學習框架",tip:"對比 NLP 的學習方式：兩者的核心步驟幾乎一樣"}]},{id:"u-strategy",name:"把別人的智慧變成自己的",tags:["核心技巧","學習","策略"],mainVideo:{youtubeId:"gOCN-mU7qkg",title:"如何讓大腦變強？► 每天做好這兩件事 🧠 - Dr. Andrew Huberman 安德魯．胡伯曼博士（中英字幕）",channel:"Wisdom Bread 智慧麵包",duration:225,views:1055759,uploadDate:"20240810",note:"NLP 的策略萃取（Strategy Elicitation）是把別人的成功模式轉化為可複製的步驟。Huberman 博士用神經科學解釋大腦如何學習和強化，這正是策略萃取的生理基礎——理解大腦運作，才能更有效地「安裝」新策略。"},selfCheck:"你最近學會了什麼新技能？你能把學會它的過程拆解成具體步驟嗎？如果要教別人你最擅長的事，你會怎麼描述你的思考順序？你覺得「天賦」和「策略」哪個更重要？",mistakes:"策略萃取的陷阱是「以為別人的策略直接套用在自己身上就會有效」。每個人的內在地圖不同，同一個策略在不同人身上需要微調。重點不是100%複製，而是理解底層邏輯後根據自己的特質調整。",skills:["選一個你擅長的事，寫出你的「思考-感受-行動」策略流程","訪問一個你佩服的人：「你做這件事時腦中在想什麼？」","理解佛學師承的意義：不只是學知識，更是學思維方式"],extVideos:[{youtubeId:"xwjBsSGnDPY",title:"麥肯錫新人邏輯思考 5 堂課 / 一生受用的邏輯思考法則",channel:"立立的理財之旅",duration:519,views:8014,uploadDate:"20230611",note:"麥肯錫的思考法則就是被萃取出來的頂尖策略"},{youtubeId:"lR5HQ6zCHKE",title:"如何成為解決複雜問題的高手：系統思考之根本解",channel:"思考者的金手指",duration:545,views:12738,uploadDate:"20210425",note:"系統思考是一種高階策略，學會它能看到別人看不到的問題結構"},{youtubeId:"IbDmJbS1SjY",title:"無法聞思修時，還有其他方法學佛嗎？",channel:"達賴喇嘛",duration:211,views:4916,uploadDate:"20210524",note:"達賴喇嘛談學習的替代路徑：當標準方法行不通時該怎麼辦",tip:"學習方法也需要彈性，這本身就是 NLP 的精神"}]}]}]},{id:"practice",name:"實戰應用 — 工作與生活的整合",chapters:[{id:"ch-daily",name:"日常修練場",icon:"💼",units:[{id:"u-workplace",name:"職場溝通：NLP × 佛學的人際智慧",tags:["實戰","職場"],mainVideo:{youtubeId:"jUTzaTxV4RA",title:"自我成長｜職場心理學｜NLP ｜如何運用薩提爾模式，來應對職場衝突",channel:"徐承庚-NLP豐盛你的人生",duration:712,views:242,uploadDate:"20230521",note:"職場是練習所有 NLP 技巧的最佳道場。這支影片結合 NLP 和薩提爾模式，示範如何在職場衝突中保持覺察、建立連結、化解對立。佛學的慈悲心在這裡化為具體行動：不是軟弱的退讓，而是帶著理解的堅定。"},selfCheck:"你上次在職場遇到衝突時，是用什麼策略處理的？回想那個場景，如果你用了「先跟後帶」會不會不一樣？你的主管或同事有哪些「情緒按鈕」是你可以注意避開的？在辦公室裡「保持慈悲心」跟「被當軟柿子」怎麼區分？",mistakes:"在職場用 NLP 最大的陷阱是「過度分析」——你開始用理論套每個人的行為，反而失去了自然的互動。NLP 是工具不是標籤，不要在心裡把同事分類成「視覺型」「聽覺型」就覺得懂了他們。",skills:["本週在一次會議中練習「先配合三句再提反對意見」","觀察一位你覺得溝通很好的同事，分析他/她用了哪些技巧","在被批評時練習「暫停三秒→深呼吸→回應」的覺
