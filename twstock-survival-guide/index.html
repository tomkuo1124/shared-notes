<script>window.COURSE_DATA={title:"台股投資生存指南",storageKey:"twstock-survival",subtitle:"在 AI 熱潮、市場過熱與地緣政治風險下，建立能長期活下來的台股投資方法",stance:[{title:"立場一：先求活下來，再求賺得多",body:"這門課不教你抓飆股、不報明牌。在 AI 行情狂熱、指數屢創新高的時候，我們認為最重要的能力是風險控管與紀律——歷史上每一次「這次不一樣」的行情，最後活得好的都是部位控制得當的人。所有單元的順序都是「先懂風險、再談報酬」。"},{title:"立場二：教判斷框架，不教預測",body:"沒有人能穩定預測美伊衝突怎麼演變、Fed 何時轉向、AI 資本支出何時見頂。這門課策展的影片都在建立「面對不確定性的決策框架」：如何評估過熱訊號、如何配置部位、如何在事件發生時不做蠢事，而不是猜測明天漲跌。"},{title:"立場三：本站非投資建議（免責聲明）",body:"本站為 YouTube 教學資源的策展與學習路徑整理，所有內容僅供教育用途，不構成任何投資建議或要約。影片皆標註發布日期——市場判斷類內容（AI 行情、地緣政治、利率環境）具強烈時效性，請以發布時間為背景理解，投資決策請自行判斷並自負盈虧。"}],parts:[{id:"mindset",name:"心態篇",chapters:[{id:"ch1",name:"投資前的自我定位",icon:"🧠",units:[{id:"u-invest-vs-speculate",name:"投資與投機的差別",tags:["觀念主題"],mainVideo:{youtubeId:"3vzAh8KGXIY",title:"投資和投機有什麼分別？投資失敗的人缺乏考慮什麼？",channel:"美投大發現",duration:482,views:10493,uploadDate:"20210620",note:"八分鐘把「投資賺的是資產成長的錢、投機賺的是價格波動的錢」講清楚，並點出失敗者共同缺乏的思考：進場前沒想過自己憑什麼贏。做為整門課的第一支影片最合適——先定位自己在做什麼，後面的策略選擇才有意義。"},selfCheck:"看完後你應該能回答：投資與投機的核心差別是什麼——是標的不同，還是「獲利來源與持有邏輯」不同？你現在手上的每一筆部位，各是投資還是投機？當你追買 AI 概念股時，你賺的是公司成長的錢，還是指望下一個人用更高價接手？投機不是罪，但你能不能在買進前就說出這筆的退場條件？",mistakes:"把「買股票」一律當成投資。多數新手實際做的是沒有計畫的投機——聽消息進場，漲了說自己是投資眼光好，跌了才改口要「長期投資」。進場理由與退場條件都是事後才發明的，這正是投機者虧損的標準劇本。",skills:["能說出任一筆交易是投資還是投機，以及判斷依據","買進前先寫下進場邏輯與退場條件，而不是事後解釋","分辨「公司賺錢」與「股價上漲」是兩件不同的事"],extVideos:[{youtubeId:"PsuZa9HYGIU",title:"【投資與投機】原來投資與投機有差別？！投機就是賭博嗎？",channel:"投資好朋友 BOS價值投資",duration:219,views:3230,uploadDate:"20200108",note:"從價值投資視角補充：投機不等於賭博，差別在有沒有計算過期望值與安全邊際。",tip:"注意影片中「風險來自你不知道自己在做什麼」這句話的展開"},{youtubeId:"VFXR9RFzwA4",title:"【金研小教室】投資、投機傻傻分不清楚？你是在投資還是在投機？",channel:"金融沙龍 Bankers’ Salon",duration:255,views:3259,uploadDate:"20210625",note:"四分鐘快速版，用持有期間、報酬來源、風險承擔三個維度做對照表，適合複習。"},{youtubeId:"dmr1yxmAeo0",title:"本金小應該要投資還是投機？巴菲特還是 Mark Minervini 賺比較多？",channel:"股思GoodStock",duration:504,views:1075,uploadDate:"20210603",note:"直面新手最誠實的問題：本金小是不是該投機拚一把？用兩種路線的真實報酬做比較，結論可能跟你直覺相反。",tip:"拿自己的本金與可投入時間，重算一次影片中的比較"}]},{id:"u-active-vs-passive",name:"主動 vs 被動：你適合哪一種",tags:["決策主題"],mainVideo:{yout
